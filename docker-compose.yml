# Wise local stack.
# Phase 1: Postgres, API, dashboard. Phase 2: agent runtime.
# Phase 3: Temporal (on the shared Postgres), Temporal UI and the orchestrator.
# Pinned image versions are listed in infrastructure/docker/versions.env.
name: wise

x-api-env: &api-env
  # Secrets are Docker secrets (files under /run/secrets, sourced from .env below); NAME_FILE sets NAME.
  WISE_DATABASE_URL: postgres://wise@postgres:5432/wise?sslmode=disable
  WISE_POSTGRES_PASSWORD_FILE: /run/secrets/wise_postgres_password
  WISE_HTTP_ADDR: ":8080"
  WISE_REPO_ROOTS: ${WISE_REPO_ROOT:?set WISE_REPO_ROOT in .env}
  WISE_SESSION_TTL: ${WISE_SESSION_TTL:-168h}
  WISE_COOKIE_SECURE: ${WISE_COOKIE_SECURE:-false}
  WISE_TRUST_PROXY_HEADERS: "true"
  WISE_LOG_LEVEL: ${WISE_LOG_LEVEL:-info}
  WISE_BOOTSTRAP_ADMIN_USER: ${WISE_BOOTSTRAP_ADMIN_USER:-}
  WISE_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/wise_bootstrap_admin_password
  WISE_RUNTIME_TOKEN_FILE: /run/secrets/wise_runtime_token
  # LM Studio on the host (enable "Serve on Local Network" so containers can reach it).
  WISE_LMSTUDIO_URL: ${WISE_LMSTUDIO_DOCKER_URL:-http://host.docker.internal:1234/v1}
  WISE_LMSTUDIO_MODEL: ${WISE_LMSTUDIO_MODEL:-}
  WISE_LMSTUDIO_API_KEY_FILE: /run/secrets/wise_lmstudio_api_key
  # Long-lived subscription token from `claude setup-token` (enables the claude-code provider).
  CLAUDE_CODE_OAUTH_TOKEN_FILE: /run/secrets/claude_code_oauth_token
  HOME: /tmp
  # Encrypts stored account credentials (32 random bytes, base64).
  WISE_SECRETS_KEY_FILE: /run/secrets/wise_secrets_key
  # Claude Code / Codex calls run in the isolated CLI runner.
  WISE_CLI_RUNNER_URL: http://wise-cli-runner:8090
  WISE_CLI_RUNNER_TOKEN_FILE: /run/secrets/wise_cli_runner_token
  # Task workspaces and sandboxes run in the executor.
  WISE_EXECUTOR_URL: http://wise-executor:8091
  WISE_EXECUTOR_TOKEN_FILE: /run/secrets/wise_executor_token
  # Coding runners' Runtime Proxy (API-key accounts).
  WISE_MODEL_PROXY_URL: http://wise-model-proxy:8095
  WISE_MODEL_PROXY_TOKEN_FILE: /run/secrets/wise_model_proxy_token
  # The git worker asks the API for push grants with this token (only the API and the worker hold it).
  WISE_GIT_WORKER_TOKEN_FILE: /run/secrets/wise_git_worker_token

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    secrets: [wise_postgres_password]
    environment:
      POSTGRES_USER: wise
      POSTGRES_DB: wise
      POSTGRES_PASSWORD_FILE: /run/secrets/wise_postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Bound to loopback for the local dev loop (`make dev`) and psql access.
      - "127.0.0.1:${WISE_POSTGRES_PORT:-5433}:5432"
    networks: [data, workflow]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wise -d wise"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb

  wise-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      # Build with the host network (more reliable than the bridge on some networks).
      network: host
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        INSTALL_CLAUDE_CODE: ${INSTALL_CLAUDE_CODE:-true}
        APK_MIRROR: ${APK_MIRROR:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    secrets: [wise_postgres_password, wise_bootstrap_admin_password, wise_runtime_token, wise_lmstudio_api_key, claude_code_oauth_token, wise_secrets_key, wise_cli_runner_token, wise_executor_token, wise_model_proxy_token, wise_git_worker_token]
    environment: *api-env
    # Run as the host user so repositories under WISE_REPO_ROOT are readable.
    user: "${WISE_UID:-1000}:${WISE_GID:-1000}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      # Mounted read-only at the same path so host paths work unchanged.
      - ${WISE_REPO_ROOT}:${WISE_REPO_ROOT}:ro
      # Model aliases and policies; edit on the host, restart the API to apply.
      - ./configs:/app/configs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    networks: [data, edge, runtime, cli, exec, git]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  # One-shot: Temporal's role and databases in the shared Postgres.
  temporal-db-init:
    image: pgvector/pgvector:0.8.1-pg17
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/init-db.sh"]
    environment:
      PGPASSWORD: ${WISE_POSTGRES_PASSWORD}
      TEMPORAL_DB_PASSWORD: ${WISE_TEMPORAL_DB_PASSWORD:?set WISE_TEMPORAL_DB_PASSWORD in .env}
    volumes:
      - ./infrastructure/temporal/init-db.sh:/scripts/init-db.sh:ro
    networks: [data]
    restart: "no"

  # One-shot: installs or upgrades Temporal's schemas.
  temporal-schema:
    image: temporalio/admin-tools:1.32.1
    depends_on:
      temporal-db-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/scripts/setup-schema.sh"]
    environment:
      SQL_PASSWORD: ${WISE_TEMPORAL_DB_PASSWORD}
    volumes:
      - ./infrastructure/temporal/setup-schema.sh:/scripts/setup-schema.sh:ro
    networks: [data]
    <<: *hardened
    restart: "no"

  temporal:
    image: temporalio/server:1.32.1
    restart: unless-stopped
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${WISE_TEMPORAL_DB_PASSWORD}
      BIND_ON_IP: 0.0.0.0
      LOG_LEVEL: ${WISE_TEMPORAL_LOG_LEVEL:-warn}
      TEMPORAL_ALLOW_NO_AUTH: "true"
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig.yaml
    volumes:
      - ./infrastructure/temporal/dynamicconfig.yaml:/etc/temporal/dynamicconfig.yaml:ro
    ports:
      # Loopback only (no auth on the frontend): used by `make dev` and the temporal CLI.
      - "127.0.0.1:${WISE_TEMPORAL_PORT:-7233}:7233"
    networks: [data, workflow]
    <<: *hardened
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7233"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  temporal-ui:
    image: temporalio/ui:2.57.0
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: wise
      TEMPORAL_CORS_ORIGINS: http://127.0.0.1:${WISE_TEMPORAL_UI_PORT:-8233}
    ports:
      - "127.0.0.1:${WISE_TEMPORAL_UI_PORT:-8233}:8080"
    networks: [data]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # Temporal worker + workflow command dispatcher (same image as the API).
  # Internal network only: Postgres and Temporal, no internet, no model credentials.
  wise-orchestrator:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      network: host
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        INSTALL_CLAUDE_CODE: ${INSTALL_CLAUDE_CODE:-true}
        APK_MIRROR: ${APK_MIRROR:-}
    command: ["orchestrator"]
    restart: unless-stopped
    depends_on:
      wise-api:
        condition: service_healthy
      temporal:
        condition: service_healthy
    secrets: [wise_postgres_password, wise_executor_token, wise_git_push_token]
    environment:
      WISE_DATABASE_URL: postgres://wise@postgres:5432/wise?sslmode=disable
      WISE_POSTGRES_PASSWORD_FILE: /run/secrets/wise_postgres_password
      WISE_LOG_LEVEL: ${WISE_LOG_LEVEL:-info}
      WISE_TEMPORAL_ADDRESS: temporal:7233
      WISE_TEMPORAL_NAMESPACE: wise
      WISE_EXECUTOR_URL: http://wise-executor:8091
      WISE_EXECUTOR_TOKEN_FILE: /run/secrets/wise_executor_token
      # Calls the git worker with approval ids only; never holds a git token.
      WISE_GIT_WORKER_URL: http://wise-git-worker:8096
      WISE_GIT_PUSH_TOKEN_FILE: /run/secrets/wise_git_push_token
    user: "${WISE_UID:-1000}:${WISE_GID:-1000}"
    <<: *hardened
    tmpfs: [/tmp]
    volumes:
      - ./configs:/app/configs:ro
    networks: [workflow, exec, git]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # The executor's only access to Docker: a filtering proxy (containers, exec,
  # images, networks). It limits API endpoints, not container parameters, so
  # the executor itself is trusted code that builds every sandbox from a
  # fixed template (docs/decisions/0007-engineering-pipeline.md).
  wise-docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 1
      NETWORKS: 1
      POST: 1
      PING: 1
      VERSION: 1
      EVENTS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs: [/run, /tmp, /var/lib/haproxy]
    networks: [docker]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }

  # Makes the workspaces volume writable by the host user (runs once).
  wise-workspaces-init:
    image: alpine:3.23
    command: ["chown", "${WISE_UID:-1000}:${WISE_GID:-1000}", "/workspaces"]
    restart: "no"
    volumes:
      - wise-workspaces:/workspaces
    network_mode: none

  # Copies the pinned coding CLIs (Claude Code, Codex) into their volume; runners
  # mount it read-only. Build the image with `make toolchains`.
  wise-clis-init:
    image: wise-coding-clis:${CODING_CLIS_TAG:-2.1.319-0.163.0}
    command: ["cp", "-a", "/clis/.", "/target/"]
    restart: "no"
    volumes:
      - wise-coding-clis:/target
    network_mode: none

  # Trusted execution worker: clones task workspaces, runs sandboxes and
  # delivers approved branches. The only service that can write to
  # repositories (only to add wise/… branches) and start containers.
  wise-executor:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      network: host
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        INSTALL_CLAUDE_CODE: "false"
        APK_MIRROR: ${APK_MIRROR:-}
    command: ["executor"]
    restart: unless-stopped
    depends_on:
      wise-docker-proxy:
        condition: service_started
      wise-workspaces-init:
        condition: service_completed_successfully
      wise-clis-init:
        condition: service_completed_successfully
    secrets: [wise_executor_token, wise_egress_token]
    environment:
      WISE_CODING_CLIS_VOLUME: wise-coding-clis
      WISE_EXECUTOR_TOKEN_FILE: /run/secrets/wise_executor_token
      WISE_EGRESS_TOKEN_FILE: /run/secrets/wise_egress_token
      WISE_REPO_ROOTS: ${WISE_REPO_ROOT}
      WISE_DOCKER_HOST: tcp://wise-docker-proxy:2375
      WISE_WORKSPACES_VOLUME: wise-workspaces
      WISE_SANDBOX_USER: "${WISE_UID:-1000}:${WISE_GID:-1000}"
      WISE_LOG_LEVEL: ${WISE_LOG_LEVEL:-info}
      HOME: /tmp
    user: "${WISE_UID:-1000}:${WISE_GID:-1000}"
    <<: *hardened
    tmpfs: [/tmp]
    volumes:
      - wise-workspaces:/workspaces
      - ${WISE_REPO_ROOT}:${WISE_REPO_ROOT}
    networks: [exec, docker]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  # The only way out of sandboxes: allowlisted package registries, never
  # private addresses. Joins each sandbox's private network.
  wise-egress:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      network: host
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        INSTALL_CLAUDE_CODE: "false"
        APK_MIRROR: ${APK_MIRROR:-}
    command: ["egress"]
    restart: unless-stopped
    labels:
      wise.role: egress
    secrets: [wise_egress_token]
    environment:
      # Read-only: it can only fetch the egress allowlist from the executor.
      WISE_EGRESS_TOKEN_FILE: /run/secrets/wise_egress_token
      WISE_EXECUTOR_URL: http://wise-executor:8091
      WISE_LOG_LEVEL: ${WISE_LOG_LEVEL:-info}
    user: "${WISE_UID:-1000}:${WISE_GID:-1000}"
    <<: *hardened
    networks: [exec, sandbox-egress]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  # Runtime Proxy: coding-CLI runners call models with a per-run token; the
  # real API key is injected here (never in a sandbox), usage and budgets are
  # enforced. Joins a run's private network only for that run.
  wise-model-proxy:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      network: host
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        INSTALL_CLAUDE_CODE: "false"
        APK_MIRROR: ${APK_MIRROR:-}
    command: ["model-proxy"]
    restart: unless-stopped
    labels:
      wise.role: model-proxy
    secrets: [wise_model_proxy_token]
    environment:
      WISE_MODEL_PROXY_TOKEN_FILE: /run/secrets/wise_model_proxy_token
      WISE_LOG_LEVEL: ${WISE_LOG_LEVEL:-info}
    user: "${WISE_UID:-1000}:${WISE_GID:-1000}"
    <<: *hardened
    networks: [exec, model-egress]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  # The only component that pushes to git hosts or opens pull requests. It gets
  # approval ids from the orchestrator, asks the API for a grant (the token for
  # that one push), reads the approved commit from the workspaces volume
  # (read-only) and pushes create-only to a wise/… branch. No Docker, no user
  # repositories, no database.
  wise-git-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      network: host
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        INSTALL_CLAUDE_CODE: "false"
        APK_MIRROR: ${APK_MIRROR:-}
    command: ["git-worker"]
    restart: unless-stopped
    labels:
      wise.role: git-worker
    secrets: [wise_git_push_token, wise_git_worker_token]
    environment:
      WISE_GIT_PUSH_TOKEN_FILE: /run/secrets/wise_git_push_token
      WISE_GIT_WORKER_TOKEN_FILE: /run/secrets/wise_git_worker_token
      WISE_API_INTERNAL_URL: http://wise-api:8080/api/v1
      WISE_LOG_LEVEL: ${WISE_LOG_LEVEL:-info}
      HOME: /tmp
    user: "${WISE_UID:-1000}:${WISE_GID:-1000}"
    <<: *hardened
    tmpfs: [/tmp]
    volumes:
      - wise-workspaces:/workspaces:ro
    networks: [git, git-egress]
    deploy:
      resources:
        limits: { cpus: "1", memory: 256M }

  # Runs Claude Code / Codex for the API. No database, repositories or control-plane
  # secrets: each request carries the one account credential it needs. Internet
  # egress only (the CLIs talk to their vendors).
  wise-cli-runner:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      network: host
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        INSTALL_CLAUDE_CODE: ${INSTALL_CLAUDE_CODE:-true}
        APK_MIRROR: ${APK_MIRROR:-}
    command: ["cli-runner"]
    restart: unless-stopped
    secrets: [wise_cli_runner_token]
    environment:
      WISE_CLI_RUNNER_TOKEN_FILE: /run/secrets/wise_cli_runner_token
      WISE_LOG_LEVEL: ${WISE_LOG_LEVEL:-info}
      HOME: /tmp
    user: "${WISE_UID:-1000}:${WISE_GID:-1000}"
    <<: *hardened
    tmpfs: [/tmp]
    networks: [cli, cli-egress]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  wise-agent-runtime:
    build:
      context: .
      dockerfile: apps/agent-runtime/Dockerfile
      # Build with the host network (more reliable than the bridge on some networks).
      network: host
    restart: unless-stopped
    depends_on:
      wise-api:
        condition: service_healthy
    secrets: [wise_runtime_token]
    environment:
      WISE_API_URL: http://wise-api:8080
      WISE_RUNTIME_TOKEN_FILE: /run/secrets/wise_runtime_token
      WISE_REPO_ROOTS: ${WISE_REPO_ROOT}
    user: "${WISE_UID:-1000}:${WISE_GID:-1000}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ${WISE_REPO_ROOT}:${WISE_REPO_ROOT}:ro
    # Internal network only: the runtime can reach the API and nothing else.
    networks: [runtime]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  # Code indexer: same image as the agent runtime. Reads repositories read-only,
  # parses them with tree-sitter and uploads the index through the runtime API;
  # no database access and no egress.
  wise-indexer:
    build:
      context: .
      dockerfile: apps/agent-runtime/Dockerfile
      network: host
    command: ["python", "-m", "wise_runtime", "indexer"]
    restart: unless-stopped
    depends_on:
      wise-api:
        condition: service_healthy
    secrets: [wise_runtime_token]
    environment:
      WISE_API_URL: http://wise-api:8080
      WISE_RUNTIME_TOKEN_FILE: /run/secrets/wise_runtime_token
      WISE_REPO_ROOTS: ${WISE_REPO_ROOT}
      WISE_RUNTIME_ID: indexer
    user: "${WISE_UID:-1000}:${WISE_GID:-1000}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ${WISE_REPO_ROOT}:${WISE_REPO_ROOT}:ro
    networks: [runtime]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }

  wise-dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      # Build with the host network (more reliable than the bridge on some networks).
      network: host
    restart: unless-stopped
    depends_on:
      wise-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WISE_DASHBOARD_PORT:-5173}:8080"
    networks: [edge]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

networks:
  data: {}
  edge: {}
  runtime:
    internal: true
  # Orchestrator <-> Postgres/Temporal, no egress.
  workflow:
    internal: true
  # API <-> CLI runner.
  cli:
    internal: true
  # CLI runner -> internet (Anthropic, OpenAI).
  cli-egress: {}
  # API/orchestrator <-> executor, executor <-> egress proxy.
  exec:
    internal: true
  # Executor -> Docker socket proxy.
  docker:
    internal: true
  # Orchestrator/API <-> git worker.
  git:
    internal: true
  # Git worker -> git hosts.
  git-egress: {}
  # Egress proxy -> internet (allowlisted registries only).
  sandbox-egress: {}
  # Runtime Proxy -> model vendors.
  model-egress: {}

volumes:
  postgres-data: {}
  wise-workspaces:
    name: wise-workspaces
  wise-coding-clis:
    name: wise-coding-clis

# Docker secrets (never baked into images or shown by docker inspect): `make secrets`
# writes .secrets/ from .env (make up does it first). Services get them under /run/secrets.
secrets:
  claude_code_oauth_token:
    file: ./.secrets/claude_code_oauth_token
  wise_bootstrap_admin_password:
    file: ./.secrets/wise_bootstrap_admin_password
  wise_cli_runner_token:
    file: ./.secrets/wise_cli_runner_token
  wise_egress_token:
    file: ./.secrets/wise_egress_token
  wise_executor_token:
    file: ./.secrets/wise_executor_token
  wise_git_push_token:
    file: ./.secrets/wise_git_push_token
  wise_git_worker_token:
    file: ./.secrets/wise_git_worker_token
  wise_lmstudio_api_key:
    file: ./.secrets/wise_lmstudio_api_key
  wise_model_proxy_token:
    file: ./.secrets/wise_model_proxy_token
  wise_postgres_password:
    file: ./.secrets/wise_postgres_password
  wise_runtime_token:
    file: ./.secrets/wise_runtime_token
  wise_secrets_key:
    file: ./.secrets/wise_secrets_key
