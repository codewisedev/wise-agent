# Wise local stack.
# Phase 1: Postgres, API, dashboard. Phase 2: agent runtime.
# Phase 3: Temporal (on the shared Postgres), Temporal UI and the orchestrator.
# Pinned image versions are listed in infrastructure/docker/versions.env.
name: wise

x-api-env: &api-env
  WISE_DATABASE_URL: postgres://wise:${WISE_POSTGRES_PASSWORD:?set WISE_POSTGRES_PASSWORD in .env}@postgres:5432/wise?sslmode=disable
  WISE_HTTP_ADDR: ":8080"
  WISE_REPO_ROOTS: ${WISE_REPO_ROOT:?set WISE_REPO_ROOT in .env}
  WISE_SESSION_TTL: ${WISE_SESSION_TTL:-168h}
  WISE_COOKIE_SECURE: ${WISE_COOKIE_SECURE:-false}
  WISE_TRUST_PROXY_HEADERS: "true"
  WISE_LOG_LEVEL: ${WISE_LOG_LEVEL:-info}
  WISE_BOOTSTRAP_ADMIN_USER: ${WISE_BOOTSTRAP_ADMIN_USER:-}
  WISE_BOOTSTRAP_ADMIN_PASSWORD: ${WISE_BOOTSTRAP_ADMIN_PASSWORD:-}
  WISE_RUNTIME_TOKEN: ${WISE_RUNTIME_TOKEN:?set WISE_RUNTIME_TOKEN in .env}
  # LM Studio on the host (enable "Serve on Local Network" so containers can reach it).
  WISE_LMSTUDIO_URL: ${WISE_LMSTUDIO_DOCKER_URL:-http://host.docker.internal:1234/v1}
  WISE_LMSTUDIO_MODEL: ${WISE_LMSTUDIO_MODEL:-}
  WISE_LMSTUDIO_API_KEY: ${WISE_LMSTUDIO_API_KEY:-}
  # Long-lived subscription token from `claude setup-token` (enables the claude-code provider).
  CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
  HOME: /tmp

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: wise
      POSTGRES_DB: wise
      POSTGRES_PASSWORD: ${WISE_POSTGRES_PASSWORD:?set WISE_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Bound to loopback for the local dev loop (`make dev`) and psql access.
      - "127.0.0.1:${WISE_POSTGRES_PORT:-5433}:5432"
    networks: [data, workflow]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wise -d wise"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb

  wise-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      # Build with the host network (more reliable than the bridge on some networks).
      network: host
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        INSTALL_CLAUDE_CODE: ${INSTALL_CLAUDE_CODE:-true}
        APK_MIRROR: ${APK_MIRROR:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: *api-env
    # Run as the host user so repositories under WISE_REPO_ROOT are readable.
    user: "${WISE_UID:-1000}:${WISE_GID:-1000}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      # Mounted read-only at the same path so host paths work unchanged.
      - ${WISE_REPO_ROOT}:${WISE_REPO_ROOT}:ro
      # Model aliases and policies; edit on the host, restart the API to apply.
      - ./configs:/app/configs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    networks: [data, edge, runtime]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  # One-shot: Temporal's role and databases in the shared Postgres.
  temporal-db-init:
    image: pgvector/pgvector:0.8.1-pg17
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/init-db.sh"]
    environment:
      PGPASSWORD: ${WISE_POSTGRES_PASSWORD}
      TEMPORAL_DB_PASSWORD: ${WISE_TEMPORAL_DB_PASSWORD:?set WISE_TEMPORAL_DB_PASSWORD in .env}
    volumes:
      - ./infrastructure/temporal/init-db.sh:/scripts/init-db.sh:ro
    networks: [data]
    restart: "no"

  # One-shot: installs or upgrades Temporal's schemas.
  temporal-schema:
    image: temporalio/admin-tools:1.32.1
    depends_on:
      temporal-db-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/scripts/setup-schema.sh"]
    environment:
      SQL_PASSWORD: ${WISE_TEMPORAL_DB_PASSWORD}
    volumes:
      - ./infrastructure/temporal/setup-schema.sh:/scripts/setup-schema.sh:ro
    networks: [data]
    <<: *hardened
    restart: "no"

  temporal:
    image: temporalio/server:1.32.1
    restart: unless-stopped
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${WISE_TEMPORAL_DB_PASSWORD}
      BIND_ON_IP: 0.0.0.0
      LOG_LEVEL: ${WISE_TEMPORAL_LOG_LEVEL:-warn}
      TEMPORAL_ALLOW_NO_AUTH: "true"
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig.yaml
    volumes:
      - ./infrastructure/temporal/dynamicconfig.yaml:/etc/temporal/dynamicconfig.yaml:ro
    ports:
      # Loopback only (no auth on the frontend): used by `make dev` and the temporal CLI.
      - "127.0.0.1:${WISE_TEMPORAL_PORT:-7233}:7233"
    networks: [data, workflow]
    <<: *hardened
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7233"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  temporal-ui:
    image: temporalio/ui:2.57.0
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: wise
      TEMPORAL_CORS_ORIGINS: http://127.0.0.1:${WISE_TEMPORAL_UI_PORT:-8233}
    ports:
      - "127.0.0.1:${WISE_TEMPORAL_UI_PORT:-8233}:8080"
    networks: [data]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # Temporal worker + workflow command dispatcher (same image as the API).
  # Internal network only: Postgres and Temporal, no internet, no model credentials.
  wise-orchestrator:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      network: host
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        INSTALL_CLAUDE_CODE: ${INSTALL_CLAUDE_CODE:-true}
        APK_MIRROR: ${APK_MIRROR:-}
    command: ["orchestrator"]
    restart: unless-stopped
    depends_on:
      wise-api:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      WISE_DATABASE_URL: postgres://wise:${WISE_POSTGRES_PASSWORD}@postgres:5432/wise?sslmode=disable
      WISE_LOG_LEVEL: ${WISE_LOG_LEVEL:-info}
      WISE_TEMPORAL_ADDRESS: temporal:7233
      WISE_TEMPORAL_NAMESPACE: wise
    user: "${WISE_UID:-1000}:${WISE_GID:-1000}"
    <<: *hardened
    tmpfs: [/tmp]
    volumes:
      - ./configs:/app/configs:ro
    networks: [workflow]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  wise-agent-runtime:
    build:
      context: .
      dockerfile: apps/agent-runtime/Dockerfile
      # Build with the host network (more reliable than the bridge on some networks).
      network: host
    restart: unless-stopped
    depends_on:
      wise-api:
        condition: service_healthy
    environment:
      WISE_API_URL: http://wise-api:8080
      WISE_RUNTIME_TOKEN: ${WISE_RUNTIME_TOKEN}
      WISE_REPO_ROOTS: ${WISE_REPO_ROOT}
    user: "${WISE_UID:-1000}:${WISE_GID:-1000}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ${WISE_REPO_ROOT}:${WISE_REPO_ROOT}:ro
    # Internal network only: the runtime can reach the API and nothing else.
    networks: [runtime]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  wise-dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      # Build with the host network (more reliable than the bridge on some networks).
      network: host
    restart: unless-stopped
    depends_on:
      wise-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WISE_DASHBOARD_PORT:-5173}:8080"
    networks: [edge]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

networks:
  data: {}
  edge: {}
  runtime:
    internal: true
  # Orchestrator <-> Postgres/Temporal, no egress.
  workflow:
    internal: true

volumes:
  postgres-data: {}
