version: "2"
sql:
  - engine: postgresql
    schema: ../../../../migrations
    queries: queries
    gen:
      go:
        package: dbgen
        out: dbgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        emit_enum_valid_method: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: pg_catalog.text
            go_type: string
          - db_type: citext
            go_type: string
