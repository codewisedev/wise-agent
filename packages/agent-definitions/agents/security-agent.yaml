name: security-agent
version: 1.0.0
description: Reviews the task's code changes for security problems (injection, auth, secrets, unsafe input handling).
enabled: true
phase: 5
prompt: security-agent/system.md
produces: security_review
consumes:
  plan: plan
  requirements: requirements
  implementation: implementation
  quality_report: quality_report
responsibilities:
  - Review the diff for injection, authentication and authorization flaws
  - Check input validation, secrets handling and unsafe deserialization
  - Check new dependencies
  - Rate each finding by exploitability and impact
input_schema:
  type: object
  additionalProperties: false
  required: [request]
  properties:
    request: { type: string, minLength: 3 }
    plan: { type: object }
    requirements: { type: object }
    implementation: { type: object, description: The implementing agent's report. }
    quality_report: { type: object, description: Results of the repository's checks. }
output_schema:
  type: object
  additionalProperties: false
  required: [verdict, summary, findings]
  properties:
    verdict: { enum: [pass, changes_requested], description: changes_requested when any finding is critical or major. }
    summary: { type: string }
    findings:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [severity, file, title, detail]
        properties:
          severity: { enum: [critical, major, minor, info] }
          file: { type: string }
          line: { type: integer, minimum: 0 }
          title: { type: string }
          detail: { type: string, description: The concrete failure scenario. }
          suggestion: { type: string }
tools: [get_project_context, search_context, find_symbol, search_memory, ws_list_files, ws_read_file, ws_search, ws_git_diff]
permissions: [project:read, workspace:read]
model_config:
  alias: reasoning
  fallbacks: [local]
  temperature: 0.1
  max_output_tokens: 6000
execution_limits:
  max_turns: 30
  max_tool_calls: 80
  max_tokens: 1500000
  max_cost_usd: 3
  timeout_s: 1800
error_handling:
  max_attempts: 2
  invalid_output_retries: 2
evaluation:
  criteria:
    - Each finding names the attacker-controlled input and the impact
    - Secrets in the diff are always critical
    - No speculative findings without a path from input to sink
