# Tool catalog. Implementations live in apps/agent-runtime/wise_runtime/tools.
# Phase 2 ships read-only tools only; write tools arrive with isolated workspaces (Phase 5).
- name: get_project_context
  description: Return the project this run belongs to and its repositories (name, role, branch, HEAD SHA). Call this first when a project is attached.
  side_effects: none
  permissions_required: [project:read]
  input_schema: { type: object, properties: {}, additionalProperties: false }
- name: list_files
  description: List files and directories under a path inside one of the project's repositories. Paths are relative to the repository root.
  side_effects: read
  permissions_required: [repo:read]
  input_schema:
    type: object
    additionalProperties: false
    required: [repository]
    properties:
      repository: { type: string, description: Repository name from get_project_context. }
      path: { type: string, description: Directory relative to the repository root. Defaults to the root. }
      max_depth: { type: integer, minimum: 1, maximum: 4, description: How deep to recurse. Defaults to 2. }
- name: read_file
  description: Read a text file from one of the project's repositories. Large files are truncated; use start_line to page.
  side_effects: read
  permissions_required: [repo:read]
  input_schema:
    type: object
    additionalProperties: false
    required: [repository, path]
    properties:
      repository: { type: string }
      path: { type: string, description: File path relative to the repository root. }
      start_line: { type: integer, minimum: 1 }
      max_lines: { type: integer, minimum: 1, maximum: 2000 }
- name: search_code
  description: Search the project's repositories for a regular expression (ripgrep). Returns matching lines with file paths and line numbers.
  side_effects: read
  permissions_required: [repo:read]
  input_schema:
    type: object
    additionalProperties: false
    required: [pattern]
    properties:
      pattern: { type: string, description: Regular expression (Rust regex syntax). }
      repository: { type: string, description: Limit to one repository. }
      glob: { type: string, description: 'File glob filter, e.g. "*.go".' }
      max_results: { type: integer, minimum: 1, maximum: 200 }
- name: search_context
  description: >-
    Search the project's code index: symbols, code, documentation and config, ranked by relevance.
    Returns locations (repository, path, lines) with a short snippet and the commit they were indexed at.
    Use it to find where something lives, then read_file to read the real code; results marked stale come
    from an older commit than HEAD.
  side_effects: read
  permissions_required: [project:read]
  input_schema:
    type: object
    additionalProperties: false
    required: [query]
    properties:
      query: { type: string, minLength: 1, maxLength: 500, description: 'Words or identifiers, e.g. "retry policy for webhooks" or "ReconfigureGateway".' }
      kind: { type: string, enum: [symbol, code, doc, config], description: Limit to one kind of result. }
      repository: { type: string, description: Limit to one repository (name from get_project_context). }
      limit: { type: integer, minimum: 1, maximum: 50 }
- name: find_symbol
  description: Find functions, methods, classes, types and constants by name (exact, prefix, then similar names) across the project's indexed repositories.
  side_effects: read
  permissions_required: [project:read]
  input_schema:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: { type: string, minLength: 1, maxLength: 200 }
      kind: { type: string, description: 'e.g. function, method, class, struct, interface, type, enum, const, component.' }
      repository: { type: string }
- name: list_dependencies
  description: List the dependencies the project's repositories declare (package.json, go.mod, pyproject.toml, requirements.txt, Cargo.toml).
  side_effects: read
  permissions_required: [project:read]
  input_schema:
    type: object
    additionalProperties: false
    properties:
      repository: { type: string }
