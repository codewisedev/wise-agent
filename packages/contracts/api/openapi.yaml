openapi: 3.0.3
info:
  title: Wise API
  version: 0.1.0
  description: |
    Control-plane API for Wise, the personal AI engineering platform.

    Authentication: either the `wise_session` cookie (dashboard) or an
    `Authorization: Bearer wise_...` personal API token. State-changing requests
    authenticated by cookie must also send the session's CSRF token in the
    `X-Wise-CSRF` header (returned by `/auth/login` and `/auth/me`).

    Errors use RFC 7807 `application/problem+json`.
servers:
  - url: http://localhost:8080/api/v1
security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: system
  - name: auth
  - name: projects
  - name: repositories
  - name: agents
  - name: models
  - name: runtime

paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      tags: [system]
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Dependencies are reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          $ref: "#/components/responses/Problem"

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in. Sets the `wise_session` cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        "204":
          description: Session ended and cookie cleared.
        "401": { $ref: "#/components/responses/Problem" }
  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        "200":
          description: Current principal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/tokens:
    get:
      tags: [auth]
      operationId: listApiTokens
      responses:
        "200":
          description: Personal API tokens of the current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenList" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [auth]
      operationId: createApiToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiTokenRequest" }
      responses:
        "201":
          description: Token created. The secret is shown only once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedApiToken" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    delete:
      tags: [auth]
      operationId: revokeApiToken
      responses:
        "204": { description: Token revoked. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Projects.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectList" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [projects]
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [projects]
      operationId: getProject
      responses:
        "200":
          description: Project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [projects]
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectRequest" }
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [projects]
      operationId: archiveProject
      description: Archives (soft-deletes) the project.
      responses:
        "204": { description: Project archived. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/resources:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [projects]
      operationId: listProjectResources
      responses:
        "200":
          description: Resources attached to the project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResourceList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [projects]
      operationId: createProjectResource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectResourceRequest" }
      responses:
        "201":
          description: Resource created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResource" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /project-resources/{resourceId}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    delete:
      tags: [projects]
      operationId: deleteProjectResource
      responses:
        "204": { description: Resource deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/repositories:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [repositories]
      operationId: listRepositories
      responses:
        "200":
          description: Repositories of the project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [repositories]
      operationId: createRepository
      description: |
        Registers a repository. Local repositories must live under one of the
        configured `WISE_REPO_ROOTS` and are inspected immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRepositoryRequest" }
      responses:
        "201":
          description: Repository registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /repositories/{repositoryId}:
    parameters:
      - $ref: "#/components/parameters/RepositoryId"
    get:
      tags: [repositories]
      operationId: getRepository
      responses:
        "200":
          description: Repository.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [repositories]
      operationId: updateRepository
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRepositoryRequest" }
      responses:
        "200":
          description: Updated repository.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [repositories]
      operationId: deleteRepository
      description: Unregisters the repository. Files on disk are never touched.
      responses:
        "204": { description: Repository unregistered. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /repositories/{repositoryId}/inspect:
    parameters:
      - $ref: "#/components/parameters/RepositoryId"
    post:
      tags: [repositories]
      operationId: inspectRepository
      description: Refreshes Git information (branch, HEAD SHA, remotes) for a local repository.
      responses:
        "200":
          description: Repository with refreshed Git information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /repositories/{repositoryId}/index:
    parameters:
      - $ref: "#/components/parameters/RepositoryId"
    post:
      tags: [repositories]
      operationId: requestRepositoryIndex
      description: Queues the repository for indexing. The indexer itself arrives in Phase 4.
      responses:
        "202":
          description: Index request accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /repositories/{repositoryId}/status:
    parameters:
      - $ref: "#/components/parameters/RepositoryId"
    get:
      tags: [repositories]
      operationId: getRepositoryStatus
      responses:
        "200":
          description: Indexing and Git status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/repository-relationships:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [repositories]
      operationId: listRepositoryRelationships
      responses:
        "200":
          description: Relationships between repositories of the project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryRelationshipList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [repositories]
      operationId: createRepositoryRelationship
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRepositoryRelationshipRequest" }
      responses:
        "201":
          description: Relationship created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryRelationship" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /repository-relationships/{relationshipId}:
    parameters:
      - $ref: "#/components/parameters/RelationshipId"
    delete:
      tags: [repositories]
      operationId: deleteRepositoryRelationship
      responses:
        "204": { description: Relationship deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /agents:
    get:
      tags: [agents]
      operationId: listAgents
      responses:
        "200":
          description: Current agent definitions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentList" }
        "401": { $ref: "#/components/responses/Problem" }
  /agents/{agentName}:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    get:
      tags: [agents]
      operationId: getAgent
      responses:
        "200":
          description: Agent definition with its contract and prompt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /agents/{agentName}/runs:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    get:
      tags: [agents]
      operationId: listAgentRunsForAgent
      responses:
        "200":
          description: Recent runs of the agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRunList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [agents]
      operationId: createAgentRun
      description: Queues a run. `input` is validated against the agent's input_schema.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgentRunRequest" }
      responses:
        "202":
          description: Run queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /agent-runs:
    get:
      tags: [agents]
      operationId: listAgentRuns
      parameters:
        - name: projectId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Recent runs across agents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRunList" }
        "401": { $ref: "#/components/responses/Problem" }
  /agent-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [agents]
      operationId: getAgentRun
      responses:
        "200":
          description: Run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /agent-runs/{runId}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [agents]
      operationId: listAgentRunEvents
      description: |
        Events in order. Live updates are available over the WebSocket at
        `GET /api/v1/events/ws?runId=<id>` (messages are AgentEvent JSON).
      parameters:
        - name: afterSeq
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentEventList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /agent-runs/{runId}/model-calls:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [agents]
      operationId: listAgentRunModelCalls
      responses:
        "200":
          description: Every model call attempt made for the run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelCallList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /agent-runs/{runId}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [agents]
      operationId: cancelAgentRun
      responses:
        "200":
          description: Run cancelled (queued) or cancellation requested (running).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /models:
    get:
      tags: [models]
      operationId: getModelsOverview
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
      responses:
        "200":
          description: Model aliases, provider health and usage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelsOverview" }
        "401": { $ref: "#/components/responses/Problem" }

  /runtime/v1/runs/claim:
    post:
      tags: [runtime]
      operationId: runtimeClaimRun
      description: Claims the oldest queued run. Requires the runtime service token.
      security: [{ runtimeAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeClaimRequest" }
      responses:
        "200":
          description: Claimed run with everything needed to execute it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeClaim" }
        "204": { description: Nothing queued. }
        "401": { $ref: "#/components/responses/Problem" }
  /runtime/v1/runs/{runId}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runtime]
      operationId: runtimeHeartbeat
      security: [{ runtimeAuth: [] }]
      responses:
        "200":
          description: Lease extended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeHeartbeat" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /runtime/v1/runs/{runId}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runtime]
      operationId: runtimeAppendEvents
      security: [{ runtimeAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeEventsRequest" }
      responses:
        "204": { description: Events stored. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /runtime/v1/runs/{runId}/model-turn:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runtime]
      operationId: runtimeModelTurn
      description: |
        Sends the transcript through the Model Gateway. Alias, fallbacks, schemas,
        tools and budgets come from the run's agent definition, never from the runtime.
      security: [{ runtimeAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelTurnRequest" }
      responses:
        "200":
          description: Parsed model turn.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelTurn" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /runtime/v1/runs/{runId}/complete:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runtime]
      operationId: runtimeCompleteRun
      security: [{ runtimeAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeCompleteRequest" }
      responses:
        "204": { description: Run succeeded. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /runtime/v1/runs/{runId}/fail:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runtime]
      operationId: runtimeFailRun
      security: [{ runtimeAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeFailRequest" }
      responses:
        "204": { description: "Run failed, requeued or cancelled." }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }


components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: wise_session
    bearerAuth:
      type: http
      scheme: bearer
    runtimeAuth:
      type: http
      scheme: bearer
      description: |
        Agent runtime credentials. `/runtime/v1/runs/claim` takes the runtime
        service token (WISE_RUNTIME_TOKEN); every other runtime route takes the
        per-run token returned by the claim.

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RepositoryId:
      name: repositoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentName:
      name: agentName
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]*$" }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Error (RFC 7807).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 256 }
    User:
      type: object
      required: [id, username, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { type: string, enum: [admin, member] }
        createdAt: { type: string, format: date-time }
    SessionInfo:
      type: object
      required: [user, authMethod]
      properties:
        user: { $ref: "#/components/schemas/User" }
        authMethod: { type: string, enum: [session, api_token] }
        csrfToken:
          type: string
          description: Present for cookie sessions; send it as `X-Wise-CSRF` on mutating requests.
        expiresAt: { type: string, format: date-time }

    ApiToken:
      type: object
      required: [id, name, prefix, scopes, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        scopes:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
    ApiTokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ApiToken" }
    CreateApiTokenRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        expiresInDays: { type: integer, minimum: 1, maximum: 3650 }
    CreatedApiToken:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: "#/components/schemas/ApiToken" }
        secret:
          type: string
          description: Full bearer token. Shown once; store it securely.

    Project:
      type: object
      required: [id, slug, name, description, metadata, repositoryCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        metadata: { type: object, additionalProperties: true }
        repositoryCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time, nullable: true }
    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Project" }
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 100
          description: Derived from the name when omitted.
        description: { type: string, maxLength: 5000 }
        metadata: { type: object, additionalProperties: true }
    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        metadata: { type: object, additionalProperties: true }

    ProjectResourceKind:
      type: string
      enum: [documentation, external_service, database_definition, other]
    ProjectResource:
      type: object
      required: [id, projectId, kind, name, uri, metadata, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ProjectResourceKind" }
        name: { type: string }
        uri: { type: string }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectResourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProjectResource" }
    CreateProjectResourceRequest:
      type: object
      required: [kind, name]
      properties:
        kind: { $ref: "#/components/schemas/ProjectResourceKind" }
        name: { type: string, minLength: 1, maxLength: 200 }
        uri: { type: string, maxLength: 2000 }
        metadata: { type: object, additionalProperties: true }

    RepositoryRole:
      type: string
      enum: [backend, frontend, mobile, shared_library, infrastructure, documentation, other]
    RepositorySourceType:
      type: string
      enum: [local, remote]
    RepositoryIndexStatus:
      type: string
      enum: [not_indexed, queued, indexing, indexed, failed]
    GitRemote:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string }
    Repository:
      type: object
      required: [id, projectId, name, role, sourceType, gitRemotes, indexStatus, settings, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/RepositoryRole" }
        sourceType: { $ref: "#/components/schemas/RepositorySourceType" }
        localPath: { type: string, nullable: true }
        remoteUrl: { type: string, nullable: true }
        defaultBranch: { type: string, nullable: true }
        currentBranch: { type: string, nullable: true }
        headSha: { type: string, nullable: true }
        gitRemotes:
          type: array
          items: { $ref: "#/components/schemas/GitRemote" }
        gitInspectedAt: { type: string, format: date-time, nullable: true }
        gitError: { type: string, nullable: true }
        indexStatus: { $ref: "#/components/schemas/RepositoryIndexStatus" }
        indexRequestedAt: { type: string, format: date-time, nullable: true }
        settings: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RepositoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Repository" }
    CreateRepositoryRequest:
      type: object
      required: [name, sourceType]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        role: { $ref: "#/components/schemas/RepositoryRole" }
        sourceType: { $ref: "#/components/schemas/RepositorySourceType" }
        localPath:
          type: string
          maxLength: 4096
          description: Absolute path; required when sourceType is `local`.
        remoteUrl:
          type: string
          maxLength: 2000
          description: Required when sourceType is `remote`.
        defaultBranch: { type: string, maxLength: 255 }
        settings: { type: object, additionalProperties: true }
    UpdateRepositoryRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        role: { $ref: "#/components/schemas/RepositoryRole" }
        remoteUrl: { type: string, maxLength: 2000 }
        defaultBranch: { type: string, maxLength: 255 }
        settings: { type: object, additionalProperties: true }
    RepositoryStatus:
      type: object
      required: [repositoryId, indexStatus]
      properties:
        repositoryId: { type: string, format: uuid }
        indexStatus: { $ref: "#/components/schemas/RepositoryIndexStatus" }
        indexRequestedAt: { type: string, format: date-time, nullable: true }
        headSha: { type: string, nullable: true }
        gitInspectedAt: { type: string, format: date-time, nullable: true }
        gitError: { type: string, nullable: true }

    RepositoryRelationshipKind:
      type: string
      enum: [depends_on, consumes_api, shares_library, deploys]
    RepositoryRelationship:
      type: object
      required: [id, projectId, fromRepositoryId, toRepositoryId, kind, note, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        fromRepositoryId: { type: string, format: uuid }
        toRepositoryId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/RepositoryRelationshipKind" }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    RepositoryRelationshipList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RepositoryRelationship" }
    CreateRepositoryRelationshipRequest:
      type: object
      required: [fromRepositoryId, toRepositoryId, kind]
      properties:
        fromRepositoryId: { type: string, format: uuid }
        toRepositoryId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/RepositoryRelationshipKind" }
        note: { type: string, maxLength: 2000 }

    AgentRunStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    AgentSummary:
      type: object
      required: [id, name, version, description, enabled, modelAlias, tools, runCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        phase: { type: integer }
        modelAlias: { type: string }
        tools: { type: array, items: { type: string } }
        runCount: { type: integer, format: int64 }
        lastRunAt: { type: string, format: date-time, nullable: true }
    AgentList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentSummary" } }
    AgentDetail:
      allOf:
        - $ref: "#/components/schemas/AgentSummary"
        - type: object
          required: [definition, prompt, contentHash, createdAt, cloudAllowed]
          properties:
            definition: { type: object, additionalProperties: true }
            prompt: { type: string }
            contentHash: { type: string }
            createdAt: { type: string, format: date-time }
            cloudAllowed: { type: boolean }
    CreateAgentRunRequest:
      type: object
      required: [input]
      properties:
        input: { type: object, additionalProperties: true }
        projectId: { type: string, format: uuid }
    AgentRun:
      type: object
      required: [id, agentName, agentDefinitionId, status, input, attempt, maxAttempts, cancelRequested,
                 totalInputTokens, totalOutputTokens, totalCostUsd, createdAt]
      properties:
        id: { type: string, format: uuid }
        agentName: { type: string }
        agentDefinitionId: { type: string, format: uuid }
        projectId: { type: string, format: uuid, nullable: true }
        status: { $ref: "#/components/schemas/AgentRunStatus" }
        input: { type: object, additionalProperties: true }
        output: { type: object, additionalProperties: true, nullable: true }
        error: { type: string, nullable: true }
        attempt: { type: integer }
        maxAttempts: { type: integer }
        cancelRequested: { type: boolean }
        totalInputTokens: { type: integer, format: int64 }
        totalOutputTokens: { type: integer, format: int64 }
        totalCostUsd: { type: number, format: double }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    AgentRunList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentRun" } }
    AgentEvent:
      type: object
      required: [runId, seq, type, payload, createdAt]
      properties:
        runId: { type: string, format: uuid }
        seq: { type: integer }
        type: { type: string }
        payload: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    AgentEventList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentEvent" } }
    ModelCall:
      type: object
      required: [id, alias, provider, model, status, inputTokens, outputTokens, costUsd, latencyMs, cacheHit, createdAt]
      properties:
        id: { type: string, format: uuid }
        alias: { type: string }
        provider: { type: string }
        model: { type: string }
        status: { type: string, enum: [ok, error, rejected] }
        error: { type: string, nullable: true }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        costUsd: { type: number, format: double }
        latencyMs: { type: integer }
        cacheHit: { type: boolean }
        createdAt: { type: string, format: date-time }
    ModelCallList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ModelCall" } }
    ModelTarget:
      type: object
      required: [provider, model]
      properties:
        provider: { type: string }
        model: { type: string }
    ModelAlias:
      type: object
      required: [name, description, targets]
      properties:
        name: { type: string }
        description: { type: string }
        targets: { type: array, items: { $ref: "#/components/schemas/ModelTarget" } }
    ModelProvider:
      type: object
      required: [name, type, cloud, healthy]
      properties:
        name: { type: string }
        type: { type: string }
        cloud: { type: boolean }
        healthy: { type: boolean }
        error: { type: string }
    ModelUsage:
      type: object
      required: [agentName, alias, provider, model, calls, errors, inputTokens, outputTokens, costUsd]
      properties:
        agentName: { type: string }
        alias: { type: string }
        provider: { type: string }
        model: { type: string }
        calls: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        costUsd: { type: number, format: double }
    ModelsOverview:
      type: object
      required: [aliases, providers, usage, since]
      properties:
        aliases: { type: array, items: { $ref: "#/components/schemas/ModelAlias" } }
        providers: { type: array, items: { $ref: "#/components/schemas/ModelProvider" } }
        usage: { type: array, items: { $ref: "#/components/schemas/ModelUsage" } }
        since: { type: string, format: date-time }

    RuntimeClaimRequest:
      type: object
      required: [runtimeId]
      properties:
        runtimeId: { type: string, minLength: 1, maxLength: 200 }
    ToolDefinition:
      type: object
      required: [name, description, inputSchema, sideEffects, permissionsRequired]
      properties:
        name: { type: string }
        description: { type: string }
        inputSchema: { type: object, additionalProperties: true }
        sideEffects: { type: string, enum: [none, read, write] }
        permissionsRequired: { type: array, items: { type: string } }
    RuntimeRepository:
      type: object
      required: [id, name, role, sourceType]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string }
        sourceType: { type: string }
        localPath: { type: string, nullable: true }
        remoteUrl: { type: string, nullable: true }
        currentBranch: { type: string, nullable: true }
        headSha: { type: string, nullable: true }
    RuntimeProject:
      type: object
      required: [id, name, slug, description, repositories]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        repositories: { type: array, items: { $ref: "#/components/schemas/RuntimeRepository" } }
    RuntimeClaim:
      type: object
      required: [run, runToken, leaseSeconds, definition, prompt, tools]
      properties:
        run: { $ref: "#/components/schemas/AgentRun" }
        runToken: { type: string, description: Bearer token scoped to this run; invalid once it ends. }
        leaseSeconds: { type: integer }
        definition: { type: object, additionalProperties: true }
        prompt: { type: string }
        tools: { type: array, items: { $ref: "#/components/schemas/ToolDefinition" } }
        project: { $ref: "#/components/schemas/RuntimeProject" }
    RuntimeHeartbeat:
      type: object
      required: [cancelRequested, leaseSeconds]
      properties:
        cancelRequested: { type: boolean }
        leaseSeconds: { type: integer }
    RuntimeEvent:
      type: object
      required: [type, payload]
      properties:
        type: { type: string, enum: [tool.call, tool.result, agent.message, output.invalid, artifact.created] }
        payload: { type: object, additionalProperties: true }
    RuntimeEventsRequest:
      type: object
      required: [events]
      properties:
        events: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/RuntimeEvent" } }
    TurnMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant, tool] }
        content: { type: string, maxLength: 400000 }
        name: { type: string }
    ModelTurnRequest:
      type: object
      required: [messages]
      properties:
        messages: { type: array, minItems: 1, maxItems: 400, items: { $ref: "#/components/schemas/TurnMessage" } }
    TurnToolCall:
      type: object
      required: [tool, arguments]
      properties:
        tool: { type: string }
        arguments: { type: object, additionalProperties: true }
    TokenUsage:
      type: object
      required: [inputTokens, outputTokens]
      properties:
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
    ModelTurn:
      type: object
      required: [action, alias, provider, model, usage, costUsd, cacheHit, latencyMs]
      properties:
        action: { type: string, enum: [call_tools, final, invalid] }
        thought: { type: string }
        toolCalls: { type: array, items: { $ref: "#/components/schemas/TurnToolCall" } }
        final: { type: object, additionalProperties: true, nullable: true }
        parseError: { type: string }
        rawText: { type: string }
        alias: { type: string }
        provider: { type: string }
        model: { type: string }
        usage: { $ref: "#/components/schemas/TokenUsage" }
        costUsd: { type: number, format: double }
        cacheHit: { type: boolean }
        latencyMs: { type: integer, format: int64 }
    RuntimeCompleteRequest:
      type: object
      required: [output]
      properties:
        output: { type: object, additionalProperties: true }
    RuntimeFailRequest:
      type: object
      required: [error]
      properties:
        error: { type: string, maxLength: 10000 }
        retryable: { type: boolean, default: false }
        cancelled: { type: boolean, default: false }
