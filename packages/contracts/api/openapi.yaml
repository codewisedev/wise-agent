      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runtime]
      operationId: runtimeWorkspaceDiff
      description: The workspace's changes since its base commit.
      security: [{ runtimeAuth: [] }]
      responses:
        "200":
          description: Diff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkingDiff" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /runtime/v1/runs/claim:
    post:
      tags: [runtime]
      operationId: runtimeClaimRun
      description: Claims the oldest queued run. Requires the runtime service token.
      security: [{ runtimeAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeClaimRequest" }
      responses:
        "200":
          description: Claimed run with everything needed to execute it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeClaim" }
        "204": { description: Nothing queued. }
        "401": { $ref: "#/components/responses/Problem" }
  /runtime/v1/runs/{runId}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runtime]
      operationId: runtimeHeartbeat
      security: [{ runtimeAuth: [] }]
      responses:
        "200":
          description: Lease extended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeHeartbeat" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /runtime/v1/runs/{runId}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runtime]
      operationId: runtimeAppendEvents
      security: [{ runtimeAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeEventsRequest" }
      responses:
        "204": { description: Events stored. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /runtime/v1/runs/{runId}/model-turn:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runtime]
      operationId: runtimeModelTurn
      description: |
        Sends the transcript through the Model Gateway. Alias, fallbacks, schemas,
        tools and budgets come from the run's agent definition, never from the runtime.
      security: [{ runtimeAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelTurnRequest" }
      responses:
        "200":
          description: Parsed model turn.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelTurn" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /runtime/v1/runs/{runId}/complete:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runtime]
      operationId: runtimeCompleteRun
      security: [{ runtimeAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeCompleteRequest" }
      responses:
        "204": { description: Run succeeded. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "400": { $ref: "#/components/responses/Problem" }
  /runtime/v1/runs/{runId}/fail:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runtime]
      operationId: runtimeFailRun
      security: [{ runtimeAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeFailRequest" }
      responses:
        "204": { description: "Run failed, requeued or cancelled." }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }


  /repositories/{repositoryId}/execution:
    parameters:
      - $ref: "#/components/parameters/RepositoryId"
    get:
      tags: [execution]
      operationId: getRepositoryExecution
      description: How Wise builds and checks this repository in a task sandbox.
      responses:
        "200":
          description: Execution settings (empty image = not set up yet).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryExecution" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [execution]
      operationId: setRepositoryExecution
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepositoryExecution" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryExecution" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "400": { $ref: "#/components/responses/Problem" }
  /repositories/{repositoryId}/execution/detect:
    parameters:
      - $ref: "#/components/parameters/RepositoryId"
    post:
      tags: [execution]
      operationId: detectRepositoryExecution
      description: Suggests execution settings from the repository's files. Nothing is saved.
      responses:
        "200":
          description: Suggestion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionDetection" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /tasks/{taskId}/workspace:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [execution]
      operationId: getTaskWorkspace
      description: The task's workspace (its private clone, sandbox and branch) and the repository it changes.
      responses:
        "200":
          description: Workspace state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskWorkspace" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [execution]
      operationId: prepareTaskWorkspace
      description: Prepares the task's workspace (clone, branch, sandbox, preflight, setup). Reuses a ready one.
      responses:
        "202":
          description: Preparing (or already ready).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "400": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [execution]
      operationId: removeTaskWorkspace
      description: Removes the task's workspace and sandbox. A delivered branch stays in the repository.
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /projects/{projectId}/coding-runtimes:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [execution]
      operationId: getProjectCodingRuntimes
      description: Which external coding runtimes (Claude Code, Codex) the project's tasks may use.
      responses:
        "200":
          description: Policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectCodingRuntimes" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [execution]
      operationId: setProjectCodingRuntimes
      description: Changes the project's runtime policy (a security policy; audited with the old and new values).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCodingRuntimes" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectCodingRuntimes" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /runtime/v1/runs/{runId}/external:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runtime]
      operationId: runtimeExternalStart
      description: Starts (or rejoins) the run's external coding session (the runtime pinned on the run).
      security: [{ runtimeAuth: [] }]
      responses:
        "200":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalStart" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    get:
      tags: [runtime]
      operationId: runtimeExternalPoll
      description: New normalized events of the session, waiting up to `wait` seconds; when it ended, its outcome.
      security: [{ runtimeAuth: [] }]
      parameters:
        - { name: wait, in: query, schema: { type: integer, minimum: 0, maximum: 25 } }
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalPoll" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [runtime]
      operationId: runtimeExternalCancel
      description: Stops the session (the runner is removed, its credentials revoked).
      security: [{ runtimeAuth: [] }]
      responses:
        "204": { description: Stopped. }
        "401": { $ref: "#/components/responses/Problem" }
  /feedback:
    get:
      tags: [improvement]
      operationId: listFeedback
      description: Ratings of agent results (newest first).
      parameters:
        - { name: targetType, in: query, schema: { type: string, enum: [run, artifact] } }
        - { name: targetId, in: query, schema: { type: string, format: uuid } }
        - { name: agent, in: query, schema: { type: string } }
        - { name: rating, in: query, schema: { type: string, enum: [up, down] } }
        - { name: taskId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Ratings.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Feedback" } }
        "401": { $ref: "#/components/responses/Problem" }
    put:
      tags: [improvement]
      operationId: setFeedback
      description: Rates a run or an artifact (replaces your earlier rating of it).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feedback" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [improvement]
      operationId: clearFeedback
      description: Removes your rating of a run or an artifact.
      parameters:
        - { name: targetType, in: query, required: true, schema: { type: string, enum: [run, artifact] } }
        - { name: targetId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Problem" }
  /insights:
    get:
      tags: [improvement]
      operationId: getInsights
      description: How agents, models and workflows performed over a window (evaluation replays excluded).
      parameters:
        - { name: window, in: query, schema: { type: string, enum: [7d, 30d, 90d] } }
      responses:
        "200":
          description: Insights.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InsightsReport" }
        "401": { $ref: "#/components/responses/Problem" }
  /insights/agents/{agentName}:
    parameters:
      - { name: agentName, in: path, required: true, schema: { type: string } }
    get:
      tags: [improvement]
      operationId: getAgentInsights
      description: One agent's versions, daily trend, repeated failures, review comments and your thumbs-down notes.
      parameters:
        - { name: window, in: query, schema: { type: string, enum: [7d, 30d, 90d] } }
      responses:
        "200":
          description: Agent insights.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentInsights" }
        "401": { $ref: "#/components/responses/Problem" }
  /improvements/analyses:
    get:
      tags: [improvement]
      operationId: listImprovementAnalyses
      description: Recent analyses of Wise's own performance (newest first).
      responses:
        "200":
          description: Analyses.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ImprovementAnalysis" } }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [improvement]
      operationId: startImprovementAnalysis
      description: Analyses recent performance now and proposes improvements (runs the improvement agent).
      responses:
        "202":
          description: Started (or skipped when there is too little to analyse).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImprovementAnalysis" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /improvements/proposals:
    get:
      tags: [improvement]
      operationId: listImprovementProposals
      description: Improvement proposals (open ones whose target changed since are marked stale).
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [proposed, evaluating, evaluated, applied, rejected, rolled_back, stale] } }
        - { name: kind, in: query, schema: { type: string, enum: [prompt, memory, routing, template] } }
        - { name: target, in: query, schema: { type: string } }
      responses:
        "200":
          description: Proposals.
          content:
            application/json:
              schema:
                type: object
                required: [items, openCount]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ImprovementProposal" } }
                  openCount: { type: integer, format: int64, description: Proposals waiting for a decision. }
        "401": { $ref: "#/components/responses/Problem" }
  /improvements/proposals/{proposalId}:
    parameters:
      - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [improvement]
      operationId: getImprovementProposal
      responses:
        "200":
          description: The proposal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImprovementProposal" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /improvements/proposals/{proposalId}/apply:
    parameters:
      - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [improvement]
      operationId: applyImprovementProposal
      description: Applies the proposal through the target's versioned mechanism (checked against the hard rule again).
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImprovementProposal" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /improvements/proposals/{proposalId}/rollback:
    parameters:
      - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [improvement]
      operationId: rollbackImprovementProposal
      description: Restores what an applied proposal replaced. If the target changed since, confirm must be true.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm: { type: boolean }
                note: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Rolled back.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImprovementProposal" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /improvements/proposals/{proposalId}/monitor:
    parameters:
      - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [improvement]
      operationId: monitorImprovementProposal
      description: The target's numbers when applied and since.
      responses:
        "200":
          description: Before and since.
          content:
            application/json:
              schema:
                type: object
                required: [since]
                properties:
                  appliedAt: { type: string, format: date-time, nullable: true }
                  before: { type: array, nullable: true, items: { $ref: "#/components/schemas/AgentStat" } }
                  since: { type: array, items: { $ref: "#/components/schemas/AgentStat" } }
                  template: { type: object, additionalProperties: true, nullable: true }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /improvements/proposals/{proposalId}/reject:
    parameters:
      - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [improvement]
      operationId: rejectImprovementProposal
      description: Declines a proposal. It is kept, with your note, so later analyses do not repeat it.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImprovementProposal" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /agents/{agentName}/eval-cases:
    parameters:
      - { name: agentName, in: path, required: true, schema: { type: string } }
    get:
      tags: [improvement]
      operationId: listEvalCases
      description: The agent's evaluation suite. Cases from your reviews and ratings are added automatically.
      responses:
        "200":
          description: Cases.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EvalCase" } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [improvement]
      operationId: createEvalCase
      description: Adds your own case (the input must match the agent's input schema).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input: { type: object, additionalProperties: true }
                projectId: { type: string, format: uuid, nullable: true }
                expectation: { type: string, maxLength: 4000 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalCase" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /eval-cases/{caseId}:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [improvement]
      operationId: updateEvalCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, expectation]
              properties:
                enabled: { type: boolean }
                expectation: { type: string, maxLength: 4000 }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalCase" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [improvement]
      operationId: deleteEvalCase
      description: Deletes one of your own cases (cases from reviews are switched off instead).
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /improvements/proposals/{proposalId}/eval-plan:
    parameters:
      - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [improvement]
      operationId: getEvalPlan
      description: Whether the proposal can be evaluated, on which agent, how many cases, and an estimated cost.
      parameters:
        - { name: agent, in: query, schema: { type: string } }
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalPlan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /improvements/proposals/{proposalId}/evaluate:
    parameters:
      - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [improvement]
      operationId: evaluateProposal
      description: Replays the agent's cases with the current version and the proposal, and has the judge score both.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                agent: { type: string, description: Routing proposals - the affected agent to evaluate on. }
                model: { $ref: "#/components/schemas/ModelChoice" }
                judge: { $ref: "#/components/schemas/ModelChoice" }
                maxCases: { type: integer, minimum: 1, maximum: 20 }
                costCapUsd: { type: number, minimum: 0.01, maximum: 100 }
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalRun" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /improvements/proposals/{proposalId}/evals:
    parameters:
      - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [improvement]
      operationId: listProposalEvals
      responses:
        "200":
          description: Evaluations, newest first, with their cases.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EvalRun" } }
        "401": { $ref: "#/components/responses/Problem" }
  /evals/{evalRunId}/cancel:
    parameters:
      - { name: evalRunId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [improvement]
      operationId: cancelEval
      responses:
        "204": { description: Stopped. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /repositories/{repositoryId}/release:
    parameters:
      - { name: repositoryId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [release]
      operationId: getRepositoryRelease
      description: Where this repository pushes (remote, git account, base branch).
      responses:
        "200":
          description: The release target.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryRelease" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [release]
      operationId: setRepositoryRelease
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepositoryRelease" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryRelease" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /repositories/{repositoryId}/release/detect:
    parameters:
      - { name: repositoryId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [release]
      operationId: detectRepositoryRelease
      description: Proposes the remote (as https), base branch and matching git accounts from the repository's git metadata.
      responses:
        "200":
          description: Suggestion.
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  remote: { type: string }
                  baseBranch: { type: string }
                  accounts: { type: array, items: { type: string, format: uuid } }
                  problem: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /repositories/{repositoryId}/release/test:
    parameters:
      - { name: repositoryId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [release]
      operationId: testRepositoryRelease
      description: Reads the repository with the account's token. This proves access, not push permission (the first push does).
      responses:
        "200":
          description: The repository is reachable.
          content:
            application/json:
              schema:
                type: object
                required: [defaultBranch]
                properties:
                  defaultBranch: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /projects/{projectId}/release-policy:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [release]
      operationId: getProjectReleasePolicy
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleasePolicy" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [release]
      operationId: setProjectReleasePolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleasePolicy" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleasePolicy" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /tasks/{taskId}/commit-message:
    parameters:
      - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [release]
      operationId: rewordTaskCommit
      description: Changes the verified commit's message (same changes) while your final approval of the code is pending. The approval is asked again for the new commit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        "200":
          description: The reworded commit.
          content:
            application/json:
              schema:
                type: object
                required: [headSha, message]
                properties:
                  headSha: { type: string }
                  message: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tasks/{taskId}/release:
    parameters:
      - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [release]
      operationId: getTaskRelease
      description: The task's release - what a push covers, pushes, pull requests and pending release approvals.
      responses:
        "200":
          description: Release state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRelease" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /monitor:
    get:
      tags: [monitor]
      operationId: getMonitor
      description: What Wise is doing now - queued and running agent runs (native and coding CLIs), stuck runs, evaluation replays, and workflows waiting for you.
      responses:
        "200":
          description: Snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorSnapshot" }
        "401": { $ref: "#/components/responses/Problem" }
  /costs:
    get:
      tags: [monitor]
      operationId: getCosts
      description: Model spend per day grouped by project, agent, model, runtime or billing; today's spend against daily budgets; top tasks. Evaluation replays are reported apart. Subscription usage is the API-equivalent cost CLI subscriptions report, not what you pay.
      parameters:
        - { name: window, in: query, schema: { type: string, enum: [7d, 30d, 90d] } }
        - { name: groupBy, in: query, schema: { type: string, enum: [project, agent, model, runtime, billing] } }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostReport" }
        "401": { $ref: "#/components/responses/Problem" }
  /projects/{projectId}/activity:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [monitor]
      operationId: getProjectActivity
      description: What happened in the project, newest first - tasks, approvals, workflows, failed runs, deliveries, pushes, pull requests and memories.
      parameters:
        - { name: before, in: query, schema: { type: string, format: date-time }, description: Older than this (paging; with beforeId). }
        - { name: beforeId, in: query, schema: { type: string, format: uuid }, description: The last item's refId (paging). }
        - { name: kinds, in: query, schema: { type: string }, description: "Comma-separated: task, approval, workflow, run, branch, push, pull_request, memory." }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: Activity.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [at, kind, title, detail, refId, url]
                      properties:
                        at: { type: string, format: date-time }
                        kind: { type: string }
                        title: { type: string }
                        detail: { type: string }
                        taskId: { type: string, format: uuid, nullable: true }
                        refId: { type: string, format: uuid }
                        url: { type: string }
                  next: { type: string, format: date-time, nullable: true, description: Pass as before for the next page. }
                  nextId: { type: string, format: uuid, nullable: true, description: Pass as beforeId for the next page. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: wise_session
    bearerAuth:
      type: http
      scheme: bearer
    runtimeAuth:
      type: http
      scheme: bearer
      description: |
        Agent runtime credentials. `/runtime/v1/runs/claim` takes the runtime
        service token (WISE_RUNTIME_TOKEN); every other runtime route takes the
        per-run token returned by the claim.

  parameters:
    MemoryId:
      name: memoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SprintId:
      name: sprintId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RepositoryId:
      name: repositoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentName:
      name: agentName
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]*$" }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SettingKey:
      name: settingKey
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9_]{1,62}$" }
    IntegrationId:
      name: integrationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Error (RFC 7807).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 256 }
    User:
      type: object
      required: [id, username, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { type: string, enum: [admin, member] }
        createdAt: { type: string, format: date-time }
    SessionInfo:
      type: object
      required: [user, authMethod]
      properties:
        user: { $ref: "#/components/schemas/User" }
        authMethod: { type: string, enum: [session, api_token] }
        csrfToken:
          type: string
          description: Present for cookie sessions; send it as `X-Wise-CSRF` on mutating requests.
        expiresAt: { type: string, format: date-time }

    ApiToken:
      type: object
      required: [id, name, prefix, scopes, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        scopes:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
    ApiTokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ApiToken" }
    CreateApiTokenRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        expiresInDays: { type: integer, minimum: 1, maximum: 3650 }
    CreatedApiToken:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: "#/components/schemas/ApiToken" }
        secret:
          type: string
          description: Full bearer token. Shown once; store it securely.

    Project:
      type: object
      required: [id, slug, name, description, metadata, repositoryCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        metadata: { type: object, additionalProperties: true }
        repositoryCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time, nullable: true }
    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Project" }
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 100
          description: Derived from the name when omitted.
        description: { type: string, maxLength: 5000 }
        metadata: { type: object, additionalProperties: true }
    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        metadata: { type: object, additionalProperties: true }

    ProjectResourceKind:
      type: string
      enum: [documentation, external_service, database_definition, other]
    ProjectResource:
      type: object
      required: [id, projectId, kind, name, uri, metadata, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ProjectResourceKind" }
        name: { type: string }
        uri: { type: string }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectResourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProjectResource" }
    CreateProjectResourceRequest:
      type: object
      required: [kind, name]
      properties:
        kind: { $ref: "#/components/schemas/ProjectResourceKind" }
        name: { type: string, minLength: 1, maxLength: 200 }
        uri: { type: string, maxLength: 2000 }
        metadata: { type: object, additionalProperties: true }

    RepositoryRole:
      type: string
      enum: [backend, frontend, mobile, shared_library, infrastructure, documentation, other]
    RepositorySourceType:
      type: string
      enum: [local, remote]
    RepositoryIndexStatus:
      type: string
      enum: [not_indexed, queued, indexing, indexed, failed]
    GitRemote:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string }
    RepositoryExecution:
      type: object
      required: [image, setup, commands, tools, baseBranch, env]
      properties:
        image: { type: string, maxLength: 255, description: "Toolchain image the sandbox runs (must include git), e.g. wise-toolchain-node:22." }
        setup: { type: array, maxItems: 20, items: { type: string, maxLength: 2000 }, description: Commands run once when the workspace is prepared (dependency installation). }
        commands: { $ref: "#/components/schemas/QualityCommands" }
        tools: { type: array, maxItems: 30, items: { type: string, maxLength: 64 }, description: Commands that must exist in the image (checked before any agent runs). }
        baseBranch: { type: string, maxLength: 200, description: "Branch task branches start from; empty = the repository's current branch." }
        env: { type: object, additionalProperties: { type: string, maxLength: 4000 }, description: "Extra environment variables for the sandbox. Visible to agents: never put secrets here." }
    QualityCommands:
      type: object
      required: [format, lint, typecheck, test]
      properties:
        format: { type: string, maxLength: 2000, description: "Format check (must not rewrite files), e.g. npm run format:check. Empty = skipped." }
        lint: { type: string, maxLength: 2000 }
        typecheck: { type: string, maxLength: 2000 }
        test: { type: string, maxLength: 2000 }
    ExecutionDetection:
      type: object
      required: [settings, detected, notes]
      properties:
        settings: { $ref: "#/components/schemas/RepositoryExecution" }
        detected: { type: array, items: { type: string } }
        notes: { type: array, items: { type: string } }
    WorkspaceStatus:
      type: string
      enum: [preparing, ready, failed, stopped, removed]
    Workspace:
      type: object
      required: [id, taskId, repositoryId, status, branch, image, log, toolVersions, scrubbed, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        workflowRunId: { type: string, format: uuid, nullable: true }
        repositoryId: { type: string, format: uuid }
        repositoryName: { type: string }
        status: { $ref: "#/components/schemas/WorkspaceStatus" }
        branch: { type: string, description: The task branch inside the workspace (and its name when delivered). }
        baseBranch: { type: string, nullable: true }
        baseSha: { type: string, nullable: true }
        image: { type: string }
        log: { type: string, description: The last part of the preparation log. }
        error: { type: string, nullable: true }
        toolVersions: { type: array, items: { type: string } }
        scrubbed: { type: array, items: { type: string }, description: Tracked files named like credentials that were kept out of the workspace. }
        headSha: { type: string, nullable: true }
        deliveredBranch: { type: string, nullable: true }
        deliveredSha: { type: string, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskWorkspace:
      type: object
      properties:
        workspace: { allOf: [{ $ref: "#/components/schemas/Workspace" }], nullable: true }
        repository: { allOf: [{ $ref: "#/components/schemas/RepositoryRef" }], nullable: true, description: The repository the task changes (chosen or automatic). }
        problem: { type: string, nullable: true, description: Why a workspace cannot be prepared yet (e.g. no execution settings). }
        executorAvailable: { type: boolean }
    RepositoryRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        configured: { type: boolean, description: The repository has execution settings. }
    Repository:
      type: object
      required: [id, projectId, name, role, sourceType, gitRemotes, indexStatus, settings, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/RepositoryRole" }
        sourceType: { $ref: "#/components/schemas/RepositorySourceType" }
        localPath: { type: string, nullable: true }
        remoteUrl: { type: string, nullable: true }
        defaultBranch: { type: string, nullable: true }
        currentBranch: { type: string, nullable: true }
        headSha: { type: string, nullable: true }
        gitRemotes:
          type: array
          items: { $ref: "#/components/schemas/GitRemote" }
        gitInspectedAt: { type: string, format: date-time, nullable: true }
        gitError: { type: string, nullable: true }
        indexStatus: { $ref: "#/components/schemas/RepositoryIndexStatus" }
        indexRequestedAt: { type: string, format: date-time, nullable: true }
        indexedSha: { type: string, nullable: true, description: Commit the index reflects. }
        indexedAt: { type: string, format: date-time, nullable: true }
        indexStats: { type: object, additionalProperties: true, description: "files, skipped, symbols, chunks, dependencies" }
        indexError: { type: string, nullable: true }
        settings: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RepositoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Repository" }
    CreateRepositoryRequest:
      type: object
      required: [name, sourceType]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        role: { $ref: "#/components/schemas/RepositoryRole" }
        sourceType: { $ref: "#/components/schemas/RepositorySourceType" }
        localPath:
          type: string
          maxLength: 4096
          description: Absolute path; required when sourceType is `local`.
        remoteUrl:
          type: string
          maxLength: 2000
          description: Required when sourceType is `remote`.
        defaultBranch: { type: string, maxLength: 255 }
        settings: { type: object, additionalProperties: true }
    UpdateRepositoryRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        role: { $ref: "#/components/schemas/RepositoryRole" }
        remoteUrl: { type: string, maxLength: 2000 }
        defaultBranch: { type: string, maxLength: 255 }
        settings: { type: object, additionalProperties: true }
    RepositoryStatus:
      type: object
      required: [repositoryId, indexStatus]
      properties:
        repositoryId: { type: string, format: uuid }
        indexStatus: { $ref: "#/components/schemas/RepositoryIndexStatus" }
        indexRequestedAt: { type: string, format: date-time, nullable: true }
        headSha: { type: string, nullable: true }
        gitInspectedAt: { type: string, format: date-time, nullable: true }
        gitError: { type: string, nullable: true }

    RepositoryRelationshipKind:
      type: string
      enum: [depends_on, consumes_api, shares_library, deploys]
    RepositoryRelationship:
      type: object
      required: [id, projectId, fromRepositoryId, toRepositoryId, kind, note, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        fromRepositoryId: { type: string, format: uuid }
        toRepositoryId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/RepositoryRelationshipKind" }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    RepositoryRelationshipList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RepositoryRelationship" }
    CreateRepositoryRelationshipRequest:
      type: object
      required: [fromRepositoryId, toRepositoryId, kind]
      properties:
        fromRepositoryId: { type: string, format: uuid }
        toRepositoryId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/RepositoryRelationshipKind" }
        note: { type: string, maxLength: 2000 }

    AgentRunStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    AgentSummary:
      type: object
      required: [id, name, version, description, enabled, modelAlias, tools, runCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        phase: { type: integer }
        modelAlias: { type: string }
        tools: { type: array, items: { type: string } }
        runCount: { type: integer, format: int64 }
        lastRunAt: { type: string, format: date-time, nullable: true }
        produces: { type: string, description: Artifact kind of the agent's output in workflows. }
        source:
          type: string
          enum: [shipped, edited, custom]
          description: "shipped: unchanged default; edited: changed in the panel; custom: created in the panel."
        updateAvailable: { type: boolean, description: Edited and a newer shipped version exists. }
        consumes:
          type: object
          description: Input property → artifact kind it is filled from.
          additionalProperties: { type: string }
    AgentList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentSummary" } }
    AgentDetail:
      allOf:
        - $ref: "#/components/schemas/AgentSummary"
        - type: object
          required: [definition, prompt, contentHash, createdAt, cloudAllowed]
          properties:
            definition: { type: object, additionalProperties: true }
            prompt: { type: string }
            contentHash: { type: string }
            createdAt: { type: string, format: date-time }
            cloudAllowed: { type: boolean }
            shippedPrompt: { type: string, nullable: true, description: The shipped default prompt (for diffs). }
            shippedDefinition: { type: object, additionalProperties: true, nullable: true }
    AgentInput:
      type: object
      required: [definition, prompt]
      properties:
        definition: { type: object, additionalProperties: true, description: The agent contract (agent-definition.schema.json). }
        prompt: { type: string, maxLength: 200000 }
    AgentVersion:
      type: object
      required: [id, version, contentHash, source, current, createdAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: string }
        contentHash: { type: string }
        source: { type: string, enum: [code, panel] }
        current: { type: boolean }
        createdAt: { type: string, format: date-time }
    AgentVersionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentVersion" } }
    ToolList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ToolDefinition" } }
    CreateAgentRunRequest:
      type: object
      required: [input]
      properties:
        input: { type: object, additionalProperties: true }
        projectId: { type: string, format: uuid }
        account:
          type: string
          description: Account (or built-in provider) name to use for every model call; skips alias routing.
        model: { type: string, description: Model for `account` (default = the account's default model). }
    AgentRun:
      type: object
      required: [id, agentName, agentDefinitionId, status, input, attempt, maxAttempts, cancelRequested,
                 totalInputTokens, totalOutputTokens, totalCostUsd, createdAt]
      properties:
        id: { type: string, format: uuid }
        agentName: { type: string }
        agentDefinitionId: { type: string, format: uuid }
        projectId: { type: string, format: uuid, nullable: true }
        workflowRunId: { type: string, format: uuid, nullable: true }
        purpose: { type: string, enum: [work, eval], description: "eval = an evaluation replay (excluded from metrics, run lists and budgets)." }
        status: { $ref: "#/components/schemas/AgentRunStatus" }
        input: { type: object, additionalProperties: true }
        output: { type: object, additionalProperties: true, nullable: true }
        context: { $ref: "#/components/schemas/RunContext" }
        error: { type: string, nullable: true }
        attempt: { type: integer }
        maxAttempts: { type: integer }
        cancelRequested: { type: boolean }
        totalInputTokens: { type: integer, format: int64 }
        totalOutputTokens: { type: integer, format: int64 }
        totalCostUsd: { type: number, format: double }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    AgentRunList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentRun" } }
    AgentEvent:
      type: object
      required: [runId, seq, type, payload, createdAt]
      properties:
        runId: { type: string, format: uuid }
        seq: { type: integer }
        type: { type: string }
        payload: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    AgentEventList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentEvent" } }
    ModelCall:
      type: object
      required: [id, alias, provider, model, status, inputTokens, outputTokens, costUsd, latencyMs, cacheHit, createdAt]
      properties:
        id: { type: string, format: uuid }
        alias: { type: string }
        provider: { type: string }
        model: { type: string }
        status: { type: string, enum: [ok, error, rejected] }
        error: { type: string, nullable: true }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        costUsd: { type: number, format: double }
        latencyMs: { type: integer }
        cacheHit: { type: boolean }
        createdAt: { type: string, format: date-time }
    ModelCallList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ModelCall" } }
    ModelTarget:
      type: object
      required: [provider, model]
      properties:
        provider: { type: string }
        model: { type: string }
    ModelAlias:
      type: object
      required: [name, description, targets]
      properties:
        name: { type: string }
        description: { type: string }
        targets: { type: array, items: { $ref: "#/components/schemas/ModelTarget" } }
    ModelProvider:
      type: object
      required: [name, type, cloud, healthy]
      properties:
        name: { type: string }
        type: { type: string }
        cloud: { type: boolean }
        healthy: { type: boolean }
        error: { type: string }
    ModelUsage:
      type: object
      required: [agentName, alias, provider, model, calls, errors, inputTokens, outputTokens, costUsd]
      properties:
        agentName: { type: string }
        alias: { type: string }
        provider: { type: string }
        model: { type: string }
        calls: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        costUsd: { type: number, format: double }
    ModelsOverview:
      type: object
      required: [aliases, providers, usage, since]
      properties:
        aliases: { type: array, items: { $ref: "#/components/schemas/ModelAlias" } }
        providers: { type: array, items: { $ref: "#/components/schemas/ModelProvider" } }
        usage: { type: array, items: { $ref: "#/components/schemas/ModelUsage" } }
        since: { type: string, format: date-time }

    TaskStatus:
      type: string
      enum: [open, in_progress, awaiting_approval, completed, failed, cancelled]
    Task:
      type: object
      required: [id, projectId, title, description, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        title: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        column: { type: string, format: uuid, description: The board column the card is in. }
        position: { type: number, format: double }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        labels: { type: array, items: { type: string } }
        source: { type: string, enum: [manual, jira, clickup, trello] }
        externalId: { type: string, nullable: true }
        externalUrl: { type: string, nullable: true }
        externalStatus: { type: string, nullable: true }
        templateId: { type: string, format: uuid, nullable: true }
        sprintId: { type: string, format: uuid, nullable: true }
        targetRepositoryId: { type: string, format: uuid, nullable: true, description: "The repository the task changes; null = the project's only local repository." }
        archivedAt: { type: string, format: date-time, nullable: true, description: "Set when the task's source stopped returning it (e.g. no longer assigned to you); cleared if it returns." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskPriority:
      type: string
      enum: [none, low, medium, high, urgent]
    UpdateTaskRequest:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        description: { type: string, maxLength: 20000 }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        labels: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
        column: { type: string, format: uuid, description: Move to this column of the project's board. }
        sprint: { type: string, description: "A sprint id of the project, or \"none\" to take the task out of its sprint." }
        position: { type: number, format: double, description: "Order within the column (cards sort ascending); omit to append." }
        repository: { type: string, description: "A local repository id of the project the task changes, or \"auto\" (the project's only local repository)." }
    BoardCard:
      type: object
      required: [task, pendingApproval]
      properties:
        task: { $ref: "#/components/schemas/Task" }
        workflowId: { type: string, format: uuid, nullable: true }
        workflowStatus: { $ref: "#/components/schemas/WorkflowRunStatus" }
        workflowStage: { type: string, nullable: true }
        templateName: { type: string, nullable: true }
        pendingApproval: { type: boolean }
    Board:
      type: object
      required: [columns]
      properties:
        columns:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/BoardColumn"
              - type: object
                required: [cards]
                properties:
                  cards: { type: array, items: { $ref: "#/components/schemas/BoardCard" } }
    TaskList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Task" } }
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        description: { type: string, maxLength: 20000 }
        start: { type: boolean, default: true }
        stepByStep: { type: boolean, description: "With start, pause after every step." }
        column: { type: string, format: uuid, description: "Board column (default: the backlog column, else the first)." }
        sprintId: { type: string, format: uuid, description: A sprint of the project. }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        labels: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
        templateId: { type: string, format: uuid, description: Workflow template (default template when omitted). }
    TaskDetail:
      type: object
      required: [task, plan, issues, steps, artifacts, approvals]
      properties:
        task: { $ref: "#/components/schemas/Task" }
        workflow: { $ref: "#/components/schemas/WorkflowRun" }
        plan: { $ref: "#/components/schemas/WorkflowPlan" }
        issues:
          description: Problems that would stop the task's workflow from starting.
          type: array
          items: { $ref: "#/components/schemas/PlanIssue" }
        steps: { type: array, items: { $ref: "#/components/schemas/WorkflowStep" } }
        artifacts:
          description: Latest version of each artifact kind.
          type: array
          items: { $ref: "#/components/schemas/Artifact" }
        approvals: { type: array, items: { $ref: "#/components/schemas/Approval" } }
    WorkflowRunStatus:
      type: string
      enum: [pending, running, awaiting_approval, awaiting_retry, completed, failed, cancelled]
    WorkflowRun:
      type: object
      required: [id, taskId, workflowType, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        workflowType: { type: string }
        status: { $ref: "#/components/schemas/WorkflowRunStatus" }
        currentStage: { type: string, nullable: true }
        error: { type: string, nullable: true }
        temporalWorkflowId: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
    WorkflowStepStatus:
      type: string
      enum: [running, awaiting_approval, succeeded, failed, cancelled, skipped]
    WorkflowStep:
      type: object
      required: [id, stage, attempt, status, startedAt]
      properties:
        id: { type: string, format: uuid }
        stage: { type: string }
        attempt: { type: integer }
        status: { $ref: "#/components/schemas/WorkflowStepStatus" }
        agentRunId: { type: string, format: uuid, nullable: true }
        artifactId: { type: string, format: uuid, nullable: true }
        error: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
    WorkflowDetail:
      type: object
      required: [workflow, steps]
      properties:
        workflow: { $ref: "#/components/schemas/WorkflowRun" }
        steps: { type: array, items: { $ref: "#/components/schemas/WorkflowStep" } }
    WorkflowEvent:
      type: object
      required: [workflowRunId, seq, type, payload, createdAt]
      properties:
        workflowRunId: { type: string, format: uuid }
        seq: { type: integer }
        type: { type: string }
        payload: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    WorkflowEventList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkflowEvent" } }
    ArtifactKind:
      type: string
      description: The artifact kind an agent produces (e.g. product_analysis, requirements, plan, final_report).
      pattern: "^[a-z][a-z0-9_]{1,62}$"
    Artifact:
      type: object
      required: [id, taskId, kind, version, content, contentHash, createdAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        workflowRunId: { type: string, format: uuid, nullable: true }
        kind: { $ref: "#/components/schemas/ArtifactKind" }
        version: { type: integer }
        content: { type: object, additionalProperties: true }
        contentHash: { type: string }
        agentRunId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    ArtifactList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Artifact" } }
    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected, superseded, cancelled]
    ApprovalGate:
      type: string
      description: The id of the reviewed workflow step.
    ArtifactRef:
      type: object
      required: [artifactId, kind, version, hash]
      properties:
        artifactId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ArtifactKind" }
        version: { type: integer }
        hash: { type: string }
    Approval:
      type: object
      required: [id, workflowRunId, taskId, gate, round, status, artifacts, combinedHash, notes, createdAt]
      properties:
        id: { type: string, format: uuid }
        workflowRunId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        taskTitle: { type: string }
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        gate: { $ref: "#/components/schemas/ApprovalGate" }
        round: { type: integer }
        status: { $ref: "#/components/schemas/ApprovalStatus" }
        artifacts: { type: array, items: { $ref: "#/components/schemas/ArtifactRef" } }
        combinedHash:
          type: string
          description: Send this back when deciding; it identifies exactly what was reviewed.
        notes: { type: array, items: { type: string } }
        comment: { type: string, nullable: true }
        decidedBy: { type: string, format: uuid, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    ApprovalList:
      type: object
      required: [items, pendingCount]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Approval" } }
        pendingCount: { type: integer }
    ApprovalDetail:
      type: object
      required: [approval, artifacts]
      properties:
        approval: { $ref: "#/components/schemas/Approval" }
        artifacts:
          description: The pinned artifact versions, with content.
          type: array
          items: { $ref: "#/components/schemas/Artifact" }
    ApprovalDecisionRequest:
      type: object
      required: [combinedHash]
      properties:
        combinedHash: { type: string, minLength: 64, maxLength: 64 }
        comment: { type: string, maxLength: 10000 }
    AccountKind:
      type: string
      enum: [claude_code, codex_cli, openai_compatible, anthropic, jira, clickup, trello, github, gitlab]
    Account:
      type: object
      required: [id, name, kind, baseUrl, defaultModel, cloud, enabled, hasSecret, secretHint, metadata, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/AccountKind" }
        baseUrl: { type: string }
        defaultModel: { type: string }
        cloud: { type: boolean, description: Requests leave this machine (subject to the cloud policy). }
        enabled: { type: boolean }
        hasSecret: { type: boolean }
        secretHint: { type: string, description: e.g. "…abcd"; the secret itself is never returned. }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AccountList:
      type: object
      required: [items, secretsEnabled, builtinProviders]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Account" } }
        secretsEnabled: { type: boolean, description: False when WISE_SECRETS_KEY is not configured. }
        builtinProviders:
          description: Providers from configs/models/models.yaml, also selectable per step.
          type: array
          items: { type: string }
    CreateAccountRequest:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        kind: { $ref: "#/components/schemas/AccountKind" }
        baseUrl: { type: string, maxLength: 500 }
        defaultModel: { type: string, maxLength: 200 }
        cloud: { type: boolean }
        enabled: { type: boolean }
        metadata: { type: object, additionalProperties: true }
        secret: { type: string, maxLength: 65536, writeOnly: true }
    UpdateAccountRequest:
      type: object
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        baseUrl: { type: string, maxLength: 500 }
        defaultModel: { type: string, maxLength: 200 }
        cloud: { type: boolean }
        enabled: { type: boolean }
        metadata: { type: object, additionalProperties: true }
        secret: { type: string, maxLength: 65536, writeOnly: true }
    AccountTestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: string }
    RunTaskRequest:
      type: object
      properties:
        stepByStep: { type: boolean, description: Pause after every step. }
    StepType:
      type: string
      enum: [agent, workspace, quality, gate, deliver, release]
      description: "agent runs an agent; workspace prepares the task workspace; quality runs the repository's checks; gate passes or fails on checks and reviews, runs fix rounds and produces the verified changeset; deliver writes the approved commit as the task branch; release asks for your push approval, pushes the branch and opens a pull request per the project's policy."
    TemplateStep:
      type: object
      required: [id]
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9_-]{0,40}$" }
        name: { type: string, maxLength: 100 }
        type: { $ref: "#/components/schemas/StepType" }
        agent: { type: string, description: The agent an agent step runs. }
        runtime: { type: string, enum: [native, claude-code, codex], description: "Implementing agent steps: run on an external coding CLI instead of Wise's own loop." }
        fixFrom: { type: string, description: "Gate: the implementing step re-run with the failures (default: the nearest earlier implementing step)." }
        diagnoseWith: { type: string, description: "Gate: an agent (e.g. qa-agent) that explains failures before each fix round." }
        account: { type: string, description: Account or models.yaml provider; empty = the agent's default routing. }
        model: { type: string }
        review: { type: boolean, description: Pause after this step until its result is approved. }
        reviewIncludes:
          type: array
          description: Earlier step ids whose outputs the same review pins.
          items: { type: string }
        reviseFrom: { type: string, description: Earliest step re-run when changes are requested. }
        enabled: { type: boolean }
    TemplateDefinition:
      type: object
      required: [steps]
      properties:
        steps: { type: array, items: { $ref: "#/components/schemas/TemplateStep" } }
        source:
          type: object
          properties:
            autoStart: { type: boolean, description: Run as soon as a task is created or imported. }
        destination:
          type: object
          properties:
            column: { $ref: "#/components/schemas/ColumnRole" }
        finalReport: { type: boolean }
        maxRevisions: { type: integer, minimum: 0, maximum: 50 }
    EmbeddingStatus:
      type: object
      required: [configured, available, cloud, allowCloud, embedded, pending]
      properties:
        configured: { type: boolean }
        available: { type: boolean, description: Configured and able to run now. }
        provider: { type: string }
        model: { type: string }
        cloud: { type: boolean }
        allowCloud: { type: boolean }
        problem: { type: string, description: Why semantic search cannot run right now. }
        embedded: { type: integer, format: int64 }
        pending: { type: integer, format: int64 }
        lastError: { type: string }
        lastRun: { type: string, format: date-time, nullable: true }
    MemoryScope: { type: string, enum: [developer, project] }
    MemoryKind: { type: string, enum: [rule, preference, decision, fact, convention, example] }
    MemoryCategory: { type: string, enum: [coding, architecture, testing, api, database, security, tooling, product, other] }
    MemoryStatus: { type: string, enum: [candidate, active, rejected, archived] }
    Memory:
      type: object
      required: [id, scope, kind, category, title, body, status, source, sourceRefs, rationale, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        scope: { $ref: "#/components/schemas/MemoryScope" }
        projectId: { type: string, format: uuid, nullable: true }
        projectName: { type: string, nullable: true }
        kind: { $ref: "#/components/schemas/MemoryKind" }
        category: { $ref: "#/components/schemas/MemoryCategory" }
        title: { type: string }
        body: { type: string }
        status: { $ref: "#/components/schemas/MemoryStatus" }
        source: { type: string, enum: [manual, review_feedback, report, profile_inference, task, improvement] }
        sourceRefs: { type: object, additionalProperties: true }
        rationale: { type: string }
        duplicateOf: { type: string, format: uuid, nullable: true }
        version: { type: integer }
        decidedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MemoryInput:
      type: object
      required: [scope, kind, title, body]
      properties:
        scope: { $ref: "#/components/schemas/MemoryScope" }
        projectId: { type: string, format: uuid, nullable: true }
        kind: { $ref: "#/components/schemas/MemoryKind" }
        category: { $ref: "#/components/schemas/MemoryCategory" }
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 8000 }
    MemoryList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Memory" } }
    ExampleInput:
      type: object
      required: [path, startLine, endLine]
      properties:
        path: { type: string, minLength: 1, maxLength: 1024 }
        startLine: { type: integer, minimum: 1 }
        endLine: { type: integer, minimum: 1 }
        title: { type: string, maxLength: 200 }
        note: { type: string, maxLength: 2000, description: Why this is a good example. }
        category: { $ref: "#/components/schemas/MemoryCategory" }
    MemoryInbox:
      type: object
      required: [candidates]
      properties:
        candidates: { type: integer, format: int64 }
    MemoryVersion:
      type: object
      required: [version, scope, kind, category, title, body, status, createdAt]
      properties:
        version: { type: integer }
        scope: { type: string }
        projectId: { type: string, format: uuid, nullable: true }
        kind: { type: string }
        category: { type: string }
        title: { type: string }
        body: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
    MemoryVersionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MemoryVersion" } }
    RunContext:
      type: object
      description: What the run was given at its start (rules, relevant memories, project summary), frozen per run.
      properties:
        text: { type: string }
        rules: { type: array, items: { $ref: "#/components/schemas/RunContextRef" } }
        relevant: { type: array, items: { $ref: "#/components/schemas/RunContextRef" } }
        project: { type: string }
        semantic: { type: boolean }
    RunContextRef:
      type: object
      required: [id, kind, scope, title]
      properties:
        id: { type: string }
        kind: { type: string }
        scope: { type: string }
        title: { type: string }
    ContextKind:
      type: string
      enum: [symbol, code, doc, config]
    ContextHit:
      type: object
      required: [kind, repository, repositoryId, path, startLine, endLine, title, snippet, score, why, stale]
      properties:
        kind: { type: string, description: "symbol, code, doc or config" }
        repository: { type: string }
        repositoryId: { type: string, format: uuid }
        path: { type: string }
        language: { type: string }
        startLine: { type: integer }
        endLine: { type: integer }
        title: { type: string }
        snippet: { type: string }
        score: { type: number, format: double }
        why: { type: string }
        indexedSha: { type: string }
        stale: { type: boolean, description: "HEAD moved since this was indexed; read the file to be sure." }
    ContextHits:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ContextHit" } }
        note: { type: string }
    Dependency:
      type: object
      required: [ecosystem, name, version, dev, manifest, repository]
      properties:
        ecosystem: { type: string }
        name: { type: string }
        version: { type: string }
        dev: { type: boolean }
        manifest: { type: string }
        repository: { type: string }
    DependencyList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Dependency" } }
    IndexJob:
      type: object
      required: [id, status, reason, stats, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, done, failed, cancelled] }
        reason: { type: string }
        commitSha: { type: string, nullable: true }
        stats: { type: object, additionalProperties: true }
        error: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    RepositoryIndex:
      type: object
      required: [status, stale, stats, jobs]
      properties:
        status: { $ref: "#/components/schemas/RepositoryIndexStatus" }
        indexedSha: { type: string, nullable: true }
        headSha: { type: string, nullable: true }
        indexedAt: { type: string, format: date-time, nullable: true }
        stale: { type: boolean }
        stats: { type: object, additionalProperties: true }
        error: { type: string, nullable: true }
        jobs: { type: array, items: { $ref: "#/components/schemas/IndexJob" } }
    RepositoryFile:
      type: object
      required: [path, content, lines, truncated]
      properties:
        path: { type: string }
        content: { type: string }
        lines: { type: integer }
        truncated: { type: boolean }
        headSha: { type: string, nullable: true }
    IndexClaim:
      type: object
      required: [jobId, token, leaseSeconds, repository, settings, manifest]
      properties:
        jobId: { type: string, format: uuid }
        token: { type: string, description: Per-job token for the other index routes. }
        leaseSeconds: { type: integer }
        repository:
          type: object
          required: [id, name, localPath]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            localPath: { type: string }
        settings: { type: object, additionalProperties: true }
        manifest: { type: object, additionalProperties: { type: string }, description: "path -> content hash already stored" }
    IndexSymbol:
      type: object
      required: [name, kind, startLine, endLine]
      properties:
        name: { type: string, maxLength: 200 }
        kind: { type: string, maxLength: 30 }
        signature: { type: string }
        parent: { type: string }
        exported: { type: boolean }
        startLine: { type: integer, minimum: 1 }
        endLine: { type: integer, minimum: 1 }
        doc: { type: string }
    IndexChunk:
      type: object
      required: [kind, startLine, endLine, content]
      properties:
        kind: { type: string, enum: [code, doc, config] }
        startLine: { type: integer, minimum: 1 }
        endLine: { type: integer, minimum: 1 }
        heading: { type: string }
        content: { type: string }
    IndexFile:
      type: object
      required: [path, contentHash]
      properties:
        path: { type: string, maxLength: 1024 }
        language: { type: string }
        size: { type: integer, minimum: 0 }
        contentHash: { type: string, maxLength: 128 }
        lines: { type: integer, minimum: 0 }
        imports: { type: array, items: { type: string } }
        skippedReason: { type: string, enum: ["", secret, too_large, binary, unreadable] }
        symbols: { type: array, items: { $ref: "#/components/schemas/IndexSymbol" } }
        chunks: { type: array, items: { $ref: "#/components/schemas/IndexChunk" } }
    IndexUpload:
      type: object
      properties:
        files: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/IndexFile" } }
        deleted: { type: array, maxItems: 20000, items: { type: string } }
    IndexComplete:
      type: object
      properties:
        commitSha: { type: string, maxLength: 64 }
        dependencies: { type: array, items: { $ref: "#/components/schemas/IndexDependency" } }
        stats: { type: object, additionalProperties: true }
    IndexFail:
      type: object
      required: [error]
      properties:
        error: { type: string, maxLength: 4000 }
    IndexDependency:
      type: object
      required: [ecosystem, name, manifest]
      properties:
        ecosystem: { type: string, maxLength: 20 }
        name: { type: string, maxLength: 200 }
        version: { type: string }
        dev: { type: boolean }
        manifest: { type: string }
    Sprint:
      type: object
      required: [id, projectId, name, closed, current, taskCount, openCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        startsOn: { type: string, format: date, nullable: true }
        endsOn: { type: string, format: date, nullable: true }
        closed: { type: boolean }
        current: { type: boolean, description: The project's current sprint. }
        taskCount: { type: integer }
        openCount: { type: integer, description: Tasks not in a done-role list. }
        sourceName: { type: string, nullable: true, description: The task source this sprint is followed from. }
        createdAt: { type: string, format: date-time }
    SprintList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Sprint" } }
    SprintInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        startsOn: { type: string, format: date, nullable: true }
        endsOn: { type: string, format: date, nullable: true }
    ColumnRole:
      type: string
      enum: [backlog, todo, in_progress, review, done]
      description: "What a column means to workflows: runs move cards to in_progress, then review, then the template's destination role."
    BoardColumn:
      type: object
      required: [id, projectId, name, position]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        position: { type: number, format: double }
        role: { $ref: "#/components/schemas/ColumnRole" }
        color: { type: string, nullable: true }
        wipLimit: { type: integer, nullable: true }
    BoardColumnList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BoardColumn" } }
    ColumnInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        role: { type: string, enum: ["", backlog, todo, in_progress, review, done], description: "Empty = no role. Taking a role moves it from the column that had it." }
        color: { type: string, description: "#rrggbb or empty." }
        wipLimit: { type: integer, minimum: 1, maximum: 1000, nullable: true }
        position: { type: number, format: double, description: Order on the board (columns sort ascending). }
    WorkflowTemplate:
      type: object
      required: [id, name, description, definition, version, isDefault, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, nullable: true }
        name: { type: string }
        description: { type: string }
        definition: { $ref: "#/components/schemas/TemplateDefinition" }
        version: { type: integer }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkflowTemplateList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkflowTemplate" } }
    WorkflowTemplateInput:
      type: object
      required: [name, definition]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        definition: { $ref: "#/components/schemas/TemplateDefinition" }
        isDefault: { type: boolean }
    PlanStep:
      type: object
      required: [id, name, agent, kind, enabled, review, reviewKinds]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, description: "Empty for agent steps." }
        agent: { type: string }
        runtime: { type: string, description: "Empty = native." }
        fixFrom: { type: string }
        diagnoseWith: { type: string }
        kind: { type: string, description: Artifact kind the step produces. }
        account: { type: string }
        model: { type: string }
        enabled: { type: boolean }
        review: { type: boolean }
        reviewKinds: { type: array, items: { type: string } }
        reviseFrom: { type: string }
        consumes:
          type: object
          additionalProperties: { type: string }
    WorkflowPlan:
      type: object
      required: [steps, finalReport, maxRevisions, destination, stepByStep]
      properties:
        templateId: { type: string }
        templateName: { type: string }
        templateVersion: { type: integer }
        steps: { type: array, items: { $ref: "#/components/schemas/PlanStep" } }
        finalReport: { type: boolean }
        maxRevisions: { type: integer }
        destination: { type: string }
        stepByStep: { type: boolean }
    PlanIssue:
      type: object
      required: [message]
      properties:
        stepId: { type: string }
        message: { type: string }
    PlanPreview:
      type: object
      required: [plan, issues]
      properties:
        plan: { $ref: "#/components/schemas/WorkflowPlan" }
        issues: { type: array, items: { $ref: "#/components/schemas/PlanIssue" } }
    StepOverride:
      type: object
      properties:
        runtime: { type: string, enum: [native, claude-code, codex], description: "Run this implementing step on a runtime the project enabled." }
        enabled: { type: boolean }
        account: { type: string }
        model: { type: string }
        review: { type: boolean }
    SetTaskWorkflowRequest:
      type: object
      properties:
        templateId: { type: string, format: uuid, nullable: true }
        steps:
          type: object
          description: Per-step overrides keyed by step id.
          additionalProperties: { $ref: "#/components/schemas/StepOverride" }
    TaskWorkflow:
      type: object
      required: [template, steps, plan, issues]
      properties:
        template: { $ref: "#/components/schemas/WorkflowTemplate" }
        steps:
          type: object
          additionalProperties: { $ref: "#/components/schemas/StepOverride" }
        plan: { $ref: "#/components/schemas/WorkflowPlan" }
        issues: { type: array, items: { $ref: "#/components/schemas/PlanIssue" } }
    ChangeStepRequest:
      type: object
      properties:
        account: { type: string, description: Empty string = back to the agent's default routing. }
        model: { type: string }
    IntegrationKind:
      type: string
      enum: [jira, clickup, trello]
    SyncResult:
      type: object
      required: [total, created, updated, unchanged, started, at]
      properties:
        total: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
        started: { type: integer }
        archived: { type: integer, description: Tasks the source no longer returns (archived). }
        restored: { type: integer, description: Archived tasks the source returned again. }
        errors: { type: array, items: { type: string } }
        at: { type: string, format: date-time }
    Integration:
      type: object
      required: [id, projectId, kind, name, accountId, config, statusMap, autoStart, intervalMinutes, enabled, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/IntegrationKind" }
        name: { type: string }
        accountId: { type: string, format: uuid }
        config: { type: object, additionalProperties: true, description: "jira: jql; clickup: listId; trello: boardId, lists[]" }
        statusMap:
          type: object
          description: External status (lowercase) → board column.
          additionalProperties: { type: string, format: uuid }
        defaultTemplateId: { type: string, format: uuid, nullable: true }
        sprintId: { type: string, format: uuid, nullable: true }
        autoStart: { type: boolean }
        intervalMinutes: { type: integer }
        enabled: { type: boolean }
        lastSyncedAt: { type: string, format: date-time, nullable: true }
        lastResult: { $ref: "#/components/schemas/SyncResult" }
        lastError: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IntegrationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Integration" } }
    IntegrationInput:
      type: object
      required: [name, kind, accountId]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { $ref: "#/components/schemas/IntegrationKind" }
        accountId: { type: string, format: uuid }
        config: { type: object, additionalProperties: true }
        statusMap:
          type: object
          additionalProperties: { type: string, format: uuid }
        defaultTemplateId: { type: string, format: uuid, nullable: true }
        sprintId: { type: string, format: uuid, nullable: true, description: "Fixed sprint for this source's tasks (follow modes create their own sprints)." }
        autoStart: { type: boolean }
        intervalMinutes: { type: integer, minimum: 5, maximum: 1440 }
        enabled: { type: boolean }
    Setting:
      type: object
      required: [key, title, description, value, version, updatedAt]
      properties:
        key: { type: string }
        title: { type: string }
        description: { type: string }
        value: { description: The current value (JSON). }
        default: { description: "The shipped default (JSON), when available." }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string, format: uuid, nullable: true }
    SettingList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Setting" } }
    UpdateSettingRequest:
      type: object
      required: [value, version]
      properties:
        value: { description: The new value (JSON). }
        version: { type: integer, description: The version the editor loaded. }
    SettingHistory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [version, value, createdAt]
            properties:
              version: { type: integer }
              value: {}
              updatedBy: { type: string, format: uuid, nullable: true }
              createdAt: { type: string, format: date-time }
    RuntimeClaimRequest:
      type: object
      required: [runtimeId]
      properties:
        runtimeId: { type: string, minLength: 1, maxLength: 200 }
    ToolDefinition:
      type: object
      required: [name, description, inputSchema, sideEffects, permissionsRequired]
      properties:
        name: { type: string }
        description: { type: string }
        inputSchema: { type: object, additionalProperties: true }
        sideEffects: { type: string, enum: [none, read, write, execute] }
        permissionsRequired: { type: array, items: { type: string } }
    RuntimeRepository:
      type: object
      required: [id, name, role, sourceType]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string }
        sourceType: { type: string }
        localPath: { type: string, nullable: true }
        remoteUrl: { type: string, nullable: true }
        currentBranch: { type: string, nullable: true }
        headSha: { type: string, nullable: true }
    RuntimeProject:
      type: object
      required: [id, name, slug, description, repositories]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        repositories: { type: array, items: { $ref: "#/components/schemas/RuntimeRepository" } }
    RuntimeClaim:
      type: object
      required: [run, runToken, leaseSeconds, definition, prompt, tools]
      properties:
        run: { $ref: "#/components/schemas/AgentRun" }
        runToken: { type: string, description: Bearer token scoped to this run; invalid once it ends. }
        leaseSeconds: { type: integer }
        definition: { type: object, additionalProperties: true }
        prompt: { type: string }
        tools: { type: array, items: { $ref: "#/components/schemas/ToolDefinition" } }
        project: { $ref: "#/components/schemas/RuntimeProject" }
        workspace: { type: boolean, description: "The run works in its task's workspace (write and execute tools are available)." }
        runtime: { type: string, description: "native, or an external coding runtime (claude-code, codex) that runs this agent." }
    ProjectCodingRuntimes:
      type: object
      required: [enabled, allowSubscription]
      properties:
        enabled: { type: array, items: { type: string, enum: [claude-code, codex] }, description: Runtimes the project's tasks may use. }
        allowSubscription: { type: boolean, description: "Allow subscription credentials (reduced isolation: the vendor token is inside the runner, readable by any command it runs)." }
    ExternalStart:
      type: object
      required: [runtime, mode, reducedIsolation, cliVersion]
      properties:
        runtime: { type: string }
        mode: { type: string, enum: [proxy, subscription] }
        reducedIsolation: { type: boolean }
        cliVersion: { type: string }
    ExternalEvent:
      type: object
      required: [type]
      additionalProperties: true
      properties:
        type: { type: string }
    ExternalOutcome:
      type: object
      required: [class, usage]
      properties:
        class: { type: string, enum: [succeeded, auth_error, rate_limited, budget_exceeded, timeout, policy_violation, runtime_crash, incomplete] }
        message: { type: string }
        output: { type: object, additionalProperties: true }
        usage:
          type: object
          required: [inputTokens, outputTokens, costUsd]
          properties:
            inputTokens: { type: integer, format: int64 }
            outputTokens: { type: integer, format: int64 }
            costUsd: { type: number }
            turns: { type: integer }
        retryable: { type: boolean }
    ExternalPoll:
      type: object
      required: [events, done]
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/ExternalEvent" } }
        done: { type: boolean }
        outcome: { $ref: "#/components/schemas/ExternalOutcome" }
    AgentStat:
      type: object
      required: [agent, version, definitionId, runs, succeeded, failed, cancelled, retries, invalidOutputs, medianSeconds, p90Seconds, costUsd, tokens, reviewed, rejected, gateFixRounds, thumbsUp, thumbsDown, successRate, rejectionRate, costPerRunUsd, invalidRate]
      properties:
        agent: { type: string }
        version: { type: string }
        definitionId: { type: string, format: uuid }
        runs: { type: integer, format: int64 }
        succeeded: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        cancelled: { type: integer, format: int64 }
        retries: { type: integer, format: int64 }
        invalidOutputs: { type: integer, format: int64 }
        medianSeconds: { type: number }
        p90Seconds: { type: number }
        costUsd: { type: number }
        tokens: { type: integer, format: int64 }
        reviewed: { type: integer, format: int64, description: Decided reviews this agent's work was part of (steps re-run on rejection). }
        rejected: { type: integer, format: int64 }
        gateFixRounds: { type: integer, format: int64, description: Failed quality-gate rounds this implementing agent had to fix. }
        thumbsUp: { type: integer, format: int64 }
        thumbsDown: { type: integer, format: int64 }
        successRate: { type: number }
        rejectionRate: { type: number }
        costPerRunUsd: { type: number }
        invalidRate: { type: number }
    InsightCluster:
      type: object
      required: [agent, text, count]
      properties:
        agent: { type: string }
        text: { type: string }
        count: { type: integer }
        runIds: { type: array, items: { type: string, format: uuid } }
        sources: { type: array, items: { type: string, format: uuid }, description: Approval ids (review comments). }
    InsightsReport:
      type: object
      required: [window, since, agents, providers, templates, stalls, failures, comments]
      properties:
        window: { type: string }
        since: { type: string, format: date-time }
        agents: { type: array, items: { $ref: "#/components/schemas/AgentStat" } }
        providers:
          type: array
          items:
            type: object
            required: [provider, model, calls, errors, rejected, medianLatencyMs, costUsd, tokens, errorRate]
            properties:
              provider: { type: string }
              model: { type: string }
              calls: { type: integer, format: int64 }
              errors: { type: integer, format: int64 }
              rejected: { type: integer, format: int64 }
              medianLatencyMs: { type: number }
              costUsd: { type: number }
              tokens: { type: integer, format: int64 }
              errorRate: { type: number }
        templates:
          type: array
          items:
            type: object
            required: [template, runs, completed, failed, cancelled, stalled, medianSeconds, costUsd]
            properties:
              template: { type: string }
              runs: { type: integer, format: int64 }
              completed: { type: integer, format: int64 }
              failed: { type: integer, format: int64 }
              cancelled: { type: integer, format: int64 }
              stalled: { type: integer, format: int64 }
              medianSeconds: { type: number }
              costUsd: { type: number }
        stalls:
          type: array
          items:
            type: object
            required: [template, stage, waiting]
            properties:
              template: { type: string }
              stage: { type: string }
              waiting: { type: integer, format: int64 }
        failures: { type: array, items: { $ref: "#/components/schemas/InsightCluster" } }
        comments: { type: array, items: { $ref: "#/components/schemas/InsightCluster" } }
    AgentInsights:
      type: object
      required: [agent, window, versions, days, failures, comments, feedback]
      properties:
        agent: { type: string }
        window: { type: string }
        versions: { type: array, items: { $ref: "#/components/schemas/AgentStat" } }
        days:
          type: array
          items:
            type: object
            required: [day, runs, succeeded, costUsd]
            properties:
              day: { type: string }
              runs: { type: integer, format: int64 }
              succeeded: { type: integer, format: int64 }
              costUsd: { type: number }
        failures: { type: array, items: { $ref: "#/components/schemas/InsightCluster" } }
        comments: { type: array, items: { $ref: "#/components/schemas/InsightCluster" } }
        feedback:
          type: array
          items:
            type: object
            required: [id, targetType, targetId, note, at]
            properties:
              id: { type: string, format: uuid }
              targetType: { type: string }
              targetId: { type: string, format: uuid }
              runId: { type: string, format: uuid, nullable: true }
              note: { type: string }
              at: { type: string, format: date-time }
    CostReport:
      type: object
      required: [window, groupBy, keys, days, total, billing, evalUsd, tokens, calls, budgets, topTasks]
      properties:
        window: { type: string }
        groupBy: { type: string }
        keys: { type: array, items: { type: string }, description: "Groups by total spend (at most 8, then other)." }
        days:
          type: array
          items:
            type: object
            required: [day, total, by]
            properties:
              day: { type: string }
              total: { type: number }
              by: { type: object, additionalProperties: { type: number } }
        total: { type: number }
        billing: { type: object, additionalProperties: { type: number }, description: "subscription, api, local" }
        evalUsd: { type: number }
        tokens: { type: integer, format: int64 }
        calls: { type: integer, format: int64 }
        budgets:
          type: array
          items:
            type: object
            required: [agent, spent]
            properties:
              agent: { type: string }
              spent: { type: number }
              budget: { type: number, nullable: true }
        topTasks:
          type: array
          items:
            type: object
            required: [id, title, costUsd, runs]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              costUsd: { type: number }
              runs: { type: integer, format: int64 }
    MonitorRun:
      type: object
      required: [id, agent, status, purpose, runtime, attempt, maxAttempts, cancelling, createdAt, tokens, costUsd]
      properties:
        id: { type: string, format: uuid }
        agent: { type: string }
        status: { type: string }
        purpose: { type: string }
        runtime: { type: string, description: "native, claude-code or codex" }
        account: { type: string }
        attempt: { type: integer }
        maxAttempts: { type: integer }
        cancelling: { type: boolean }
        projectId: { type: string, format: uuid, nullable: true }
        projectName: { type: string }
        taskId: { type: string, format: uuid, nullable: true }
        taskTitle: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        leaseUntil: { type: string, format: date-time, nullable: true }
        lastEvent: { type: string }
        lastEventAt: { type: string, format: date-time, nullable: true }
        tokens: { type: integer, format: int64 }
        costUsd: { type: number }
        stuck: { type: string, description: Why the run looks stuck (empty when it does not). }
    MonitorSnapshot:
      type: object
      required: [at, queued, running, evals, stuck, waiting]
      properties:
        at: { type: string, format: date-time }
        queued: { type: array, items: { $ref: "#/components/schemas/MonitorRun" } }
        running: { type: array, items: { $ref: "#/components/schemas/MonitorRun" } }
        evals: { type: array, items: { $ref: "#/components/schemas/MonitorRun" } }
        stuck: { type: integer }
        waiting:
          type: array
          items:
            type: object
            required: [id, taskId, taskTitle, projectName, status, stage, since]
            properties:
              id: { type: string, format: uuid }
              taskId: { type: string, format: uuid }
              taskTitle: { type: string }
              projectName: { type: string }
              status: { type: string, enum: [awaiting_approval, awaiting_retry] }
              stage: { type: string }
              error: { type: string, nullable: true }
              since: { type: string, format: date-time }
    TaskRelease:
      type: object
      required: [pushes, pullRequests, approvals]
      properties:
        request:
          type: object
          nullable: true
          description: What the push approval covers.
          properties:
            sha: { type: string }
            branch: { type: string }
            remote: { type: string }
            accountName: { type: string }
            baseBranch: { type: string }
        pushes:
          type: array
          items:
            type: object
            required: [id, status, remote, branch, sha, baseBranch, attempts, existed, createdAt]
            properties:
              id: { type: string, format: uuid }
              status: { type: string, enum: [granted, pushed, failed] }
              remote: { type: string }
              branch: { type: string }
              sha: { type: string }
              baseBranch: { type: string }
              attempts: { type: integer }
              existed: { type: boolean }
              error: { type: string, nullable: true }
              createdAt: { type: string, format: date-time }
              pushedAt: { type: string, format: date-time, nullable: true }
        pullRequests:
          type: array
          items:
            type: object
            required: [id, status, draft, title, createdAt]
            properties:
              id: { type: string, format: uuid }
              status: { type: string, enum: [granted, opened, failed] }
              number: { type: integer, nullable: true }
              url: { type: string, nullable: true }
              state: { type: string, nullable: true, description: "open, merged or closed (refreshed from the host)" }
              draft: { type: boolean }
              title: { type: string }
              error: { type: string, nullable: true }
              createdAt: { type: string, format: date-time }
        approvals:
          type: array
          description: Pending release approvals (push, pull request).
          items:
            type: object
            required: [id, gate, kind, combinedHash]
            properties:
              id: { type: string, format: uuid }
              gate: { type: string }
              kind: { type: string, enum: [push, pull_request] }
              combinedHash: { type: string }
    RepositoryRelease:
      type: object
      properties:
        remote: { type: string, description: "https address of the repository on GitHub or GitLab." }
        accountId: { type: string, format: uuid, nullable: true, description: The git account that pushes (same host as the remote). }
        baseBranch: { type: string, description: Pull requests target this branch; Wise never pushes to it. }
    ReleasePolicy:
      type: object
      required: [pullRequests, draft]
      properties:
        pullRequests: { type: string, enum: [off, ask, auto], description: "After an approved push: no pull request, ask you, or open one." }
        draft: { type: boolean, description: Open pull requests as drafts. }
    ModelChoice:
      type: object
      properties:
        account: { type: string, description: Empty = the agent's own routing. }
        model: { type: string }
    EvalCase:
      type: object
      required: [id, agentName, kind, input, source, expectation, enabled, createdAt]
      properties:
        id: { type: string, format: uuid }
        agentName: { type: string }
        kind: { type: string, enum: [golden, must_fix, custom] }
        input: { type: object, additionalProperties: true }
        projectId: { type: string, format: uuid, nullable: true }
        sourceRunId: { type: string, format: uuid, nullable: true }
        source: { type: string, description: "approval, feedback or manual" }
        expectation: { type: string }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
    EvalPlan:
      type: object
      required: [evaluable, cases, estimatedCostUsd, defaults, choosesModel]
      properties:
        evaluable: { type: boolean }
        reason: { type: string, description: Why it cannot be evaluated. }
        agent: { type: string }
        agents: { type: array, items: { type: string }, description: Routing - the affected agents to choose from. }
        cases: { type: integer }
        estimatedCostUsd: { type: number, description: From the agent's average run cost over 30 days (local models cost nothing). }
        choosesModel: { type: boolean, description: False for routing (the models are what is compared). }
        defaults:
          type: object
          required: [max_cases, cost_cap_usd, judge]
          properties:
            max_cases: { type: integer }
            cost_cap_usd: { type: number }
            judge: { $ref: "#/components/schemas/ModelChoice" }
    EvalResult:
      type: object
      required: [id, caseKind, expectation, status]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid, nullable: true }
        caseKind: { type: string }
        expectation: { type: string }
        baselineRunId: { type: string, format: uuid, nullable: true }
        candidateRunId: { type: string, format: uuid, nullable: true }
        judgeRunId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [pending, running, judging, done, failed] }
        checks: { type: object, additionalProperties: true, nullable: true }
        baselineScore: { type: integer, nullable: true }
        candidateScore: { type: integer, nullable: true }
        reasoning: { type: string, nullable: true }
        error: { type: string, nullable: true }
    EvalRun:
      type: object
      required: [id, proposalId, agentName, status, costCapUsd, createdAt, results]
      properties:
        id: { type: string, format: uuid }
        proposalId: { type: string, format: uuid }
        agentName: { type: string }
        baselineModel: { $ref: "#/components/schemas/ModelChoice" }
        candidateModel: { $ref: "#/components/schemas/ModelChoice" }
        judgeModel: { $ref: "#/components/schemas/ModelChoice" }
        status: { type: string, enum: [running, succeeded, failed, cancelled] }
        costCapUsd: { type: number }
        summary:
          type: object
          nullable: true
          properties:
            cases: { type: integer }
            judged: { type: integer }
            failed: { type: integer }
            baselineMean: { type: number }
            candidateMean: { type: number }
            candidateBetter: { type: integer }
            same: { type: integer }
            candidateWorse: { type: integer }
            baselineInvalid: { type: integer }
            candidateInvalid: { type: integer }
            candidateSecrets: { type: integer }
            costUsd: { type: number }
        error: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        results: { type: array, items: { $ref: "#/components/schemas/EvalResult" } }
    ImprovementAnalysis:
      type: object
      required: [id, trigger, windowDays, status, proposals, refused, createdAt]
      properties:
        id: { type: string, format: uuid }
        trigger: { type: string, enum: [manual, scheduled] }
        period: { type: string, nullable: true }
        windowDays: { type: integer }
        status: { type: string, enum: [running, succeeded, failed, skipped] }
        agentRunId: { type: string, format: uuid, nullable: true }
        proposals: { type: integer, description: Proposals stored. }
        refused:
          type: array
          description: Proposals refused by the hard rule, the evidence check or as duplicates, with the reason.
          items:
            type: object
            required: [kind, target, title, reason]
            properties:
              kind: { type: string }
              target: { type: string }
              title: { type: string }
              reason: { type: string }
        error: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
    ImprovementProposal:
      type: object
      required: [id, kind, target, title, rationale, evidence, change, before, base, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        analysisId: { type: string, format: uuid, nullable: true }
        kind: { type: string, enum: [prompt, memory, routing, template] }
        target: { type: string, description: "The agent, setting (models, model_policy), template id, or \"memory\"." }
        title: { type: string }
        rationale: { type: string }
        evidence:
          type: object
          properties:
            run_ids: { type: array, items: { type: string } }
            approval_ids: { type: array, items: { type: string } }
            feedback_ids: { type: array, items: { type: string } }
            memory_ids: { type: array, items: { type: string } }
        change: { type: object, additionalProperties: true, description: The typed change applying would write. }
        before: { type: object, additionalProperties: true, description: The target when the proposal was made (for the diff). }
        base: { type: object, additionalProperties: true, description: The versions the proposal was written against. }
        status: { type: string, enum: [proposed, evaluating, evaluated, applying, applied, rejected, rolled_back, stale] }
        metricsBefore: { nullable: true, description: The target's metrics when proposed. }
        applied: { type: object, additionalProperties: true, nullable: true, description: What applying produced and replaced. }
        decisionNote: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        appliedAt: { type: string, format: date-time, nullable: true }
        rolledBackAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FeedbackInput:
      type: object
      required: [targetType, targetId, rating]
      properties:
        targetType: { type: string, enum: [run, artifact] }
        targetId: { type: string, format: uuid }
        rating: { type: string, enum: [up, down] }
        note: { type: string, maxLength: 2000 }
    Feedback:
      type: object
      required: [id, targetType, targetId, rating, note, userId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        targetType: { type: string, enum: [run, artifact] }
        targetId: { type: string, format: uuid }
        agentName: { type: string, nullable: true, description: The agent that produced the result (none for Wise's own artifacts). }
        agentDefinitionId: { type: string, format: uuid, nullable: true }
        taskId: { type: string, format: uuid, nullable: true }
        rating: { type: string, enum: [up, down] }
        note: { type: string }
        userId: { type: string, format: uuid }
        username: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkspaceCommandResult:
      type: object
      required: [status, output, durationMs]
      properties:
        exitCode: { type: integer, nullable: true }
        status: { type: string, description: "succeeded (it ran; see exitCode), failed or cancelled." }
        output: { type: string, description: "Combined output; long output keeps its start and end." }
        truncated: { type: boolean }
        timedOut: { type: boolean }
        durationMs: { type: integer, format: int64 }
    WorkingDiff:
      type: object
      required: [stat, patch]
      properties:
        stat: { type: string }
        patch: { type: string }
        truncated: { type: boolean }
    RuntimeHeartbeat:
      type: object
      required: [cancelRequested, leaseSeconds]
      properties:
        cancelRequested: { type: boolean }
        leaseSeconds: { type: integer }
    RuntimeEvent:
      type: object
      required: [type, payload]
      properties:
        type: { type: string, enum: [tool.call, tool.result, agent.message, output.invalid, artifact.created, external.started, external.finished, file.changed, agent.warning] }
        payload: { type: object, additionalProperties: true }
    RuntimeEventsRequest:
      type: object
      required: [events]
      properties:
        events: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/RuntimeEvent" } }
    TurnMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant, tool] }
        content: { type: string, maxLength: 400000 }
        name: { type: string }
    ModelTurnRequest:
      type: object
      required: [messages]
      properties:
        messages: { type: array, minItems: 1, maxItems: 400, items: { $ref: "#/components/schemas/TurnMessage" } }
    TurnToolCall:
      type: object
      required: [tool, arguments]
      properties:
        tool: { type: string }
        arguments: { type: object, additionalProperties: true }
    TokenUsage:
      type: object
      required: [inputTokens, outputTokens]
      properties:
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
    ModelTurn:
      type: object
      required: [action, alias, provider, model, usage, costUsd, cacheHit, latencyMs]
      properties:
        action: { type: string, enum: [call_tools, final, invalid] }
        thought: { type: string }
        toolCalls: { type: array, items: { $ref: "#/components/schemas/TurnToolCall" } }
        final: { type: object, additionalProperties: true, nullable: true }
        parseError: { type: string }
        rawText: { type: string }
        alias: { type: string }
        provider: { type: string }
        model: { type: string }
        usage: { $ref: "#/components/schemas/TokenUsage" }
        costUsd: { type: number, format: double }
        cacheHit: { type: boolean }
        latencyMs: { type: integer, format: int64 }
    RuntimeCompleteRequest:
      type: object
      required: [output]
      properties:
        output: { type: object, additionalProperties: true }
    RuntimeFailRequest:
      type: object
      required: [error]
      properties:
        error: { type: string, maxLength: 10000 }
        retryable: { type: boolean, default: false }
        cancelled: { type: boolean, default: false }
