openapi: 3.0.3
info:
  title: Wise API
  version: 0.1.0
  description: |
    Control-plane API for Wise, the personal AI engineering platform.

    Authentication: either the `wise_session` cookie (dashboard) or an
    `Authorization: Bearer wise_...` personal API token. State-changing requests
    authenticated by cookie must also send the session's CSRF token in the
    `X-Wise-CSRF` header (returned by `/auth/login` and `/auth/me`).

    Errors use RFC 7807 `application/problem+json`.
servers:
  - url: http://localhost:8080/api/v1
security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: system
  - name: auth
  - name: projects
  - name: repositories
  - name: agents
  - name: models
  - name: runtime
  - name: tasks
  - name: workflows
  - name: approvals
  - name: accounts
  - name: templates
  - name: integrations
  - name: settings
  - name: context
  - name: memory
  - name: execution
  - name: improvement
  - name: release
  - name: monitor

paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      tags: [system]
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Dependencies are reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          $ref: "#/components/responses/Problem"

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in. Sets the `wise_session` cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        "204":
          description: Session ended and cookie cleared.
        "401": { $ref: "#/components/responses/Problem" }
  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        "200":
          description: Current principal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/tokens:
    get:
      tags: [auth]
      operationId: listApiTokens
      responses:
        "200":
          description: Personal API tokens of the current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenList" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [auth]
      operationId: createApiToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiTokenRequest" }
      responses:
        "201":
          description: Token created. The secret is shown only once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedApiToken" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    delete:
      tags: [auth]
      operationId: revokeApiToken
      responses:
        "204": { description: Token revoked. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Projects.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectList" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [projects]
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [projects]
      operationId: getProject
      responses:
        "200":
          description: Project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [projects]
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectRequest" }
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [projects]
      operationId: archiveProject
      description: Archives (soft-deletes) the project.
      responses:
        "204": { description: Project archived. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/resources:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [projects]
      operationId: listProjectResources
      responses:
        "200":
          description: Resources attached to the project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResourceList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [projects]
      operationId: createProjectResource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectResourceRequest" }
      responses:
        "201":
          description: Resource created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResource" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /project-resources/{resourceId}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    delete:
      tags: [projects]
      operationId: deleteProjectResource
      responses:
        "204": { description: Resource deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/repositories:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [repositories]
      operationId: listRepositories
      responses:
        "200":
          description: Repositories of the project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [repositories]
      operationId: createRepository
      description: |
        Registers a repository. Local repositories must live under one of the
        configured `WISE_REPO_ROOTS` and are inspected immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRepositoryRequest" }
      responses:
        "201":
          description: Repository registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /repositories/{repositoryId}:
    parameters:
      - $ref: "#/components/parameters/RepositoryId"
    get:
      tags: [repositories]
      operationId: getRepository
      responses:
        "200":
          description: Repository.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [repositories]
      operationId: updateRepository
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRepositoryRequest" }
      responses:
        "200":
          description: Updated repository.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [repositories]
      operationId: deleteRepository
      description: Unregisters the repository. Files on disk are never touched.
      responses:
        "204": { description: Repository unregistered. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /repositories/{repositoryId}/inspect:
    parameters:
      - $ref: "#/components/parameters/RepositoryId"
    post:
      tags: [repositories]
      operationId: inspectRepository
      description: Refreshes Git information (branch, HEAD SHA, remotes) for a local repository.
      responses:
        "200":
          description: Repository with refreshed Git information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "400": { $ref: "#/components/responses/Problem" }
  /repositories/{repositoryId}/index:
    parameters:
      - $ref: "#/components/parameters/RepositoryId"
    post:
      tags: [repositories]
      operationId: requestRepositoryIndex
      description: Queues an index job for the repository (reused if one is already pending).
      responses:
        "202":
          description: Index request accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    get:
      tags: [context]
      operationId: getRepositoryIndex
      responses:
        "200":
          description: Index state and recent jobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryIndex" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /repositories/{repositoryId}/status:
    parameters:
      - $ref: "#/components/parameters/RepositoryId"
    get:
      tags: [repositories]
      operationId: getRepositoryStatus
      responses:
        "200":
          description: Indexing and Git status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/repository-relationships:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [repositories]
      operationId: listRepositoryRelationships
      responses:
        "200":
          description: Relationships between repositories of the project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryRelationshipList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [repositories]
      operationId: createRepositoryRelationship
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRepositoryRelationshipRequest" }
      responses:
        "201":
          description: Relationship created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryRelationship" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /repository-relationships/{relationshipId}:
    parameters:
      - $ref: "#/components/parameters/RelationshipId"
    delete:
      tags: [repositories]
      operationId: deleteRepositoryRelationship
      responses:
        "204": { description: Relationship deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /tools:
    get:
      tags: [agents]
      operationId: listTools
      description: The tool catalog agents can use (implemented by the runtime).
      responses:
        "200":
          description: Tools.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolList" }
        "401": { $ref: "#/components/responses/Problem" }
  /agents:
    post:
      tags: [agents]
      operationId: createAgent
      description: Creates an agent defined in the panel. Signed-in session only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      tags: [agents]
      operationId: listAgents
      responses:
        "200":
          description: Current agent definitions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentList" }
        "401": { $ref: "#/components/responses/Problem" }
  /agents/{agentName}:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    put:
      tags: [agents]
      operationId: updateAgent
      description: Saves a new version of the agent's contract and prompt (applies to new runs). Signed-in session only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [agents]
      operationId: deleteAgent
      description: Deletes an agent created in the panel (shipped agents can be disabled instead).
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      tags: [agents]
      operationId: getAgent
      responses:
        "200":
          description: Agent definition with its contract and prompt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /agents/{agentName}/duplicate:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    post:
      tags: [agents]
      operationId: duplicateAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, pattern: "^[a-z][a-z0-9-]*-agent$" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /agents/{agentName}/reset:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    post:
      tags: [agents]
      operationId: resetAgent
      description: Restores the latest shipped definition and prompt.
      responses:
        "200":
          description: Reset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /agents/{agentName}/versions:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    get:
      tags: [agents]
      operationId: listAgentVersions
      responses:
        "200":
          description: Versions, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentVersionList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /agents/{agentName}/versions/{versionId}/restore:
    parameters:
      - $ref: "#/components/parameters/AgentName"
      - name: versionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [agents]
      operationId: restoreAgentVersion
      responses:
        "200":
          description: Restored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /agents/{agentName}/runs:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    get:
      tags: [agents]
      operationId: listAgentRunsForAgent
      responses:
        "200":
          description: Recent runs of the agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRunList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [agents]
      operationId: createAgentRun
      description: Queues a run. `input` is validated against the agent's input_schema.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgentRunRequest" }
      responses:
        "202":
          description: Run queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /agent-runs:
    get:
      tags: [agents]
      operationId: listAgentRuns
      parameters:
        - name: projectId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Recent runs across agents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRunList" }
        "401": { $ref: "#/components/responses/Problem" }
  /agent-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [agents]
      operationId: getAgentRun
      responses:
        "200":
          description: Run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /agent-runs/{runId}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [agents]
      operationId: listAgentRunEvents
      description: |
        Events in order. Live updates are available over the WebSocket at
        `GET /api/v1/events/ws?runId=<id>` (messages are AgentEvent JSON).
      parameters:
        - name: afterSeq
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentEventList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /agent-runs/{runId}/model-calls:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [agents]
      operationId: listAgentRunModelCalls
      responses:
        "200":
          description: Every model call attempt made for the run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelCallList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /agent-runs/{runId}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [agents]
      operationId: cancelAgentRun
      responses:
        "200":
          description: Run cancelled (queued) or cancellation requested (running).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /models:
    get:
      tags: [models]
      operationId: getModelsOverview
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
      responses:
        "200":
          description: Model aliases, provider health and usage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelsOverview" }
        "401": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [tasks]
      operationId: createTask
      description: |
        Creates a task. With `start` (default true) its engineering workflow starts
        right away: product analysis → requirements → scope approval → planning →
        architecture review → plan approval → final report.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
      responses:
        "201":
          description: Task created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /projects/{projectId}/board:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [tasks]
      operationId: getBoard
      description: The project's task board, one entry per column with ordered cards.
      responses:
        "200":
          description: Board.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{projectId}/sprints:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [tasks]
      operationId: listSprints
      responses:
        "200":
          description: The project's sprints (open first, newest first).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SprintList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [tasks]
      operationId: createSprint
      description: Adds a sprint. A project's first sprint becomes its current one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SprintInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sprint" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /sprints/{sprintId}:
    parameters:
      - $ref: "#/components/parameters/SprintId"
    put:
      tags: [tasks]
      operationId: updateSprint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SprintInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sprint" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [tasks]
      operationId: deleteSprint
      description: Deletes a sprint; its tasks stay, without a sprint. A followed sprint comes back on the next sync while the source still has it.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /sprints/{sprintId}/start:
    parameters:
      - $ref: "#/components/parameters/SprintId"
    post:
      tags: [tasks]
      operationId: startSprint
      description: Makes the sprint current. Unfinished tasks created in Wise move to it from the previous sprint.
      responses:
        "204": { description: Started. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /sprints/{sprintId}/complete:
    parameters:
      - $ref: "#/components/parameters/SprintId"
    post:
      tags: [tasks]
      operationId: completeSprint
      description: Closes the sprint. If it was current, the next open sprint takes over and unfinished tasks created in Wise move to it.
      responses:
        "204": { description: Completed. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /context/embeddings:
    get:
      tags: [context]
      operationId: getEmbeddingStatus
      description: Whether semantic search is configured and running, and how far embedding has got.
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbeddingStatus" }
        "401": { $ref: "#/components/responses/Problem" }
  /projects/{projectId}/context/search:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [context]
      operationId: searchContext
      description: Searches the project's code index (symbols, code, docs, config).
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 500 } }
        - { name: kind, in: query, required: false, schema: { $ref: "#/components/schemas/ContextKind" } }
        - { name: repositoryId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextHits" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{projectId}/context/symbols:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [context]
      operationId: listContextSymbols
      parameters:
        - { name: name, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: kind, in: query, required: false, schema: { type: string, maxLength: 30 } }
        - { name: repositoryId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextHits" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{projectId}/context/dependencies:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [context]
      operationId: listContextDependencies
      parameters:
        - { name: repositoryId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DependencyList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /repositories/{repositoryId}/file:
    parameters:
      - $ref: "#/components/parameters/RepositoryId"
    get:
      tags: [context]
      operationId: readRepositoryFile
      description: "Reads a file from the repository's working tree (read-only, within WISE_REPO_ROOTS). Files the secret guard flagged are refused."
      parameters:
        - { name: path, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 1024 } }
      responses:
        "200":
          description: File content.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryFile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{projectId}/columns:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [tasks]
      operationId: listColumns
      responses:
        "200":
          description: The project's board columns in order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardColumnList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [tasks]
      operationId: createColumn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ColumnInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardColumn" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /columns/{columnId}:
    parameters:
      - name: columnId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [tasks]
      operationId: updateColumn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ColumnInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardColumn" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [tasks]
      operationId: deleteColumn
      description: Deletes a column. Its cards (and status mappings) move to moveTo, which is required when it has cards.
      parameters:
        - name: moveTo
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      parameters:
        - name: projectId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/TaskStatus" }
        - name: archived
          in: query
          required: false
          description: List archived tasks instead of live ones.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Tasks, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskList" }
        "401": { $ref: "#/components/responses/Problem" }
  /tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    patch:
      tags: [tasks]
      operationId: updateTask
      description: Edits a card or moves it (column and/or position) on the board.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTaskRequest" }
      responses:
        "200":
          description: Updated task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    get:
      tags: [tasks]
      operationId: getTask
      responses:
        "200":
          description: Task with its latest workflow, steps, current artifacts and approvals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /tasks/{taskId}/cancel:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [tasks]
      operationId: cancelTask
      description: Cancels the task's active workflow (signed-in session only).
      responses:
        "202":
          description: Cancellation requested (or the task was cancelled directly).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tasks/{taskId}/artifacts:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [tasks]
      operationId: listTaskArtifacts
      description: Every version of the task's artifacts (optionally one kind), newest version first.
      parameters:
        - name: kind
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ArtifactKind" }
      responses:
        "200":
          description: Artifacts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /tasks/{taskId}/run:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [workflows]
      operationId: runTask
      description: |
        Starts the task's workflow (its template with the task's step overrides). With
        `stepByStep`, the workflow pauses after every step so you pass each result on yourself.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunTaskRequest" }
      responses:
        "202":
          description: Workflow queued for start.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowRun" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tasks/{taskId}/workflow:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [workflows]
      operationId: getTaskWorkflow
      description: The task's template, overrides and the plan a run would use (with any issues).
      responses:
        "200":
          description: Task workflow setup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskWorkflow" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [workflows]
      operationId: setTaskWorkflow
      description: Chooses the task's template (null = the default) and per-step overrides.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetTaskWorkflowRequest" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskWorkflow" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /workflows/{workflowId}:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"
    get:
      tags: [workflows]
      operationId: getWorkflow
      responses:
        "200":
          description: Workflow run with its steps.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /workflows/{workflowId}/events:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"
    get:
      tags: [workflows]
      operationId: listWorkflowEvents
      description: |
        Events in order. Live updates: WebSocket `GET /api/v1/events/ws?workflowId=<id>`
        (or `?stream=workflows` for every workflow); messages are WorkflowEvent JSON.
      parameters:
        - name: afterSeq
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowEventList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /workflows/{workflowId}/steps/{stepId}:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"
      - name: stepId
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z][a-z0-9_-]{0,40}$" }
    patch:
      tags: [workflows]
      operationId: changeWorkflowStep
      description: |
        Switches the account/model of a step that has not run yet or is waiting (for a retry or a
        review re-run). Signed-in session only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeStepRequest" }
      responses:
        "200":
          description: Updated plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowPlan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /workflows/{workflowId}/retry:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"
    post:
      tags: [workflows]
      operationId: retryWorkflow
      description: Resumes a workflow parked in `awaiting_retry` by re-running its failed stage (signed-in session only).
      responses:
        "202":
          description: Retry requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowRun" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /artifacts/{artifactId}:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      tags: [tasks]
      operationId: getArtifact
      responses:
        "200":
          description: Artifact version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ApprovalStatus" }
      responses:
        "200":
          description: Approvals, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalList" }
        "401": { $ref: "#/components/responses/Problem" }
  /approvals/{approvalId}:
    parameters:
      - $ref: "#/components/parameters/ApprovalId"
    get:
      tags: [approvals]
      operationId: getApproval
      responses:
        "200":
          description: Approval with the artifact versions it pins.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /approvals/{approvalId}/approve:
    parameters:
      - $ref: "#/components/parameters/ApprovalId"
    post:
      tags: [approvals]
      operationId: approveApproval
      description: |
        Approves exactly the artifact versions identified by `combinedHash`. Refused
        with 409 when any pinned artifact has a newer version or its content changed.
        Signed-in session only; API tokens get 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecisionRequest" }
      responses:
        "200":
          description: Approved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /approvals/{approvalId}/reject:
    parameters:
      - $ref: "#/components/parameters/ApprovalId"
    post:
      tags: [approvals]
      operationId: rejectApproval
      description: |
        Rejects with a required comment; the workflow revises the artifacts using
        the comment as feedback and asks again. Signed-in session only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecisionRequest" }
      responses:
        "200":
          description: Rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      responses:
        "200":
          description: Stored accounts (secrets are never returned).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountList" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [accounts]
      operationId: createAccount
      description: Signed-in session only. The secret is encrypted at rest and can never be read back.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccountRequest" }
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    patch:
      tags: [accounts]
      operationId: updateAccount
      description: Signed-in session only. Omitted fields are kept; `secret` replaces the stored secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAccountRequest" }
      responses:
        "200":
          description: Account updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [accounts]
      operationId: deleteAccount
      responses:
        "204": { description: Account deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /accounts/{accountId}/test:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      tags: [accounts]
      operationId: testAccount
      description: Checks the account works without sending any task data.
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountTestResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /workflow-templates:
    get:
      tags: [templates]
      operationId: listWorkflowTemplates
      responses:
        "200":
          description: Templates (default first).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowTemplateList" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [templates]
      operationId: createWorkflowTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowTemplateInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowTemplate" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /workflow-templates/{templateId}/versions:
    parameters:
      - { name: templateId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [workflows]
      operationId: listWorkflowTemplateVersions
      description: Earlier definitions of the template (newest first).
      responses:
        "200":
          description: Versions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [version, name, description, definition, createdAt]
                      properties:
                        version: { type: integer }
                        name: { type: string }
                        description: { type: string }
                        definition: { type: object, additionalProperties: true }
                        changedBy: { type: string, format: uuid, nullable: true }
                        createdAt: { type: string, format: date-time, description: When it was replaced. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /workflow-templates/{templateId}/versions/{version}/restore:
    parameters:
      - { name: templateId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: version, in: path, required: true, schema: { type: integer } }
    post:
      tags: [workflows]
      operationId: restoreWorkflowTemplateVersion
      description: Saves an earlier definition as the template's new version (the current one is kept in the history).
      responses:
        "200":
          description: Restored.
          content:
            application/json:
