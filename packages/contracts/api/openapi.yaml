openapi: 3.0.3
info:
  title: Wise API
  version: 0.1.0
  description: |
    Control-plane API for Wise, the personal AI engineering platform.

    Authentication: either the `wise_session` cookie (dashboard) or an
    `Authorization: Bearer wise_...` personal API token. State-changing requests
    authenticated by cookie must also send the session's CSRF token in the
    `X-Wise-CSRF` header (returned by `/auth/login` and `/auth/me`).

    Errors use RFC 7807 `application/problem+json`.
servers:
  - url: http://localhost:8080/api/v1
security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: system
  - name: auth
  - name: projects
  - name: repositories
  - name: agents
  - name: models
  - name: runtime
  - name: tasks
  - name: workflows
  - name: approvals
  - name: accounts
  - name: templates
  - name: integrations
  - name: settings
  - name: context

paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      tags: [system]
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Dependencies are reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          $ref: "#/components/responses/Problem"

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in. Sets the `wise_session` cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        "204":
          description: Session ended and cookie cleared.
        "401": { $ref: "#/components/responses/Problem" }
  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        "200":
          description: Current principal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/tokens:
    get:
      tags: [auth]
      operationId: listApiTokens
      responses:
        "200":
          description: Personal API tokens of the current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenList" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [auth]
      operationId: createApiToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiTokenRequest" }
      responses:
        "201":
          description: Token created. The secret is shown only once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedApiToken" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    delete:
      tags: [auth]
      operationId: revokeApiToken
      responses:
        "204": { description: Token revoked. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Projects.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectList" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [projects]
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [projects]
      operationId: getProject
      responses:
        "200":
          description: Project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [projects]
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectRequest" }
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [projects]
      operationId: archiveProject
      description: Archives (soft-deletes) the project.
      responses:
        "204": { description: Project archived. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/resources:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [projects]
      operationId: listProjectResources
      responses:
        "200":
          description: Resources attached to the project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResourceList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [projects]
      operationId: createProjectResource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectResourceRequest" }
      responses:
        "201":
          description: Resource created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResource" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /project-resources/{resourceId}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    delete:
      tags: [projects]
      operationId: deleteProjectResource
      responses:
        "204": { description: Resource deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/repositories:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [repositories]
      operationId: listRepositories
      responses:
        "200":
          description: Repositories of the project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [repositories]
      operationId: createRepository
      description: |
        Registers a repository. Local repositories must live under one of the
        configured `WISE_REPO_ROOTS` and are inspected immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRepositoryRequest" }
      responses:
        "201":
          description: Repository registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /repositories/{repositoryId}:
    parameters:
      - $ref: "#/components/parameters/RepositoryId"
    get:
      tags: [repositories]
      operationId: getRepository
      responses:
        "200":
          description: Repository.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [repositories]
      operationId: updateRepository
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRepositoryRequest" }
      responses:
        "200":
          description: Updated repository.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [repositories]
      operationId: deleteRepository
      description: Unregisters the repository. Files on disk are never touched.
      responses:
        "204": { description: Repository unregistered. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /repositories/{repositoryId}/inspect:
    parameters:
      - $ref: "#/components/parameters/RepositoryId"
    post:
      tags: [repositories]
      operationId: inspectRepository
      description: Refreshes Git information (branch, HEAD SHA, remotes) for a local repository.
      responses:
        "200":
          description: Repository with refreshed Git information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /repositories/{repositoryId}/index:
    parameters:
      - $ref: "#/components/parameters/RepositoryId"
    post:
      tags: [repositories]
      operationId: requestRepositoryIndex
      description: Queues an index job for the repository (reused if one is already pending).
      responses:
        "202":
          description: Index request accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    get:
      tags: [context]
      operationId: getRepositoryIndex
      responses:
        "200":
          description: Index state and recent jobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryIndex" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /repositories/{repositoryId}/status:
    parameters:
      - $ref: "#/components/parameters/RepositoryId"
    get:
      tags: [repositories]
      operationId: getRepositoryStatus
      responses:
        "200":
          description: Indexing and Git status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/repository-relationships:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [repositories]
      operationId: listRepositoryRelationships
      responses:
        "200":
          description: Relationships between repositories of the project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryRelationshipList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [repositories]
      operationId: createRepositoryRelationship
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRepositoryRelationshipRequest" }
      responses:
        "201":
          description: Relationship created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryRelationship" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /repository-relationships/{relationshipId}:
    parameters:
      - $ref: "#/components/parameters/RelationshipId"
    delete:
      tags: [repositories]
      operationId: deleteRepositoryRelationship
      responses:
        "204": { description: Relationship deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /tools:
    get:
      tags: [agents]
      operationId: listTools
      description: The tool catalog agents can use (implemented by the runtime).
      responses:
        "200":
          description: Tools.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolList" }
        "401": { $ref: "#/components/responses/Problem" }
  /agents:
    post:
      tags: [agents]
      operationId: createAgent
      description: Creates an agent defined in the panel. Signed-in session only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      tags: [agents]
      operationId: listAgents
      responses:
        "200":
          description: Current agent definitions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentList" }
        "401": { $ref: "#/components/responses/Problem" }
  /agents/{agentName}:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    put:
      tags: [agents]
      operationId: updateAgent
      description: Saves a new version of the agent's contract and prompt (applies to new runs). Signed-in session only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [agents]
      operationId: deleteAgent
      description: Deletes an agent created in the panel (shipped agents can be disabled instead).
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      tags: [agents]
      operationId: getAgent
      responses:
        "200":
          description: Agent definition with its contract and prompt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /agents/{agentName}/duplicate:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    post:
      tags: [agents]
      operationId: duplicateAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, pattern: "^[a-z][a-z0-9-]*-agent$" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /agents/{agentName}/reset:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    post:
      tags: [agents]
      operationId: resetAgent
      description: Restores the latest shipped definition and prompt.
      responses:
        "200":
          description: Reset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /agents/{agentName}/versions:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    get:
      tags: [agents]
      operationId: listAgentVersions
      responses:
        "200":
          description: Versions, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentVersionList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /agents/{agentName}/versions/{versionId}/restore:
    parameters:
      - $ref: "#/components/parameters/AgentName"
      - name: versionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [agents]
      operationId: restoreAgentVersion
      responses:
        "200":
          description: Restored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /agents/{agentName}/runs:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    get:
      tags: [agents]
      operationId: listAgentRunsForAgent
      responses:
        "200":
          description: Recent runs of the agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRunList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [agents]
      operationId: createAgentRun
      description: Queues a run. `input` is validated against the agent's input_schema.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgentRunRequest" }
      responses:
        "202":
          description: Run queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /agent-runs:
    get:
      tags: [agents]
      operationId: listAgentRuns
      parameters:
        - name: projectId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Recent runs across agents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRunList" }
        "401": { $ref: "#/components/responses/Problem" }
  /agent-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [agents]
      operationId: getAgentRun
      responses:
        "200":
          description: Run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /agent-runs/{runId}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [agents]
      operationId: listAgentRunEvents
      description: |
        Events in order. Live updates are available over the WebSocket at
        `GET /api/v1/events/ws?runId=<id>` (messages are AgentEvent JSON).
      parameters:
        - name: afterSeq
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentEventList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /agent-runs/{runId}/model-calls:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [agents]
      operationId: listAgentRunModelCalls
      responses:
        "200":
          description: Every model call attempt made for the run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelCallList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /agent-runs/{runId}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [agents]
      operationId: cancelAgentRun
      responses:
        "200":
          description: Run cancelled (queued) or cancellation requested (running).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /models:
    get:
      tags: [models]
      operationId: getModelsOverview
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
      responses:
        "200":
          description: Model aliases, provider health and usage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelsOverview" }
        "401": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [tasks]
      operationId: createTask
      description: |
        Creates a task. With `start` (default true) its engineering workflow starts
        right away: product analysis → requirements → scope approval → planning →
        architecture review → plan approval → final report.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
      responses:
        "201":
          description: Task created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /projects/{projectId}/board:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [tasks]
      operationId: getBoard
      description: The project's task board, one entry per column with ordered cards.
      responses:
        "200":
          description: Board.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{projectId}/sprints:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [tasks]
      operationId: listSprints
      responses:
        "200":
          description: The project's sprints (open first, newest first).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SprintList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [tasks]
      operationId: createSprint
      description: Adds a sprint. A project's first sprint becomes its current one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SprintInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sprint" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /sprints/{sprintId}:
    parameters:
      - $ref: "#/components/parameters/SprintId"
    put:
      tags: [tasks]
      operationId: updateSprint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SprintInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sprint" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [tasks]
      operationId: deleteSprint
      description: Deletes a sprint; its tasks stay, without a sprint. A followed sprint comes back on the next sync while the source still has it.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /sprints/{sprintId}/start:
    parameters:
      - $ref: "#/components/parameters/SprintId"
    post:
      tags: [tasks]
      operationId: startSprint
      description: Makes the sprint current. Unfinished tasks created in Wise move to it from the previous sprint.
      responses:
        "204": { description: Started. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /sprints/{sprintId}/complete:
    parameters:
      - $ref: "#/components/parameters/SprintId"
    post:
      tags: [tasks]
      operationId: completeSprint
      description: Closes the sprint. If it was current, the next open sprint takes over and unfinished tasks created in Wise move to it.
      responses:
        "204": { description: Completed. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /context/embeddings:
    get:
      tags: [context]
      operationId: getEmbeddingStatus
      description: Whether semantic search is configured and running, and how far embedding has got.
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbeddingStatus" }
        "401": { $ref: "#/components/responses/Problem" }
  /projects/{projectId}/context/search:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [context]
      operationId: searchContext
      description: Searches the project's code index (symbols, code, docs, config).
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 500 } }
        - { name: kind, in: query, required: false, schema: { $ref: "#/components/schemas/ContextKind" } }
        - { name: repositoryId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextHits" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{projectId}/context/symbols:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [context]
      operationId: listContextSymbols
      parameters:
        - { name: name, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: kind, in: query, required: false, schema: { type: string, maxLength: 30 } }
        - { name: repositoryId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextHits" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{projectId}/context/dependencies:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [context]
      operationId: listContextDependencies
      parameters:
        - { name: repositoryId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DependencyList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /repositories/{repositoryId}/file:
    parameters:
      - $ref: "#/components/parameters/RepositoryId"
    get:
      tags: [context]
      operationId: readRepositoryFile
      description: "Reads a file from the repository's working tree (read-only, within WISE_REPO_ROOTS). Files the secret guard flagged are refused."
      parameters:
        - { name: path, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 1024 } }
      responses:
        "200":
          description: File content.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryFile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /projects/{projectId}/columns:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [tasks]
      operationId: listColumns
      responses:
        "200":
          description: The project's board columns in order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardColumnList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [tasks]
      operationId: createColumn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ColumnInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardColumn" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /columns/{columnId}:
    parameters:
      - name: columnId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [tasks]
      operationId: updateColumn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ColumnInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardColumn" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [tasks]
      operationId: deleteColumn
      description: Deletes a column. Its cards (and status mappings) move to moveTo, which is required when it has cards.
      parameters:
        - name: moveTo
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      parameters:
        - name: projectId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/TaskStatus" }
        - name: archived
          in: query
          required: false
          description: List archived tasks instead of live ones.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Tasks, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskList" }
        "401": { $ref: "#/components/responses/Problem" }
  /tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    patch:
      tags: [tasks]
      operationId: updateTask
      description: Edits a card or moves it (column and/or position) on the board.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTaskRequest" }
      responses:
        "200":
          description: Updated task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    get:
      tags: [tasks]
      operationId: getTask
      responses:
        "200":
          description: Task with its latest workflow, steps, current artifacts and approvals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /tasks/{taskId}/cancel:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [tasks]
      operationId: cancelTask
      description: Cancels the task's active workflow (signed-in session only).
      responses:
        "202":
          description: Cancellation requested (or the task was cancelled directly).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tasks/{taskId}/artifacts:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [tasks]
      operationId: listTaskArtifacts
      description: Every version of the task's artifacts (optionally one kind), newest version first.
      parameters:
        - name: kind
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ArtifactKind" }
      responses:
        "200":
          description: Artifacts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /tasks/{taskId}/run:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [workflows]
      operationId: runTask
      description: |
        Starts the task's workflow (its template with the task's step overrides). With
        `stepByStep`, the workflow pauses after every step so you pass each result on yourself.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunTaskRequest" }
      responses:
        "202":
          description: Workflow queued for start.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowRun" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tasks/{taskId}/workflow:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [workflows]
      operationId: getTaskWorkflow
      description: The task's template, overrides and the plan a run would use (with any issues).
      responses:
        "200":
          description: Task workflow setup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskWorkflow" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [workflows]
      operationId: setTaskWorkflow
      description: Chooses the task's template (null = the default) and per-step overrides.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetTaskWorkflowRequest" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskWorkflow" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /workflows/{workflowId}:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"
    get:
      tags: [workflows]
      operationId: getWorkflow
      responses:
        "200":
          description: Workflow run with its steps.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /workflows/{workflowId}/events:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"
    get:
      tags: [workflows]
      operationId: listWorkflowEvents
      description: |
        Events in order. Live updates: WebSocket `GET /api/v1/events/ws?workflowId=<id>`
        (or `?stream=workflows` for every workflow); messages are WorkflowEvent JSON.
      parameters:
        - name: afterSeq
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowEventList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /workflows/{workflowId}/steps/{stepId}:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"
      - name: stepId
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z][a-z0-9_-]{0,40}$" }
    patch:
      tags: [workflows]
      operationId: changeWorkflowStep
      description: |
        Switches the account/model of a step that has not run yet or is waiting (for a retry or a
        review re-run). Signed-in session only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeStepRequest" }
      responses:
        "200":
          description: Updated plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowPlan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /workflows/{workflowId}/retry:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"
    post:
      tags: [workflows]
      operationId: retryWorkflow
      description: Resumes a workflow parked in `awaiting_retry` by re-running its failed stage (signed-in session only).
      responses:
        "202":
          description: Retry requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowRun" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /artifacts/{artifactId}:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      tags: [tasks]
      operationId: getArtifact
      responses:
        "200":
          description: Artifact version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ApprovalStatus" }
      responses:
        "200":
          description: Approvals, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalList" }
        "401": { $ref: "#/components/responses/Problem" }
  /approvals/{approvalId}:
    parameters:
      - $ref: "#/components/parameters/ApprovalId"
    get:
      tags: [approvals]
      operationId: getApproval
      responses:
        "200":
          description: Approval with the artifact versions it pins.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /approvals/{approvalId}/approve:
    parameters:
      - $ref: "#/components/parameters/ApprovalId"
    post:
      tags: [approvals]
      operationId: approveApproval
      description: |
        Approves exactly the artifact versions identified by `combinedHash`. Refused
        with 409 when any pinned artifact has a newer version or its content changed.
        Signed-in session only; API tokens get 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecisionRequest" }
      responses:
        "200":
          description: Approved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /approvals/{approvalId}/reject:
    parameters:
      - $ref: "#/components/parameters/ApprovalId"
    post:
      tags: [approvals]
      operationId: rejectApproval
      description: |
        Rejects with a required comment; the workflow revises the artifacts using
        the comment as feedback and asks again. Signed-in session only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecisionRequest" }
      responses:
        "200":
          description: Rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      responses:
        "200":
          description: Stored accounts (secrets are never returned).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountList" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [accounts]
      operationId: createAccount
      description: Signed-in session only. The secret is encrypted at rest and can never be read back.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccountRequest" }
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    patch:
      tags: [accounts]
      operationId: updateAccount
      description: Signed-in session only. Omitted fields are kept; `secret` replaces the stored secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAccountRequest" }
      responses:
        "200":
          description: Account updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [accounts]
      operationId: deleteAccount
      responses:
        "204": { description: Account deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /accounts/{accountId}/test:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      tags: [accounts]
      operationId: testAccount
      description: Checks the account works without sending any task data.
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountTestResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /workflow-templates:
    get:
      tags: [templates]
      operationId: listWorkflowTemplates
      responses:
        "200":
          description: Templates (default first).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowTemplateList" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [templates]
      operationId: createWorkflowTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowTemplateInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowTemplate" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /workflow-templates/preview:
    post:
      tags: [templates]
      operationId: previewWorkflowTemplate
      description: Resolves a definition without saving it (live validation for the editor).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateDefinition" }
      responses:
        "200":
          description: Resolved plan and issues.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanPreview" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /workflow-templates/{templateId}:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    get:
      tags: [templates]
      operationId: getWorkflowTemplate
      responses:
        "200":
          description: Template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowTemplate" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [templates]
      operationId: updateWorkflowTemplate
      description: Replaces the template; running workflows keep the plan they started with.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowTemplateInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowTemplate" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [templates]
      operationId: deleteWorkflowTemplate
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/integrations:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [integrations]
      operationId: listIntegrations
      responses:
        "200":
          description: The project's task sources.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationList" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [integrations]
      operationId: createIntegration
      description: Adds a Jira, ClickUp or Trello task source (import only). Signed-in session only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /integrations/{integrationId}:
    parameters:
      - $ref: "#/components/parameters/IntegrationId"
    put:
      tags: [integrations]
      operationId: updateIntegration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [integrations]
      operationId: deleteIntegration
      description: Removes the source; imported tasks stay on the board.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /integrations/{integrationId}/sync:
    parameters:
      - $ref: "#/components/parameters/IntegrationId"
    post:
      tags: [integrations]
      operationId: syncIntegration
      description: Imports now (otherwise every intervalMinutes).
      responses:
        "200":
          description: Sync result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }

  /settings:
    get:
      tags: [settings]
      operationId: listSettings
      description: Every panel-managed setting with its current value, version and shipped default.
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingList" }
        "401": { $ref: "#/components/responses/Problem" }
  /settings/{settingKey}:
    parameters:
      - $ref: "#/components/parameters/SettingKey"
    put:
      tags: [settings]
      operationId: updateSetting
      description: |
        Validates and stores a new value, applied immediately. `version` must be the version the editor
        loaded; a concurrent change returns 409. Signed-in session only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSettingRequest" }
      responses:
        "200":
          description: Saved and applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Setting" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /settings/{settingKey}/reset:
    parameters:
      - $ref: "#/components/parameters/SettingKey"
    post:
      tags: [settings]
      operationId: resetSetting
      description: Restores the shipped default (the previous value stays in the history).
      responses:
        "200":
          description: Reset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Setting" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /settings/{settingKey}/history:
    parameters:
      - $ref: "#/components/parameters/SettingKey"
    get:
      tags: [settings]
      operationId: listSettingHistory
      responses:
        "200":
          description: Earlier versions, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingHistory" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /runtime/v1/index/claim:
    post:
      tags: [runtime]
      operationId: runtimeClaimIndexJob
      description: Claims the oldest queued index job. Requires the runtime service token.
      security: [{ runtimeAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeClaimRequest" }
      responses:
        "200":
          description: Claimed job with the repository, settings and the stored manifest.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexClaim" }
        "204": { description: Nothing queued. }
        "401": { $ref: "#/components/responses/Problem" }
  /runtime/v1/index/{jobId}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [runtime]
      operationId: runtimeIndexHeartbeat
      security: [{ runtimeAuth: [] }]
      responses:
        "204": { description: Done. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /runtime/v1/index/{jobId}/files:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [runtime]
      operationId: runtimeIndexUpload
      description: Stores a batch of indexed files (replacing their symbols and chunks) and removes deleted paths.
      security: [{ runtimeAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IndexUpload" }
      responses:
        "204": { description: Done. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /runtime/v1/index/{jobId}/complete:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [runtime]
      operationId: runtimeIndexComplete
      security: [{ runtimeAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IndexComplete" }
      responses:
        "204": { description: Done. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /runtime/v1/index/{jobId}/fail:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [runtime]
      operationId: runtimeIndexFail
      security: [{ runtimeAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IndexFail" }
      responses:
        "204": { description: Done. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /runtime/v1/runs/{runId}/context/search:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runtime]
      operationId: runtimeContextSearch
      description: Searches the index of the run's project (symbols and text). Results are locations to read, not the code itself.
      security: [{ runtimeAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 500 } }
        - { name: kind, in: query, required: false, schema: { $ref: "#/components/schemas/ContextKind" } }
        - { name: repository, in: query, required: false, schema: { type: string, maxLength: 200 }, description: Repository name. }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        "200":
          description: Results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextHits" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /runtime/v1/runs/{runId}/context/symbols:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runtime]
      operationId: runtimeContextSymbols
      security: [{ runtimeAuth: [] }]
      parameters:
        - { name: name, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: kind, in: query, required: false, schema: { type: string, maxLength: 30 } }
        - { name: repository, in: query, required: false, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: Results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextHits" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /runtime/v1/runs/{runId}/context/dependencies:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runtime]
      operationId: runtimeContextDependencies
      security: [{ runtimeAuth: [] }]
      parameters:
        - { name: repository, in: query, required: false, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: Results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DependencyList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /runtime/v1/runs/claim:
    post:
      tags: [runtime]
      operationId: runtimeClaimRun
      description: Claims the oldest queued run. Requires the runtime service token.
      security: [{ runtimeAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeClaimRequest" }
      responses:
        "200":
          description: Claimed run with everything needed to execute it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeClaim" }
        "204": { description: Nothing queued. }
        "401": { $ref: "#/components/responses/Problem" }
  /runtime/v1/runs/{runId}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runtime]
      operationId: runtimeHeartbeat
      security: [{ runtimeAuth: [] }]
      responses:
        "200":
          description: Lease extended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeHeartbeat" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /runtime/v1/runs/{runId}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runtime]
      operationId: runtimeAppendEvents
      security: [{ runtimeAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeEventsRequest" }
      responses:
        "204": { description: Events stored. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /runtime/v1/runs/{runId}/model-turn:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runtime]
      operationId: runtimeModelTurn
      description: |
        Sends the transcript through the Model Gateway. Alias, fallbacks, schemas,
        tools and budgets come from the run's agent definition, never from the runtime.
      security: [{ runtimeAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelTurnRequest" }
      responses:
        "200":
          description: Parsed model turn.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelTurn" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /runtime/v1/runs/{runId}/complete:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runtime]
      operationId: runtimeCompleteRun
      security: [{ runtimeAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeCompleteRequest" }
      responses:
        "204": { description: Run succeeded. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /runtime/v1/runs/{runId}/fail:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runtime]
      operationId: runtimeFailRun
      security: [{ runtimeAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeFailRequest" }
      responses:
        "204": { description: "Run failed, requeued or cancelled." }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }


components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: wise_session
    bearerAuth:
      type: http
      scheme: bearer
    runtimeAuth:
      type: http
      scheme: bearer
      description: |
        Agent runtime credentials. `/runtime/v1/runs/claim` takes the runtime
        service token (WISE_RUNTIME_TOKEN); every other runtime route takes the
        per-run token returned by the claim.

  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SprintId:
      name: sprintId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RepositoryId:
      name: repositoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentName:
      name: agentName
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]*$" }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SettingKey:
      name: settingKey
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9_]{1,62}$" }
    IntegrationId:
      name: integrationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Error (RFC 7807).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 256 }
    User:
      type: object
      required: [id, username, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { type: string, enum: [admin, member] }
        createdAt: { type: string, format: date-time }
    SessionInfo:
      type: object
      required: [user, authMethod]
      properties:
        user: { $ref: "#/components/schemas/User" }
        authMethod: { type: string, enum: [session, api_token] }
        csrfToken:
          type: string
          description: Present for cookie sessions; send it as `X-Wise-CSRF` on mutating requests.
        expiresAt: { type: string, format: date-time }

    ApiToken:
      type: object
      required: [id, name, prefix, scopes, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        scopes:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
    ApiTokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ApiToken" }
    CreateApiTokenRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        expiresInDays: { type: integer, minimum: 1, maximum: 3650 }
    CreatedApiToken:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: "#/components/schemas/ApiToken" }
        secret:
          type: string
          description: Full bearer token. Shown once; store it securely.

    Project:
      type: object
      required: [id, slug, name, description, metadata, repositoryCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        metadata: { type: object, additionalProperties: true }
        repositoryCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time, nullable: true }
    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Project" }
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 100
          description: Derived from the name when omitted.
        description: { type: string, maxLength: 5000 }
        metadata: { type: object, additionalProperties: true }
    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        metadata: { type: object, additionalProperties: true }

    ProjectResourceKind:
      type: string
      enum: [documentation, external_service, database_definition, other]
    ProjectResource:
      type: object
      required: [id, projectId, kind, name, uri, metadata, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ProjectResourceKind" }
        name: { type: string }
        uri: { type: string }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectResourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProjectResource" }
    CreateProjectResourceRequest:
      type: object
      required: [kind, name]
      properties:
        kind: { $ref: "#/components/schemas/ProjectResourceKind" }
        name: { type: string, minLength: 1, maxLength: 200 }
        uri: { type: string, maxLength: 2000 }
        metadata: { type: object, additionalProperties: true }

    RepositoryRole:
      type: string
      enum: [backend, frontend, mobile, shared_library, infrastructure, documentation, other]
    RepositorySourceType:
      type: string
      enum: [local, remote]
    RepositoryIndexStatus:
      type: string
      enum: [not_indexed, queued, indexing, indexed, failed]
    GitRemote:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string }
    Repository:
      type: object
      required: [id, projectId, name, role, sourceType, gitRemotes, indexStatus, settings, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/RepositoryRole" }
        sourceType: { $ref: "#/components/schemas/RepositorySourceType" }
        localPath: { type: string, nullable: true }
        remoteUrl: { type: string, nullable: true }
        defaultBranch: { type: string, nullable: true }
        currentBranch: { type: string, nullable: true }
        headSha: { type: string, nullable: true }
        gitRemotes:
          type: array
          items: { $ref: "#/components/schemas/GitRemote" }
        gitInspectedAt: { type: string, format: date-time, nullable: true }
        gitError: { type: string, nullable: true }
        indexStatus: { $ref: "#/components/schemas/RepositoryIndexStatus" }
        indexRequestedAt: { type: string, format: date-time, nullable: true }
        indexedSha: { type: string, nullable: true, description: Commit the index reflects. }
        indexedAt: { type: string, format: date-time, nullable: true }
        indexStats: { type: object, additionalProperties: true, description: "files, skipped, symbols, chunks, dependencies" }
        indexError: { type: string, nullable: true }
        settings: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RepositoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Repository" }
    CreateRepositoryRequest:
      type: object
      required: [name, sourceType]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        role: { $ref: "#/components/schemas/RepositoryRole" }
        sourceType: { $ref: "#/components/schemas/RepositorySourceType" }
        localPath:
          type: string
          maxLength: 4096
          description: Absolute path; required when sourceType is `local`.
        remoteUrl:
          type: string
          maxLength: 2000
          description: Required when sourceType is `remote`.
        defaultBranch: { type: string, maxLength: 255 }
        settings: { type: object, additionalProperties: true }
    UpdateRepositoryRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        role: { $ref: "#/components/schemas/RepositoryRole" }
        remoteUrl: { type: string, maxLength: 2000 }
        defaultBranch: { type: string, maxLength: 255 }
        settings: { type: object, additionalProperties: true }
    RepositoryStatus:
      type: object
      required: [repositoryId, indexStatus]
      properties:
        repositoryId: { type: string, format: uuid }
        indexStatus: { $ref: "#/components/schemas/RepositoryIndexStatus" }
        indexRequestedAt: { type: string, format: date-time, nullable: true }
        headSha: { type: string, nullable: true }
        gitInspectedAt: { type: string, format: date-time, nullable: true }
        gitError: { type: string, nullable: true }

    RepositoryRelationshipKind:
      type: string
      enum: [depends_on, consumes_api, shares_library, deploys]
    RepositoryRelationship:
      type: object
      required: [id, projectId, fromRepositoryId, toRepositoryId, kind, note, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        fromRepositoryId: { type: string, format: uuid }
        toRepositoryId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/RepositoryRelationshipKind" }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    RepositoryRelationshipList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RepositoryRelationship" }
    CreateRepositoryRelationshipRequest:
      type: object
      required: [fromRepositoryId, toRepositoryId, kind]
      properties:
        fromRepositoryId: { type: string, format: uuid }
        toRepositoryId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/RepositoryRelationshipKind" }
        note: { type: string, maxLength: 2000 }

    AgentRunStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    AgentSummary:
      type: object
      required: [id, name, version, description, enabled, modelAlias, tools, runCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        phase: { type: integer }
        modelAlias: { type: string }
        tools: { type: array, items: { type: string } }
        runCount: { type: integer, format: int64 }
        lastRunAt: { type: string, format: date-time, nullable: true }
        produces: { type: string, description: Artifact kind of the agent's output in workflows. }
        source:
          type: string
          enum: [shipped, edited, custom]
          description: "shipped: unchanged default; edited: changed in the panel; custom: created in the panel."
        updateAvailable: { type: boolean, description: Edited and a newer shipped version exists. }
        consumes:
          type: object
          description: Input property → artifact kind it is filled from.
          additionalProperties: { type: string }
    AgentList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentSummary" } }
    AgentDetail:
      allOf:
        - $ref: "#/components/schemas/AgentSummary"
        - type: object
          required: [definition, prompt, contentHash, createdAt, cloudAllowed]
          properties:
            definition: { type: object, additionalProperties: true }
            prompt: { type: string }
            contentHash: { type: string }
            createdAt: { type: string, format: date-time }
            cloudAllowed: { type: boolean }
            shippedPrompt: { type: string, nullable: true, description: The shipped default prompt (for diffs). }
            shippedDefinition: { type: object, additionalProperties: true, nullable: true }
    AgentInput:
      type: object
      required: [definition, prompt]
      properties:
        definition: { type: object, additionalProperties: true, description: The agent contract (agent-definition.schema.json). }
        prompt: { type: string, maxLength: 200000 }
    AgentVersion:
      type: object
      required: [id, version, contentHash, source, current, createdAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: string }
        contentHash: { type: string }
        source: { type: string, enum: [code, panel] }
        current: { type: boolean }
        createdAt: { type: string, format: date-time }
    AgentVersionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentVersion" } }
    ToolList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ToolDefinition" } }
    CreateAgentRunRequest:
      type: object
      required: [input]
      properties:
        input: { type: object, additionalProperties: true }
        projectId: { type: string, format: uuid }
        account:
          type: string
          description: Account (or built-in provider) name to use for every model call; skips alias routing.
        model: { type: string, description: Model for `account` (default = the account's default model). }
    AgentRun:
      type: object
      required: [id, agentName, agentDefinitionId, status, input, attempt, maxAttempts, cancelRequested,
                 totalInputTokens, totalOutputTokens, totalCostUsd, createdAt]
      properties:
        id: { type: string, format: uuid }
        agentName: { type: string }
        agentDefinitionId: { type: string, format: uuid }
        projectId: { type: string, format: uuid, nullable: true }
        workflowRunId: { type: string, format: uuid, nullable: true }
        status: { $ref: "#/components/schemas/AgentRunStatus" }
        input: { type: object, additionalProperties: true }
        output: { type: object, additionalProperties: true, nullable: true }
        error: { type: string, nullable: true }
        attempt: { type: integer }
        maxAttempts: { type: integer }
        cancelRequested: { type: boolean }
        totalInputTokens: { type: integer, format: int64 }
        totalOutputTokens: { type: integer, format: int64 }
        totalCostUsd: { type: number, format: double }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    AgentRunList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentRun" } }
    AgentEvent:
      type: object
      required: [runId, seq, type, payload, createdAt]
      properties:
        runId: { type: string, format: uuid }
        seq: { type: integer }
        type: { type: string }
        payload: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    AgentEventList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentEvent" } }
    ModelCall:
      type: object
      required: [id, alias, provider, model, status, inputTokens, outputTokens, costUsd, latencyMs, cacheHit, createdAt]
      properties:
        id: { type: string, format: uuid }
        alias: { type: string }
        provider: { type: string }
        model: { type: string }
        status: { type: string, enum: [ok, error, rejected] }
        error: { type: string, nullable: true }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        costUsd: { type: number, format: double }
        latencyMs: { type: integer }
        cacheHit: { type: boolean }
        createdAt: { type: string, format: date-time }
    ModelCallList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ModelCall" } }
    ModelTarget:
      type: object
      required: [provider, model]
      properties:
        provider: { type: string }
        model: { type: string }
    ModelAlias:
      type: object
      required: [name, description, targets]
      properties:
        name: { type: string }
        description: { type: string }
        targets: { type: array, items: { $ref: "#/components/schemas/ModelTarget" } }
    ModelProvider:
      type: object
      required: [name, type, cloud, healthy]
      properties:
        name: { type: string }
        type: { type: string }
        cloud: { type: boolean }
        healthy: { type: boolean }
        error: { type: string }
    ModelUsage:
      type: object
      required: [agentName, alias, provider, model, calls, errors, inputTokens, outputTokens, costUsd]
      properties:
        agentName: { type: string }
        alias: { type: string }
        provider: { type: string }
        model: { type: string }
        calls: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        costUsd: { type: number, format: double }
    ModelsOverview:
      type: object
      required: [aliases, providers, usage, since]
      properties:
        aliases: { type: array, items: { $ref: "#/components/schemas/ModelAlias" } }
        providers: { type: array, items: { $ref: "#/components/schemas/ModelProvider" } }
        usage: { type: array, items: { $ref: "#/components/schemas/ModelUsage" } }
        since: { type: string, format: date-time }

    TaskStatus:
      type: string
      enum: [open, in_progress, awaiting_approval, completed, failed, cancelled]
    Task:
      type: object
      required: [id, projectId, title, description, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        title: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        column: { type: string, format: uuid, description: The board column the card is in. }
        position: { type: number, format: double }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        labels: { type: array, items: { type: string } }
        source: { type: string, enum: [manual, jira, clickup, trello] }
        externalId: { type: string, nullable: true }
        externalUrl: { type: string, nullable: true }
        externalStatus: { type: string, nullable: true }
        templateId: { type: string, format: uuid, nullable: true }
        sprintId: { type: string, format: uuid, nullable: true }
        archivedAt: { type: string, format: date-time, nullable: true, description: "Set when the task's source stopped returning it (e.g. no longer assigned to you); cleared if it returns." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskPriority:
      type: string
      enum: [none, low, medium, high, urgent]
    UpdateTaskRequest:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        description: { type: string, maxLength: 20000 }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        labels: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
        column: { type: string, format: uuid, description: Move to this column of the project's board. }
        sprint: { type: string, description: "A sprint id of the project, or \"none\" to take the task out of its sprint." }
        position: { type: number, format: double, description: "Order within the column (cards sort ascending); omit to append." }
    BoardCard:
      type: object
      required: [task, pendingApproval]
      properties:
        task: { $ref: "#/components/schemas/Task" }
        workflowId: { type: string, format: uuid, nullable: true }
        workflowStatus: { $ref: "#/components/schemas/WorkflowRunStatus" }
        workflowStage: { type: string, nullable: true }
        templateName: { type: string, nullable: true }
        pendingApproval: { type: boolean }
    Board:
      type: object
      required: [columns]
      properties:
        columns:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/BoardColumn"
              - type: object
                required: [cards]
                properties:
                  cards: { type: array, items: { $ref: "#/components/schemas/BoardCard" } }
    TaskList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Task" } }
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        description: { type: string, maxLength: 20000 }
        start: { type: boolean, default: true }
        stepByStep: { type: boolean, description: "With start, pause after every step." }
        column: { type: string, format: uuid, description: "Board column (default: the backlog column, else the first)." }
        sprintId: { type: string, format: uuid, description: A sprint of the project. }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        labels: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
        templateId: { type: string, format: uuid, description: Workflow template (default template when omitted). }
    TaskDetail:
      type: object
      required: [task, plan, issues, steps, artifacts, approvals]
      properties:
        task: { $ref: "#/components/schemas/Task" }
        workflow: { $ref: "#/components/schemas/WorkflowRun" }
        plan: { $ref: "#/components/schemas/WorkflowPlan" }
        issues:
          description: Problems that would stop the task's workflow from starting.
          type: array
          items: { $ref: "#/components/schemas/PlanIssue" }
        steps: { type: array, items: { $ref: "#/components/schemas/WorkflowStep" } }
        artifacts:
          description: Latest version of each artifact kind.
          type: array
          items: { $ref: "#/components/schemas/Artifact" }
        approvals: { type: array, items: { $ref: "#/components/schemas/Approval" } }
    WorkflowRunStatus:
      type: string
      enum: [pending, running, awaiting_approval, awaiting_retry, completed, failed, cancelled]
    WorkflowRun:
      type: object
      required: [id, taskId, workflowType, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        workflowType: { type: string }
        status: { $ref: "#/components/schemas/WorkflowRunStatus" }
        currentStage: { type: string, nullable: true }
        error: { type: string, nullable: true }
        temporalWorkflowId: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
    WorkflowStepStatus:
      type: string
      enum: [running, awaiting_approval, succeeded, failed, cancelled, skipped]
    WorkflowStep:
      type: object
      required: [id, stage, attempt, status, startedAt]
      properties:
        id: { type: string, format: uuid }
        stage: { type: string }
        attempt: { type: integer }
        status: { $ref: "#/components/schemas/WorkflowStepStatus" }
        agentRunId: { type: string, format: uuid, nullable: true }
        artifactId: { type: string, format: uuid, nullable: true }
        error: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
    WorkflowDetail:
      type: object
      required: [workflow, steps]
      properties:
        workflow: { $ref: "#/components/schemas/WorkflowRun" }
        steps: { type: array, items: { $ref: "#/components/schemas/WorkflowStep" } }
    WorkflowEvent:
      type: object
      required: [workflowRunId, seq, type, payload, createdAt]
      properties:
        workflowRunId: { type: string, format: uuid }
        seq: { type: integer }
        type: { type: string }
        payload: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    WorkflowEventList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkflowEvent" } }
    ArtifactKind:
      type: string
      description: The artifact kind an agent produces (e.g. product_analysis, requirements, plan, final_report).
      pattern: "^[a-z][a-z0-9_]{1,62}$"
    Artifact:
      type: object
      required: [id, taskId, kind, version, content, contentHash, createdAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        workflowRunId: { type: string, format: uuid, nullable: true }
        kind: { $ref: "#/components/schemas/ArtifactKind" }
        version: { type: integer }
        content: { type: object, additionalProperties: true }
        contentHash: { type: string }
        agentRunId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    ArtifactList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Artifact" } }
    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected, superseded, cancelled]
    ApprovalGate:
      type: string
      description: The id of the reviewed workflow step.
    ArtifactRef:
      type: object
      required: [artifactId, kind, version, hash]
      properties:
        artifactId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ArtifactKind" }
        version: { type: integer }
        hash: { type: string }
    Approval:
      type: object
      required: [id, workflowRunId, taskId, gate, round, status, artifacts, combinedHash, notes, createdAt]
      properties:
        id: { type: string, format: uuid }
        workflowRunId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        taskTitle: { type: string }
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        gate: { $ref: "#/components/schemas/ApprovalGate" }
        round: { type: integer }
        status: { $ref: "#/components/schemas/ApprovalStatus" }
        artifacts: { type: array, items: { $ref: "#/components/schemas/ArtifactRef" } }
        combinedHash:
          type: string
          description: Send this back when deciding; it identifies exactly what was reviewed.
        notes: { type: array, items: { type: string } }
        comment: { type: string, nullable: true }
        decidedBy: { type: string, format: uuid, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    ApprovalList:
      type: object
      required: [items, pendingCount]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Approval" } }
        pendingCount: { type: integer }
    ApprovalDetail:
      type: object
      required: [approval, artifacts]
      properties:
        approval: { $ref: "#/components/schemas/Approval" }
        artifacts:
          description: The pinned artifact versions, with content.
          type: array
          items: { $ref: "#/components/schemas/Artifact" }
    ApprovalDecisionRequest:
      type: object
      required: [combinedHash]
      properties:
        combinedHash: { type: string, minLength: 64, maxLength: 64 }
        comment: { type: string, maxLength: 10000 }
    AccountKind:
      type: string
      enum: [claude_code, codex_cli, openai_compatible, jira, clickup, trello]
    Account:
      type: object
      required: [id, name, kind, baseUrl, defaultModel, cloud, enabled, hasSecret, secretHint, metadata, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/AccountKind" }
        baseUrl: { type: string }
        defaultModel: { type: string }
        cloud: { type: boolean, description: Requests leave this machine (subject to the cloud policy). }
        enabled: { type: boolean }
        hasSecret: { type: boolean }
        secretHint: { type: string, description: e.g. "…abcd"; the secret itself is never returned. }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AccountList:
      type: object
      required: [items, secretsEnabled, builtinProviders]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Account" } }
        secretsEnabled: { type: boolean, description: False when WISE_SECRETS_KEY is not configured. }
        builtinProviders:
          description: Providers from configs/models/models.yaml, also selectable per step.
          type: array
          items: { type: string }
    CreateAccountRequest:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        kind: { $ref: "#/components/schemas/AccountKind" }
        baseUrl: { type: string, maxLength: 500 }
        defaultModel: { type: string, maxLength: 200 }
        cloud: { type: boolean }
        enabled: { type: boolean }
        metadata: { type: object, additionalProperties: true }
        secret: { type: string, maxLength: 65536, writeOnly: true }
    UpdateAccountRequest:
      type: object
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        baseUrl: { type: string, maxLength: 500 }
        defaultModel: { type: string, maxLength: 200 }
        cloud: { type: boolean }
        enabled: { type: boolean }
        metadata: { type: object, additionalProperties: true }
        secret: { type: string, maxLength: 65536, writeOnly: true }
    AccountTestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: string }
    RunTaskRequest:
      type: object
      properties:
        stepByStep: { type: boolean, description: Pause after every step. }
    TemplateStep:
      type: object
      required: [id, agent]
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9_-]{0,40}$" }
        name: { type: string, maxLength: 100 }
        agent: { type: string }
        account: { type: string, description: Account or models.yaml provider; empty = the agent's default routing. }
        model: { type: string }
        review: { type: boolean, description: Pause after this step until its result is approved. }
        reviewIncludes:
          type: array
          description: Earlier step ids whose outputs the same review pins.
          items: { type: string }
        reviseFrom: { type: string, description: Earliest step re-run when changes are requested. }
        enabled: { type: boolean }
    TemplateDefinition:
      type: object
      required: [steps]
      properties:
        steps: { type: array, items: { $ref: "#/components/schemas/TemplateStep" } }
        source:
          type: object
          properties:
            autoStart: { type: boolean, description: Run as soon as a task is created or imported. }
        destination:
          type: object
          properties:
            column: { $ref: "#/components/schemas/ColumnRole" }
        finalReport: { type: boolean }
        maxRevisions: { type: integer, minimum: 0, maximum: 50 }
    EmbeddingStatus:
      type: object
      required: [configured, available, cloud, allowCloud, embedded, pending]
      properties:
        configured: { type: boolean }
        available: { type: boolean, description: Configured and able to run now. }
        provider: { type: string }
        model: { type: string }
        cloud: { type: boolean }
        allowCloud: { type: boolean }
        problem: { type: string, description: Why semantic search cannot run right now. }
        embedded: { type: integer, format: int64 }
        pending: { type: integer, format: int64 }
        lastError: { type: string }
        lastRun: { type: string, format: date-time, nullable: true }
    ContextKind:
      type: string
      enum: [symbol, code, doc, config]
    ContextHit:
      type: object
      required: [kind, repository, repositoryId, path, startLine, endLine, title, snippet, score, why, stale]
      properties:
        kind: { type: string, description: "symbol, code, doc or config" }
        repository: { type: string }
        repositoryId: { type: string, format: uuid }
        path: { type: string }
        language: { type: string }
        startLine: { type: integer }
        endLine: { type: integer }
        title: { type: string }
        snippet: { type: string }
        score: { type: number, format: double }
        why: { type: string }
        indexedSha: { type: string }
        stale: { type: boolean, description: "HEAD moved since this was indexed; read the file to be sure." }
    ContextHits:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ContextHit" } }
        note: { type: string }
    Dependency:
      type: object
      required: [ecosystem, name, version, dev, manifest, repository]
      properties:
        ecosystem: { type: string }
        name: { type: string }
        version: { type: string }
        dev: { type: boolean }
        manifest: { type: string }
        repository: { type: string }
    DependencyList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Dependency" } }
    IndexJob:
      type: object
      required: [id, status, reason, stats, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, done, failed, cancelled] }
        reason: { type: string }
        commitSha: { type: string, nullable: true }
        stats: { type: object, additionalProperties: true }
        error: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    RepositoryIndex:
      type: object
      required: [status, stale, stats, jobs]
      properties:
        status: { $ref: "#/components/schemas/RepositoryIndexStatus" }
        indexedSha: { type: string, nullable: true }
        headSha: { type: string, nullable: true }
        indexedAt: { type: string, format: date-time, nullable: true }
        stale: { type: boolean }
        stats: { type: object, additionalProperties: true }
        error: { type: string, nullable: true }
        jobs: { type: array, items: { $ref: "#/components/schemas/IndexJob" } }
    RepositoryFile:
      type: object
      required: [path, content, lines, truncated]
      properties:
        path: { type: string }
        content: { type: string }
        lines: { type: integer }
        truncated: { type: boolean }
        headSha: { type: string, nullable: true }
    IndexClaim:
      type: object
      required: [jobId, token, leaseSeconds, repository, settings, manifest]
      properties:
        jobId: { type: string, format: uuid }
        token: { type: string, description: Per-job token for the other index routes. }
        leaseSeconds: { type: integer }
        repository:
          type: object
          required: [id, name, localPath]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            localPath: { type: string }
        settings: { type: object, additionalProperties: true }
        manifest: { type: object, additionalProperties: { type: string }, description: "path -> content hash already stored" }
    IndexSymbol:
      type: object
      required: [name, kind, startLine, endLine]
      properties:
        name: { type: string, maxLength: 200 }
        kind: { type: string, maxLength: 30 }
        signature: { type: string }
        parent: { type: string }
        exported: { type: boolean }
        startLine: { type: integer, minimum: 1 }
        endLine: { type: integer, minimum: 1 }
        doc: { type: string }
    IndexChunk:
      type: object
      required: [kind, startLine, endLine, content]
      properties:
        kind: { type: string, enum: [code, doc, config] }
        startLine: { type: integer, minimum: 1 }
        endLine: { type: integer, minimum: 1 }
        heading: { type: string }
        content: { type: string }
    IndexFile:
      type: object
      required: [path, contentHash]
      properties:
        path: { type: string, maxLength: 1024 }
        language: { type: string }
        size: { type: integer, minimum: 0 }
        contentHash: { type: string, maxLength: 128 }
        lines: { type: integer, minimum: 0 }
        imports: { type: array, items: { type: string } }
        skippedReason: { type: string, enum: ["", secret, too_large, binary, unreadable] }
        symbols: { type: array, items: { $ref: "#/components/schemas/IndexSymbol" } }
        chunks: { type: array, items: { $ref: "#/components/schemas/IndexChunk" } }
    IndexUpload:
      type: object
      properties:
        files: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/IndexFile" } }
        deleted: { type: array, maxItems: 20000, items: { type: string } }
    IndexComplete:
      type: object
      properties:
        commitSha: { type: string, maxLength: 64 }
        dependencies: { type: array, items: { $ref: "#/components/schemas/IndexDependency" } }
        stats: { type: object, additionalProperties: true }
    IndexFail:
      type: object
      required: [error]
      properties:
        error: { type: string, maxLength: 4000 }
    IndexDependency:
      type: object
      required: [ecosystem, name, manifest]
      properties:
        ecosystem: { type: string, maxLength: 20 }
        name: { type: string, maxLength: 200 }
        version: { type: string }
        dev: { type: boolean }
        manifest: { type: string }
    Sprint:
      type: object
      required: [id, projectId, name, closed, current, taskCount, openCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        startsOn: { type: string, format: date, nullable: true }
        endsOn: { type: string, format: date, nullable: true }
        closed: { type: boolean }
        current: { type: boolean, description: The project's current sprint. }
        taskCount: { type: integer }
        openCount: { type: integer, description: Tasks not in a done-role list. }
        sourceName: { type: string, nullable: true, description: The task source this sprint is followed from. }
        createdAt: { type: string, format: date-time }
    SprintList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Sprint" } }
    SprintInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        startsOn: { type: string, format: date, nullable: true }
        endsOn: { type: string, format: date, nullable: true }
    ColumnRole:
      type: string
      enum: [backlog, todo, in_progress, review, done]
      description: "What a column means to workflows: runs move cards to in_progress, then review, then the template's destination role."
    BoardColumn:
      type: object
      required: [id, projectId, name, position]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        position: { type: number, format: double }
        role: { $ref: "#/components/schemas/ColumnRole" }
        color: { type: string, nullable: true }
        wipLimit: { type: integer, nullable: true }
    BoardColumnList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BoardColumn" } }
    ColumnInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        role: { type: string, enum: ["", backlog, todo, in_progress, review, done], description: "Empty = no role. Taking a role moves it from the column that had it." }
        color: { type: string, description: "#rrggbb or empty." }
        wipLimit: { type: integer, minimum: 1, maximum: 1000, nullable: true }
        position: { type: number, format: double, description: Order on the board (columns sort ascending). }
    WorkflowTemplate:
      type: object
      required: [id, name, description, definition, version, isDefault, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, nullable: true }
        name: { type: string }
        description: { type: string }
        definition: { $ref: "#/components/schemas/TemplateDefinition" }
        version: { type: integer }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkflowTemplateList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkflowTemplate" } }
    WorkflowTemplateInput:
      type: object
      required: [name, definition]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        definition: { $ref: "#/components/schemas/TemplateDefinition" }
        isDefault: { type: boolean }
    PlanStep:
      type: object
      required: [id, name, agent, kind, enabled, review, reviewKinds]
      properties:
        id: { type: string }
        name: { type: string }
        agent: { type: string }
        kind: { type: string, description: Artifact kind the step produces. }
        account: { type: string }
        model: { type: string }
        enabled: { type: boolean }
        review: { type: boolean }
        reviewKinds: { type: array, items: { type: string } }
        reviseFrom: { type: string }
        consumes:
          type: object
          additionalProperties: { type: string }
    WorkflowPlan:
      type: object
      required: [steps, finalReport, maxRevisions, destination, stepByStep]
      properties:
        templateId: { type: string }
        templateName: { type: string }
        templateVersion: { type: integer }
        steps: { type: array, items: { $ref: "#/components/schemas/PlanStep" } }
        finalReport: { type: boolean }
        maxRevisions: { type: integer }
        destination: { type: string }
        stepByStep: { type: boolean }
    PlanIssue:
      type: object
      required: [message]
      properties:
        stepId: { type: string }
        message: { type: string }
    PlanPreview:
      type: object
      required: [plan, issues]
      properties:
        plan: { $ref: "#/components/schemas/WorkflowPlan" }
        issues: { type: array, items: { $ref: "#/components/schemas/PlanIssue" } }
    StepOverride:
      type: object
      properties:
        enabled: { type: boolean }
        account: { type: string }
        model: { type: string }
        review: { type: boolean }
    SetTaskWorkflowRequest:
      type: object
      properties:
        templateId: { type: string, format: uuid, nullable: true }
        steps:
          type: object
          description: Per-step overrides keyed by step id.
          additionalProperties: { $ref: "#/components/schemas/StepOverride" }
    TaskWorkflow:
      type: object
      required: [template, steps, plan, issues]
      properties:
        template: { $ref: "#/components/schemas/WorkflowTemplate" }
        steps:
          type: object
          additionalProperties: { $ref: "#/components/schemas/StepOverride" }
        plan: { $ref: "#/components/schemas/WorkflowPlan" }
        issues: { type: array, items: { $ref: "#/components/schemas/PlanIssue" } }
    ChangeStepRequest:
      type: object
      properties:
        account: { type: string, description: Empty string = back to the agent's default routing. }
        model: { type: string }
    IntegrationKind:
      type: string
      enum: [jira, clickup, trello]
    SyncResult:
      type: object
      required: [total, created, updated, unchanged, started, at]
      properties:
        total: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
        started: { type: integer }
        archived: { type: integer, description: Tasks the source no longer returns (archived). }
        restored: { type: integer, description: Archived tasks the source returned again. }
        errors: { type: array, items: { type: string } }
        at: { type: string, format: date-time }
    Integration:
      type: object
      required: [id, projectId, kind, name, accountId, config, statusMap, autoStart, intervalMinutes, enabled, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/IntegrationKind" }
        name: { type: string }
        accountId: { type: string, format: uuid }
        config: { type: object, additionalProperties: true, description: "jira: jql; clickup: listId; trello: boardId, lists[]" }
        statusMap:
          type: object
          description: External status (lowercase) → board column.
          additionalProperties: { type: string, format: uuid }
        defaultTemplateId: { type: string, format: uuid, nullable: true }
        sprintId: { type: string, format: uuid, nullable: true }
        autoStart: { type: boolean }
        intervalMinutes: { type: integer }
        enabled: { type: boolean }
        lastSyncedAt: { type: string, format: date-time, nullable: true }
        lastResult: { $ref: "#/components/schemas/SyncResult" }
        lastError: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IntegrationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Integration" } }
    IntegrationInput:
      type: object
      required: [name, kind, accountId]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { $ref: "#/components/schemas/IntegrationKind" }
        accountId: { type: string, format: uuid }
        config: { type: object, additionalProperties: true }
        statusMap:
          type: object
          additionalProperties: { type: string, format: uuid }
        defaultTemplateId: { type: string, format: uuid, nullable: true }
        sprintId: { type: string, format: uuid, nullable: true, description: "Fixed sprint for this source's tasks (follow modes create their own sprints)." }
        autoStart: { type: boolean }
        intervalMinutes: { type: integer, minimum: 5, maximum: 1440 }
        enabled: { type: boolean }
    Setting:
      type: object
      required: [key, title, description, value, version, updatedAt]
      properties:
        key: { type: string }
        title: { type: string }
        description: { type: string }
        value: { description: The current value (JSON). }
        default: { description: "The shipped default (JSON), when available." }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string, format: uuid, nullable: true }
    SettingList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Setting" } }
    UpdateSettingRequest:
      type: object
      required: [value, version]
      properties:
        value: { description: The new value (JSON). }
        version: { type: integer, description: The version the editor loaded. }
    SettingHistory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [version, value, createdAt]
            properties:
              version: { type: integer }
              value: {}
              updatedBy: { type: string, format: uuid, nullable: true }
              createdAt: { type: string, format: date-time }
    RuntimeClaimRequest:
      type: object
      required: [runtimeId]
      properties:
        runtimeId: { type: string, minLength: 1, maxLength: 200 }
    ToolDefinition:
      type: object
      required: [name, description, inputSchema, sideEffects, permissionsRequired]
      properties:
        name: { type: string }
        description: { type: string }
        inputSchema: { type: object, additionalProperties: true }
        sideEffects: { type: string, enum: [none, read, write] }
        permissionsRequired: { type: array, items: { type: string } }
    RuntimeRepository:
      type: object
      required: [id, name, role, sourceType]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string }
        sourceType: { type: string }
        localPath: { type: string, nullable: true }
        remoteUrl: { type: string, nullable: true }
        currentBranch: { type: string, nullable: true }
        headSha: { type: string, nullable: true }
    RuntimeProject:
      type: object
      required: [id, name, slug, description, repositories]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        repositories: { type: array, items: { $ref: "#/components/schemas/RuntimeRepository" } }
    RuntimeClaim:
      type: object
      required: [run, runToken, leaseSeconds, definition, prompt, tools]
      properties:
        run: { $ref: "#/components/schemas/AgentRun" }
        runToken: { type: string, description: Bearer token scoped to this run; invalid once it ends. }
        leaseSeconds: { type: integer }
        definition: { type: object, additionalProperties: true }
        prompt: { type: string }
        tools: { type: array, items: { $ref: "#/components/schemas/ToolDefinition" } }
        project: { $ref: "#/components/schemas/RuntimeProject" }
    RuntimeHeartbeat:
      type: object
      required: [cancelRequested, leaseSeconds]
      properties:
        cancelRequested: { type: boolean }
        leaseSeconds: { type: integer }
    RuntimeEvent:
      type: object
      required: [type, payload]
      properties:
        type: { type: string, enum: [tool.call, tool.result, agent.message, output.invalid, artifact.created] }
        payload: { type: object, additionalProperties: true }
    RuntimeEventsRequest:
      type: object
      required: [events]
      properties:
        events: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/RuntimeEvent" } }
    TurnMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant, tool] }
        content: { type: string, maxLength: 400000 }
        name: { type: string }
    ModelTurnRequest:
      type: object
      required: [messages]
      properties:
        messages: { type: array, minItems: 1, maxItems: 400, items: { $ref: "#/components/schemas/TurnMessage" } }
    TurnToolCall:
      type: object
      required: [tool, arguments]
      properties:
        tool: { type: string }
        arguments: { type: object, additionalProperties: true }
    TokenUsage:
      type: object
      required: [inputTokens, outputTokens]
      properties:
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
    ModelTurn:
      type: object
      required: [action, alias, provider, model, usage, costUsd, cacheHit, latencyMs]
      properties:
        action: { type: string, enum: [call_tools, final, invalid] }
        thought: { type: string }
        toolCalls: { type: array, items: { $ref: "#/components/schemas/TurnToolCall" } }
        final: { type: object, additionalProperties: true, nullable: true }
        parseError: { type: string }
        rawText: { type: string }
        alias: { type: string }
        provider: { type: string }
        model: { type: string }
        usage: { $ref: "#/components/schemas/TokenUsage" }
        costUsd: { type: number, format: double }
        cacheHit: { type: boolean }
        latencyMs: { type: integer, format: int64 }
    RuntimeCompleteRequest:
      type: object
      required: [output]
      properties:
        output: { type: object, additionalProperties: true }
    RuntimeFailRequest:
      type: object
      required: [error]
      properties:
        error: { type: string, maxLength: 10000 }
        retryable: { type: boolean, default: false }
        cancelled: { type: boolean, default: false }
