# Continuous integration: lint, tests (Go with Postgres, Python runtime,
# dashboard), generated code up to date, and image builds with smoke tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17 # infrastructure/docker/versions.env
        env:
          POSTGRES_USER: wise
          POSTGRES_PASSWORD: wise
          POSTGRES_DB: wise
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wise -d wise" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      WISE_TEST_DATABASE_URL: postgres://wise:wise@127.0.0.1:5432/wise?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and format
        run: |
          go vet ./...
          test -z "$(gofmt -l apps migrations packages)"
      - name: Generated Go code is up to date
        run: |
          go generate ./apps/api/...
          git diff --exit-code -- apps/api
      - name: Tests (unit and integration)
        run: go test -count=1 ./...

  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ripgrep (search_code uses it, as in the runtime image)
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API types are up to date
        run: |
          pnpm -C apps/dashboard gen:api
          git diff --exit-code -- apps/dashboard/src/api
      - run: pnpm -C apps/dashboard typecheck
      - run: pnpm -C apps/dashboard test
      - run: pnpm -C apps/dashboard build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: |
          docker build -q -t wise-api:ci -f apps/api/Dockerfile --build-arg INSTALL_CLAUDE_CODE=false .
          docker build -q -t wise-runtime:ci -f apps/agent-runtime/Dockerfile .
          docker build -q -t wise-dashboard:ci -f apps/dashboard/Dockerfile .
          docker build -q -t wise-toolchain-node:ci infrastructure/toolchains/node
          docker build -q -t wise-toolchain-go:ci infrastructure/toolchains/go
          docker build -q -t wise-toolchain-python:ci infrastructure/toolchains/python
          docker build -q -t wise-coding-clis:ci infrastructure/coding-clis
      - name: Smoke tests
        run: |
          set -eux
          # API image: every service command is in the binary; git is there for the executor and the git worker.
          docker run --rm wise-api:ci help | grep -q git-worker
          docker run --rm --entrypoint git wise-api:ci --version
          docker run --rm --entrypoint git wise-api:ci --exec-path >/dev/null
          # Runtime image imports.
          docker run --rm wise-runtime:ci python -c "import wise_runtime"
          # Dashboard serves the app.
          docker run -d --name dash --add-host wise-api:127.0.0.1 -p 18080:8080 wise-dashboard:ci  # nginx resolves its upstream at start
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/ | grep -qi '<div id="root"' && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/ | grep -qi '<div id="root"'
          docker rm -f dash
          # Toolchains: git plus the language tools the sandboxes need.
          docker run --rm wise-toolchain-node:ci sh -c 'git --version && node --version && bash --version >/dev/null && rg --version >/dev/null'
          docker run --rm wise-toolchain-go:ci sh -c 'git --version && go version && bash --version >/dev/null && rg --version >/dev/null'
          docker run --rm wise-toolchain-python:ci sh -c 'git --version && python3 --version && bash --version >/dev/null && rg --version >/dev/null'
