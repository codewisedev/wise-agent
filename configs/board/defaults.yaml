# Default board columns for new projects (editable in Settings → Board; each
# project can then add, rename, reorder and remove its own columns).
# Roles let workflows and task sources place cards: in_progress when a run
# starts, review when it waits for you, done (or the template's destination)
# when it completes; imported items without a mapping land in todo.
columns:
  - { name: Backlog, role: backlog, color: "#64748b" }
  - { name: To do, role: todo, color: "#3b82f6" }
  - { name: In progress, role: in_progress, color: "#f59e0b" }
  - { name: Review, role: review, color: "#a855f7" }
  - { name: Done, role: done, color: "#22c55e" }
